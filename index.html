<script>
  const newsItems = [{"station": "BBC 英国", "title": "US attorney general dodges questions about Nvidia investigation", "videoId": "XZ966rNQsi4", "audioUrl": "audio/01_BBC_英国.mp3", "script": "BBC 英国の主要ニュースです。\nTopic 1: US attorney general dodges questions about Nvidia investigation. How Nvidia is reacting to Jensen Huang's return as CEO US Attorney General Todd Blanche has backed Nvidia as a \"good corporate citizen\" while refusing to comment on whether it was being investigated by the administration. Blanche said he had no information about Jensen Huang's security clearance status, as lawmakers demand answers about President Donald Trump's involvement in Huang's reinstatement as the AI microchip maker's chief executive. Huang was given his job back less than two weeks after being forced to resign over revelations of extramarital affairs, including one with an alleged Chinese spy. Asked several times on Tuesday if the justice department or FBI had investigated Huang, Blanche responded: \"I don't know what you're talking about.\" Huang is still set to appear before Congress next week, where he will be questioned over his relationship with a former executive for Megaspeed - the alleged China spy - due to national security concerns. The US commerce department has also announced it was preparing to blacklist tech company Megaspeed, the Singapore-based Nvidia customer that has been suspected of helping divert advanced chips to China. In a joint statement last week, the commerce and justice departments said they began investigating Megaspeed in 2024 \"for potential export control violations\" . But speaking to reporters on Tuesday, Blanche said the latter department has \"hundreds, if not more\" export investigations occurring at any one time. \"So when you say the export investigation is still ongoing, I don't know what you're talking about,\" he said. Asked if he was satisfied Nvidia had been co-operative with any efforts to get to the bottom of whether the company or Huang potentially knew about chips being diverted to China, Blanche said: \"I have no reason to stand up here and say Nvidia is anything but a good corporate citizen.\" \"Obviously, if Nvidia was the target or was subject to some criminal investigation or they were obstructing or thwarting our investigation, then that wouldn't be the message that that the president is saying to the American people ... It shouldn't be what my message would be either,\" Blanche said.\nTopic 2: Indian government has 'lost the plot', says 'cockroach' leader barred from UK flight. Saurav Das says immigration authorities at Delhi airport told him his passport had been flagged.\nTopic 3: Land mine casualties soar in Syria, two years after war. Nearly 1,000 children are among those killed or injured by explosives left over from the conflict, figures show."}, {"station": "ABC 米国", "title": "Hungary’s Magyar says he will visit Ukraine in a sign of mending relations", "videoId": "z9OGOMGCzT4", "audioUrl": "audio/02_ABC_米国.mp3", "script": "ABC 米国の主要ニュースです。\nTopic 1: Hungary’s Magyar says he will visit Ukraine in a sign of mending relations. Hungarian Prime Minister Péter Magyar plans to visit Ukraine soon, signaling improved relations between the two countries BUDAPEST, Hungary -- Hungarian Prime Minister Péter Magyar said Monday that he will soon travel to Ukraine in a sign that the icy relations between the two neighboring countries, pushed to the breaking point by former Prime Minister Viktor Orbán , are improving. Magyar's planned visit to the embattled country comes after Kyiv passed a law in October — long demanded by Hungary’s government — that expanded language rights for a Hungarian ethnic minority in western Ukraine. Speaking to lawmakers on Monday, Magyar did not announce a date for his visit, but said it would take place in the western Ukrainian region of Zakarpattia, home to tens of thousands of ethnic Hungarians. It will be the first visit to the region by a Hungarian head of government since 2015. Magyar denounced Russian strikes that hit the mountainous region last week and said he would travel there “soon ... to personally deliver the support of the motherland to our Hungarian brethren.” Before Magyar and his Tisza party won a landslide election in April, Hungary's government under Orbán pursued a hostile approach to Ukraine, repeatedly blocking aid to Kyiv and holding up European Union sanctions against Russia, all while maintaining cordial ties with Russian President Vladimir Putin. Orbán's government had also depicted Ukraine as a threat to Hungary's security , and cast President Volodymyr Zelenskyy as an enemy, using his likeness in taxpayer-funded political campaigns. Since taking office, Magyar's government has taken a markedly different approach, expressing solidarity with Ukraine and designating Russia a national security threat. In an interview last month with The Associated Press, Magyar said he saw “a chance to open a new chapter in Ukrainian-Hungarian relations.” On Monday, Magyar expressed his sympathy “to the Hungarians of Zakarpattia and to the entire Ukrainian people, who for nearly five years have been waging a superhuman struggle for their mere survival.” “I want to make clear what every well-meaning person in the world knows: that Russia is the aggressor and Ukraine, the Ukrainian people, are the victims,” he said. “We stand by our Hungarian compatriots in Zakarpattia and for the Ukrainian people who have come under attack, even if someone in Moscow doesn't like it.” Magyar also said he would attend negotiations later this week on the EU's next seven-year budget, but that Hungary would insist that the bloc's financial support for Ukraine be handled separately. 24/7 coverage of breaking news and live events\nTopic 2: Houthi rebels close in on Aden as Yemeni forces dig in behind a fortified line. Iran-backed Houthi rebels have advanced close to Yemen's government seat in Aden\nTopic 3: North Korea reviews Switzerland relations after sanctions on youth camp linked to w"}, {"station": "AlJazeera 中東", "title": "Turkish military helicopter crash kills five in western Turkiye", "videoId": "xNqXg7brkg8", "audioUrl": "audio/03_AlJazeera_中東.mp3", "script": "AlJazeera 中東の主要ニュースです。\nTopic 1: Turkish military helicopter crash kills five in western Turkiye. The Ministry of National Defence did not elaborate on the cause of the crash, days after another deadly army helicopter accident. A Turkish Air Force helicopter has crashed in western Turkiye, killing five crew members, according to the country’s Ministry of National Defence. The accident occurred on Tuesday, 12 days after similar accident killed four people. “An AS-532 helicopter belonging to our air force crashed after taking off from Eskisehir for training purposes,” the ministry said in a statement on Tuesday. “The wreckage of the helicopter has been reached and search and rescue operations are continuing.” The ministry did not specify the cause of the crash. Eskisehir is home to the air force’s 1st Main Jet Base Command. Media footage showed emergency teams at the scene of the crash near Yorukakcayir village, about 15km (nine miles) west of Eskisehir city centre. The AS-532 Cougar is a twin-engine, French-made multi-purpose helicopter that is used by militaries across the world. On November 12, an army Sikorsky S-70 crashed near Malatya in southern Turkiye , killing four crew members. No official explanation has been given since.\nTopic 2: Putin says retaliation ‘inevitable’ after Ukraine hit Russian oil plants. Ukrainian attacks subsided after Trump's mid-October declaration of an energy ceasefire, but picked up again afterwards.\nTopic 3: China Southern Airlines unit to buy 50 Boeing 737-8 planes. The agreement marks the US planemaker's first major order from China in almost a decade."}, {"station": "DW ドイツ", "title": "Ukraine's bid for NATO membership and more air defense remains controversial", "videoId": "MhCMsmjiGMw", "audioUrl": "audio/04_DW_ドイツ.mp3", "script": "DW ドイツの主要ニュースです。\nTopic 1: Ukraine's bid for NATO membership and more air defense remains controversial. Ukrainian President Volodymyr Zelenskyy is calling for the rapid acceptance of his country into NATO. However, the necessary unanimity for this is lacking, as shown during the NATO Parliamentary Assembly in Berlin. It took a while for the video call to connect. When Volodymyr Zelenskyy finally greeted the delegates in Berlin, applause broke out. The Ukrainian president appealed to the gathered parliamentarians from 32 NATO member states to keep supporting his country, especially against the massive aerial bombardment from Russia . \"Dear friends, winter is now ahead of us. And of course, our number one priority is air defense,\" Zelenskyy told the delegates. His country urgently needs more Patriot and other comprehensive anti-air attack systems. \"And your countries have them. Missiles that can stop Russian ballistic missiles should not be sitting in warehouses collecting dust. And we say this openly. Please help us with this.\" To view this video please enable JavaScript, and consider upgrading to a web browser that supports HTML5 video Zelenskyy renewed his call for his country to join the NATO military alliance. That issue is not for the NATO Parliamentary Assembly, which was gathered for its 72nd annual meeting in Berlin, to decide. But it was important to the Ukrainian president to reiterate his request. After the war ends, Ukraine needs strong security guarantees and NATO could ensure those. \"Wouldn't it be more effective to simply bring Ukraine into NATO?\" Zelenskyy asked, arguing: \"Wouldn't that be better for all of us, for everyone? Cheaper to put in place? And more reliable when it comes to actually protecting security?\" There is conflict among NATO members about the possibility of admitting Ukraine. The alliance has affirmed multiple times that the path to membership stands open to Ukraine — however, in the long term rather than the near future. This is primarily because of the ongoing war and the possible assistance obligations of other NATO countries for Ukraine, which was attacked by Russia. NATO Secretary General Mark Rutte rejected the Ukrainian demands at the summit, which for the first time in 26 years was held in Berlin. Ukraine had entry prospects; however, NATO members currently lack unanimity on this issue. NATO alone decides who becomes a member. \"There is total clarity on that within the alliance,\" Rutte said. To view this video please enable JavaScript, and consider upgrading to a web browser that supports HTML5 video German Chancellor Friedrich Merz advocated for Ukraine to receive security guarantees similar to what NATO members have, in the instance of a possible ceasefire. In retrospect, it was clear \"what a mistake it was not to follow the American suggestion back in 2008 at the NATO summit in Bucharest to admit Ukraine as a member,\" Merz said at a joint press conference following a meeting with Rutte. Whether or not a NATO entry for U"}, {"station": "France24 フランス", "title": "The Bukele method: will Salvadoran leader's strong-arm tactics work for Haiti?", "videoId": "qs5UYx13S-8", "audioUrl": "audio/05_France24_フランス.mp3", "script": "France24 フランスの主要ニュースです。\nTopic 1: The Bukele method: will Salvadoran leader's strong-arm tactics work for Haiti?. Haitians are hailing the Bukele method. Citizens of the Americas’ poorest nation cheering the Salvadoran president’s ’shoot first, ask questions later’ method of dealing with the gangs that have overrun their country the past six years. Can the police force deployed actually restore law and order? We’ll ask about the latest in a decades-long list of efforts by the international community to support Haiti.\nTopic 2: Senegal AFCON ruling 'good in the books of sports law', expert says. Speaking with FRANCE 24's Jennie Shin, sports presenter and journalist Thando Sibiya explains that the decision by the Court of Arbitration for Sport to reinstate Senegal as ⁠winner of ​the 2025 Africa Cup of Nations \"from a jurisprudence perspective or creating precedent, it is going to be good in the books of sports law, because if every single decision of a referee is taken to a court of law all the time, it really tampers with the quality, governance and legitimacy of the game\".\nTopic 3: Senegal regain AFCON title on appeal at Morocco's expense. Senegal on Tuesday regained their Africa Cup of Nations title after winning an appeal at the Court of Arbitration for Sport (CAS) against the decision by the Confederation of African Football to declare Morocco the winners following a chaotic final in January. CAS said in a statement it had \"upheld the appeal by the Senegalese Football Federation (FSF) against the Confederation of African Football (CAF) and the Royal Moroccan Football Federation (FRMF)\" by a \"unanimous decision\". FRANCE 24's Emerald Maxwell reports."}, {"station": "KBS 韓国", "title": "Prime Minister Vows Thorough Investigation to Uncover Cheating on Past National Exams", "videoId": "syza2c_YlH8", "audioUrl": "audio/07_KBS_韓国.mp3", "script": "KBS 韓国の主要ニュースです。\nTopic 1: Prime Minister Vows Thorough Investigation to Uncover Cheating on Past National Exams. Written: 2026-11-24 19:56:34 / Updated: 2026-11-24 20:13:03 Creative [4K] NCT DREAM, A2O SOUL, CHAERYEONG, Kei, BESTie, KEYVITUP, H1-KEY, UNCHILD, Baby DONT Cry | On the way to Music Bank 261120 2026-11-20 Wonder Hours with Hyerim NO CAP CONFESSIONS | Too Shy for a Compliment? Just Say Thank You!! 2026-11-18 K-POP News November’s comeback lineup to warm up the winter chill! 2026-11-04 Copyright ⓒ KBS. All rights reserved. No copy, distribution or use of the content (AI learning included). This website is sponsored by the Korea Media and Communications Commission. The Web site is optimized for viewing in Chrome, Safari, Firefox and Internet Explorer 11 and higher versions. This website uses cookies and other technology to enhance quality of service. Continuous usage of the website will be considered as giving consent to the application of such technology and the policy of KBS. For further details >\nTopic 2: New Data: Some 2.77 Million People are Family Caregivers in S. Korea. [Domestic] :New data finds that six percent of the nation’s population aged nine or older were family caregivers. \n\nThe data was included in the 2025 Census of Population and Housing released by the Ministry of Data and Statistics on Tuesday. The census was compiled from a survey of 20 percent sample households ...[more...]\nTopic 3: Education Ministry Files Complaint against Alleged Suneung Cheater. [Domestic] :The Ministry of Education has filed a police complaint against one more individual who was allegedly caught cheating using a smart device during last week’s Suneung, or College Scholastic Ability Test.\n\nThe move came Tuesday, a day after the ministry filed similar complaints against five ...[more...]"}, {"station": "CNA アジア", "title": "In Yemen's Aden, divided government forces prepare for a Houthi assault", "videoId": "tINJbWwWwy0", "audioUrl": "audio/09_CNA_アジア.mp3", "script": "CNA アジアの主要ニュースです。\nTopic 1: In Yemen's Aden, divided government forces prepare for a Houthi assault. Flags of former South Yemen flutter as members of the National Security Forces man a checkpoint amid concerns about Houthi forces drawing closer in Aden, Yemen Nov 19, 2026. (Photo: REUTERS/Stringer) ADEN, Yemen: As Yemen's Houthis push closer towards the temporary capital Aden against fragmented government forces, the city's inhabitants face a bleak choice: stay under fire or leave for an impoverished countryside. Aden has had no major warfare since bitter street battles of 2015, soon after the internationally recognised government fled Houthi-run Sanaa and made the port city its base, but it is now being hit by missile and drone strikes . \"Rockets are being fired into this city in a frightening way. People are in a state of constant anxiety,\" said Tariq Abdul Rahman, a former soldier living in Aden with his family. The Houthis have been on the march on nearly every front since Yemen's civil war reignited this summer after a four-year truce. They are now only 80km (50 miles) from Aden on the front line in the highlands to the north and 110km to the west, along a desert road with few natural obstacles. CNA Games Guess Word Crack the word, one row at a time Buzzword Create words using the given letters Mini Sudoku Tiny puzzle, mighty brain teaser Mini Crossword Small grid, big challenge Word Search Spot as many words as you can Show More Show Less Forces inside Aden , perched around an extinct volcano jutting into the Indian Ocean, have set up checkpoints, pulled in reinforcements, dug trenches and set up earth barricades on roads to the front line, residents and military sources say. But feuding among rival factions, and between their Gulf backers, has undermined the government's efforts to stave off the advance of the Iran-aligned Houthis and now risks hobbling its defence of the city, according to analysts. \"These forces may share a common enemy in the Houthis, but they do not share the same political objectives, territorial priorities, or willingness to fight,\" said Yemen analyst Mohammed al-Basha, of the UK-based Royal United Services Institute think tank. Yemen's internationally recognised government said the forces fighting the Houthis were not divided and were working together on the ground. \"Government forces defending Aden operate under a unified strategic command. The Giants Brigades, the Homeland Shield Forces, the Emergency Forces, and units from the Third, Sixth and Seventh Military regions coordinate their efforts,\" said Emad Bamatraf, deputy head of the Yemeni mission in Washington, in comments emailed after publication. Forces inside Aden , perched around an extinct volcano jutting into the Indian Ocean, have set up checkpoints, pulled in reinforcements, dug trenches and set up earth barricades on roads to the front line, residents and military sources say. But feuding among rival factions, and between their Gulf backers, has undermined the governmen"}, {"station": "ABC 豪州", "title": "Global food battles put brakes on national review of dietary guidelines", "videoId": "gwGGX3h0wvI", "audioUrl": "audio/10_ABC_豪州.mp3", "script": "ABC 豪州の主要ニュースです。\nTopic 1: Global food battles put brakes on national review of dietary guidelines. Australia's current dietary guidelines are 13 years old. ( Supplied: Unsplash / Imad 786 / License ) Australia's updated dietary guidelines have been delayed again until next year. The national review committee is extending its time to examine the latest science as well as dietary recommendations internationally. Draft changes are expected to be released next month ahead of implementation in 2027. Australia's 13-year-old dietary guidelines will not be updated as expected this year after the review again hit delays. Public health and nutrition experts say global pushback on the United States's controversial new guidelines means Australia's review committee wants its updates to be airtight. The updates were initially due in 2025, but were set back to 2026 and are now expected to be finalised sometime next year. Food policies such as marketing and labelling standards and school canteen guidelines cannot be developed or updated until the national dietary review is delivered. But nutritionists say they are not concerned by the delay, as it shows the review committee is thoroughly examining the latest science. Australia's food plate was officially introduced in 2013 to provide a visual guide to healthy eating. ( Supplied: eatforhealth ) Australia's dietary guidelines are maintained and reviewed by the National Health and Medical Research Council (NHMRC), an independent statutory agency under the health and aging minister. The guidelines are used to develop Australia's food plate, known as the Guide to Healthy Eating.\nTopic 2: CFMEU inquiry conceals identity of witness amid serious safety fears. The witness is expected to recount allegations of illegal payments, standover tactics and wild drug-fuelled parties within Australia's construction industry.\nTopic 3: Jannik Sinner set to miss Australian Open. The former world number one's injury woes continue as knee surgery dashes his plans for a comeback in Melbourne."}];
  document.getElementById("page-title").textContent = "🌍 世界の朝刊 NHK風同時通訳プレイヤー (2026年11月25日)";

  let player = null;
  let currentIndex = 0;
  const audioEl = document.getElementById("ja-audio");
  const playlistEl = document.getElementById("playlist");

  newsItems.forEach((item, idx) => {
    const li = document.createElement("li");
    li.id = "item-" + idx;
    li.innerHTML = `<div><div class="station">${item.station}</div><div class="title">${item.title}</div></div><button>▶ 同時再生</button>`;
    li.onclick = () => playIndex(idx);
    playlistEl.appendChild(li);
  });

  function onYouTubeIframeAPIReady() {
    if (newsItems.length === 0) return;
    player = new YT.Player("yt-player", {
      videoId: newsItems[0].videoId,
      playerVars: { playsinline: 1, rel: 0 },
      events: {
        onReady: () => {
          player.setVolume(document.getElementById("orig-vol").value);
        }
      }
    });
  }

  function playIndex(idx) {
    if (idx < 0 || idx >= newsItems.length) return;
    currentIndex = idx;
    const item = newsItems[idx];

    document.querySelectorAll(".playlist li").forEach(el => el.classList.remove("active"));
    document.getElementById("item-" + idx).classList.add("active");
    document.getElementById("now-playing").textContent = "放送中: " + item.station + " - " + item.title;
    document.getElementById("script-box").textContent = item.script;

    if (player && player.loadVideoById) {
      player.loadVideoById({ videoId: item.videoId, startSeconds: 0 });
      player.setVolume(document.getElementById("orig-vol").value);
      player.playVideo();
    }
    audioEl.src = item.audioUrl + "?t=" + Date.now();
    audioEl.currentTime = 0;
    audioEl.play();
  }

  function pauseBoth() {
    if (player && player.pauseVideo) player.pauseVideo();
    audioEl.pause();
  }

  function nextTrack() {
    if (currentIndex + 1 < newsItems.length) {
      playIndex(currentIndex + 1);
    } else {
      pauseBoth();
      document.getElementById("now-playing").textContent = "本日の全ニュースの放送が終了しました。";
    }
  }

  function changeOrigVol(val) {
    if (player && player.setVolume) player.setVolume(val);
  }

  audioEl.addEventListener("ended", () => {
    nextTrack();
  });
</script>
</body>
</html>
