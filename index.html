 dangers of revising Europe's security architecture", "videoId": "7Zz1ZxI9ldY", "audioUrl": "audio/04_DW_ドイツ.mp3", "script": "DW ドイツの主要ニュースです。\nTopic 1: The dangers of revising Europe's security architecture. Experts warn against revising Europe's security framework because they say it would mean granting Moscow its longstanding wish of renegotiating postwar security on the continent. European leaders have so far found compromises in response to many of US President Donald Trump's demands . But they were surprised to hear Trump say that he raised Europe's security framework with Russian officials. \"It's going to be a big agreement and it's going to involve more than Ukraine,\" Trump said after meeting Russian presidential envoy Kirill Dmitriev at the White House last week. He said that deal might include all of Europe. But what he meant by \"all of Europe\" was not clear. US envoy Jared Kushner also wrote that Europe and Russia had struggled to establish a sustainable security framework for more than 30 years. Kushner said he was looking at a \"broader\" European architecture before he flew to meet with Russian and Ukrainian representatives in Abu Dhabi. European diplomats immediately pushed back on Washington's approach to secure a peace deal in Ukraine because they feared that a peace settlement could restore Russia's sphere of influence and undermine NATO . \"We ​already have European security ​architecture in place. NATO and the European Union both have their ​respective roles. We ​must make sure Ukraine is integrated ‌into ⁠this architecture,\" said Kaja Kallas, the European Union's foreign policy chief. Russia made clear during talks in Abu Dhabi earlier this week that they were keen to discuss a broader European security framework before tackling the specifics of the war. \"Phrases about the European security architecture are certainly Russian talking points and not only talking points but, to a degree, part of a media propaganda effort that Russia makes to frame the war as it wishes to frame the war,\" said Michael Kimmage, a historian of the Cold War. Russian leaders, including Vladimir Putin, have long alleged that the US and NATO repeatedly violated pledges they made in the early 1990s not to expand the alliance into the former Soviet bloc.\nTopic 2: Why does El Salvador's Bukele have troops in Haiti?. Haiti's Prime Minister congratulating El Salvador's President for a gang crackdown in Haiti has shone a light on the relationship between the two countries. What's going on, and where does the US stand?\nTopic 3: Iran targeted US radar system in Bahrain. Iran claimed it struck US radar systems in Bahrain, while the US said it had intercepted the attacks. Clashes continue in the Strait of Hormuz, as the war remains in a state of de-escalation."}, {"station": "France24 フランス", "title": "Turkey and Qatar pledge unified stance against attacks in mutual defence pact", "videoId": "1vSTbVTSfSw", "audioUrl": "audio/05_France24_フランス.mp3", "script": "France24 フランスの主要ニュースです。\nTopic 1: Turkey and Qatar pledge unified stance against attacks in mutual defence pact. Turkey and Qatar signed a mutual defence agreement Friday, pledging a unified response to any attack on either country, the two leaders said in a joint statement. The defence pact follows the Mecca Joint Defence Agreement signed by Turkey, Pakistan and Saudi Arabia in August.\nTopic 2: The Downfall of AI’s ‘Rock Star’ Boss, Ukraine: Who speak for Europe? Protests & Presidents. On The World This Week with Gavin Lee, our panel distills the breaking news and global stories of the past 7 days into 45 minutes. \n \nUkraine: Who will speak for Europe?\n \nIn a week thats seen the first direct talks between Ukraine and Russia since February, with the US in the room and the Europeans relegated to the lobby according to Moscow. A new ‘European Security Architecture’ is discussed.\nTopic 3: Hurry up and wait: Europe wants a place at the table, ‘must make up its mind’ over Ukraine. Gavin Lee is pleased to welcome Alexander Titov, Lecturer in Modern European History at Queen's University Belfast and a specialist on Russia. He's joined us to discuss high-level meetings in Abu Dhabi, Dublin and the prospects for ending the war in Ukraine."}, {"station": "KBS 韓国", "title": "S. Korea Watching Nvidia Situation after Jensen Huang Exit", "videoId": "sZHb2su3RCA", "audioUrl": "audio/07_KBS_韓国.mp3", "script": "KBS 韓国の主要ニュースです。\nTopic 1: S. Korea Watching Nvidia Situation after Jensen Huang Exit. Written: 2026-11-13 19:08:03 / Updated: 2026-11-13 19:08:27 Creative [4K] JISOO, ATEEZ, NCT DREAM, TWS, RESCENE, A2O SOUL, ILLIT, CHAERYEONG, UNCHILD | On the way to Music Bank 261113 2026-11-13 Wonder Hours with Hyerim NO CAP CONFESSIONS | Who Said Romance Is for Anniversaries Only? 2026-11-11 K-POP News November’s comeback lineup to warm up the winter chill! 2026-11-04 Copyright ⓒ KBS. All rights reserved. No copy, distribution or use of the content (AI learning included). This website is sponsored by the Korea Media and Communications Commission. The Web site is optimized for viewing in Chrome, Safari, Firefox and Internet Explorer 11 and higher versions. This website uses cookies and other technology to enhance quality of service. Continuous usage of the website will be considered as giving consent to the application of such technology and the policy of KBS. For further details >\nTopic 2: SK hynix Shares Plunge More than 3% as Nvidia Fallout Continues. [Economy] :SK hynix shares plunged more than three percent on Friday as the fallout from Nvidia CEO Jensen Huang’s resignation continued. \n\nThe shares closed at one-point-21 million, six-thousand won, down three-point-03 percent from Thursday. \n\nSamsung Electronics shares dipped zero-point-96 percent to close at ...[more...]\nTopic 3: Gov’t Holds Emergency Meeting on Ramifications of Nvidia Crisis. [Economy] :The government convened an emergency meeting on Friday to discuss the ramifications that Nvidia CEO Jensen Huang’s departure could have on South Korea’s AI industry.\n\nThe Presidential Council on National Artificial Intelligence Strategy said it convened the meeting with related agencies and reviewed the ...[more...]"}, {"station": "CNA アジア", "title": "Europe chooses team for Ukraine talks", "videoId": "g9uxKhUgWFw", "audioUrl": "audio/09_CNA_アジア.mp3", "script": "CNA アジアの主要ニュースです。\nTopic 1: Europe chooses team for Ukraine talks. EU leaders agreed that Britain, France, Germany, Italy, Poland and EU officials would represent Europe in future Ukraine peace talks, saying Europe must speak with \"one clear and united voice\". US special envoys Steve Witkoff, right, Jared Kushner, US President Donald Trump's son-in-law, left, and Ukraine's President Volodymyr Zelenskyy speak to the media at the airport in Dublin, Thursday, Nov 12, 2026. (Photo: AP/Peter Morrison) DUBLIN: EU leaders on Friday (Nov 13) agreed Britain, France, Germany, Italy, Poland and the bloc's institutions would represent Europe at future Ukraine talks, despite Russia refusing to commit to giving Kyiv's backers a seat at the table. Europe had been debating its team for a next round of negotiations after US envoys said Thursday that Russian President Vladimir Putin had given his green light for them to join . The Kremlin appeared to push back Friday by saying it wanted to understand Europe's \"real intentions and their willingness to contribute\" before a decision on it taking part. But European Council chief Antonio Costa, who chaired a summit of EU leaders in Dublin, said they had still moved ahead and picked their negotiating line-up. \"Europe must speak with one clear and united voice in all discussions that shape the future of Ukraine and the security of our continent,\" he said. \"This is ultimately a team effort.\" While Europe has now settled the question of who will represent it, it also needs to resolve the question of what it is willing to discuss with the Kremlin. Russia is pushing its longstanding desire to renegotiate Europe's broader security framework, with the Kremlin appearing to want to revive hardline demands to roll back NATO. \"Our focus needs to be on ending the war and achieving peace for Ukraine,\" European Commission chief Ursula von der Leyen said. \"The path to peace will not be easy, but we will remain united, as we have been over the last five years, in our support for Ukraine, and with the end goal clear in our minds.\" US envoy Jared Kushner, who is also US President Donald Trump's son-in-law, said that getting Europe on board will \"allow us to address the broader post-war European security arrangements\". German Chancellor Friedrich Merz, however, rejected that notion. \"Russia wants to talk about questions of a European security architecture. We do not need to discuss that, it already exists,\" Merz said. EU top diplomat Kaja Kallas meanwhile warned against walking into Russian \"traps\" over Ukraine talks, saying reaching a ceasefire needed to be the priority, not broader security negotiations. \"If we start to talk about what Russia is asking regarding the security architecture, we actually walk into the traps that Russia is setting us, which is that we divert the attention away,\" Kallas told reporters in Dublin. \"First we need a ceasefire,\" said the foreign policy chief - a Russia hawk who appeared to have been sidelined in the choice of Europe"}, {"station": "ABC 豪州", "title": "Socceroos crush Qatar in Doha demolition", "videoId": "bdEUOgMRcVU", "audioUrl": "audio/10_ABC_豪州.mp3", "script": "ABC 豪州の主要ニュースです。\nTopic 1: Socceroos crush Qatar in Doha demolition. Riley McGree (right) scored a gift of an opener. ( Getty Images: Mohamed Farag ) The Socceroos blew away the defending Asian Cup champions Qatar with three first half goals. Riley McGree, Tete Yengi and Nestory Irankunda all scored at the Abdullah bin Nasser bin Khalifa Stadium in Doha. The Socceroos will now face Jordan next Tuesday (Wednesday AEDT), with the match shifted from Amman to Doha due to security concerns The Socceroos have enjoyed one of their most emphatic outings under Tony Popovic, outclassing woeful Asian Cup holders Qatar 3-0 with a statement win in front of the champions' home fans in Doha. Goals from Riley McGree, Tete Yengi and Nestory Irankunda in a dominant first-half display put the one-sided friendly to bed by the break on Friday (Saturday AEDT) with the help of dreadful defending from the back-to-back continental champions. The fare did get totally disjointed after the break amid a bewildering raft of personnel changes, as subs Eli Adams, Sam Klein, Kasey Bos and Diesel Herrington all earned their Socceroos debuts, but Australia remained in complete control with the hosts only firing their first tame shot after 72 minutes. \"The win was what we wanted and we set the game up with a very good first-half,\" Popovic told Paramount+. \"We won some balls high up the pitch, which is always encouraging, in difficult conditions. A lot of the boys have come from Europe where it's a lot cooler, so we were tested physically to be that aggressive.\" Relieved that they won't have to travel to Amman for their second match next Tuesday (Wednesday AEDT) and that Asian Cup finalists Jordan will come to Doha to face them, Popovic's men seemed relaxed and confident from the start. It certainly helped when in the fifth minute, new Qatar goalkeeper Mahmoud Abunada had a complete brain fade, attempting a short pass to his central defenders only to deliver it straight to a grateful Riley McGree, who slotted home left-footed into an unguarded net. It was the Middlesbrough creator's second international goal, a gift four years after his first.\nTopic 2: Police are done with the Swans, but the saga is far from over. Police have finished with the Swans, but the club’s own review of its AFL program is far from over. Will it get to the heart of what went wrong?\nTopic 3: Missing teen 'kept his wits' in the bush and saved his own life. Staying hydrated and warm, and in easy sight of rescuers, were all factors that helped rescuers find 17-year-old William in dense bushland."}];
  document.getElementById("page-title").textContent = "🌍 世界の朝刊 NHK風同時通訳プレイヤー (2026年11月14日)";

  let player = null;
  let currentIndex = 0;
  const audioEl = document.getElementById("ja-audio");
  const playlistEl = document.getElementById("playlist");

  newsItems.forEach((item, idx) => {
    const li = document.createElement("li");
    li.id = "item-" + idx;
    li.innerHTML = `<div><div class="station">${item.station}</div><div class="title">${item.title}</div></div><button>▶ 同時再生</button>`;
    li.onclick = () => playIndex(idx);
    playlistEl.appendChild(li);
  });

  function onYouTubeIframeAPIReady() {
    if (newsItems.length === 0) return;
    player = new YT.Player("yt-player", {
      videoId: newsItems[0].videoId,
      playerVars: { playsinline: 1, rel: 0 },
      events: {
        onReady: () => {
          player.setVolume(document.getElementById("orig-vol").value);
        }
      }
    });
  }

  function playIndex(idx) {
    if (idx < 0 || idx >= newsItems.length) return;
    currentIndex = idx;
    const item = newsItems[idx];

    document.querySelectorAll(".playlist li").forEach(el => el.classList.remove("active"));
    document.getElementById("item-" + idx).classList.add("active");
    document.getElementById("now-playing").textContent = "放送中: " + item.station + " - " + item.title;
    document.getElementById("script-box").textContent = item.script;

    if (player && player.loadVideoById) {
      player.loadVideoById({ videoId: item.videoId, startSeconds: 0 });
      player.setVolume(document.getElementById("orig-vol").value);
      player.playVideo();
    }
    audioEl.src = item.audioUrl + "?t=" + Date.now();
    audioEl.currentTime = 0;
    audioEl.play();
  }

  function pauseBoth() {
    if (player && player.pauseVideo) player.pauseVideo();
    audioEl.pause();
  }

  function nextTrack() {
    if (currentIndex + 1 < newsItems.length) {
      playIndex(currentIndex + 1);
    } else {
      pauseBoth();
      document.getElementById("now-playing").textContent = "本日の全ニュースの放送が終了しました。";
    }
  }

  function changeOrigVol(val) {
    if (player && player.setVolume) player.setVolume(val);
  }

  audioEl.addEventListener("ended", () => {
    nextTrack();
  });
</script>
