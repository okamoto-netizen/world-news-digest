uring base\". But economists have warned tariffs can fuel inflation and push prices up for consumers if businesses pass on higher costs, as well as dampen global trade.\nTopic 2: Images of asteroid targeted to test Earth's defences reveal stadium-sized crater. The asteroid's surface was transformed after a spacecraft was deliberately crashed into it four years ago\nTopic 3: Israeli judges recommend dropping most serious charges against Netanyahu. The Israeli PM says his trial should end after judges said there was little chance of conviction in one of three cases."}, {"station": "ABC 米国", "title": "North Korea reviews Switzerland relations after sanctions on youth camp linked to war", "videoId": "qF9blOfLTcY", "audioUrl": "audio/02_ABC_米国.mp3", "script": "ABC 米国の主要ニュースです。\nTopic 1: North Korea reviews Switzerland relations after sanctions on youth camp linked to war. North Korea has threatened to close a Swiss diplomatic office that opened in Pyongyang last month SEOUL, South Korea -- North Korea threatened Tuesday to close a Swiss diplomatic office that opened in Pyongyang last month, condemning Switzerland for imposing sanctions on a youth camp in eastern North Korea over its alleged role in the transfer of children from Russia-occupied areas of Ukraine . Kim Yo Jong, the powerful sister of North Korean leader Kim Jong Un, described the Swiss sanctions on the Songdowon International Children’s Camp in the coastal city of Wonsan as an “open hostile act” and a “serious infringement” of the North’s sovereignty, according to a statement carried by state media. Kim Yo Jong, one of Pyongyang’s top foreign policy officials, said the camp supported “legitimate” cooperation between North Korea and Russia. She didn't directly address Western accusations that some Ukrainian children abducted by Russian forces were sent there to be reeducated. North Korea has closely aligned with Russia over the war in Ukraine, sending thousands of troops and large shipments of weapons in recent years to support Russian President Vladimir Putin’s full-scale invasion, possibly in exchange for economic assistance and military technology transfers. Strengthened ties with Moscow and Beijing have been key drivers of Kim Jong Un’s increasingly assertive foreign policy as he positions North Korea as part of a united front against the United States. Swiss Foreign Minister Ignazio Cassis traveled to North Korea in late October as Switzerland opened a diplomatic office in Pyongyang and held talks with senior North Korean officials, including Foreign Minister Choe Son Hui, on “promoting dialogue and cooperation,” North Korean state media said at the time. Kim Yo Jong said that North Korea would need to “comprehensively reconsider the relations with unreliable Switzerland” following the sanctions on the camp and called on North Korean diplomats to take unspecified “corresponding” countermeasures. “It is my view that the Swiss diplomatic office has spontaneously lost justification for its existence, which was opened in Pyongyang under the pretext of improving the relations, given that the Swiss Confederation has clarified its stand not to respect the sovereignty of the DPRK,” she said, using the initials of North Korea’s formal name, the Democratic People’s Republic of Korea. In adding the Songdowon camp earlier this month to its broader sanctions related to Russia’s all-out invasion of Ukraine, Swiss authorities held the camp responsible for the “forced assimilation, including indoctrination, and militarized education of Ukrainian minors,” according to a document by Switzerland’s State Secretariat for Economic Affairs. It said the camp participates in programs involving the transfer of Ukrainian children from Russia-occupied territories to North Korea a"}, {"station": "AlJazeera 中東", "title": "Migrant wrongly deported by Trump leaves US for Spain", "videoId": "WPtDEms07Lw", "audioUrl": "audio/03_AlJazeera_中東.mp3", "script": "AlJazeera 中東の主要ニュースです。\nTopic 1: Migrant  blamed Russia in September for an attempted drone attack at Leipzig/Halle airport , an accusation t he Russian Embassy in Berlin dismissed as part of a \"new wave of anti-Russian hysteria in Germany\". Germany and ot he r European countries have also been hit by a wave of cyberattacks and sabotage incidents targeting critical infrastructure that t he y have often blamed on Russia. Moscow has denied all t he allegations. Merz s aid on Wednesday that by supporting Ukraine, Germany was also protecting itself. \"We are learning from Ukraine - technologically for civilian use but of course also in defence technology,\" he s aid . Germany "}, {"station": "ABC 豪州", "title": "New photos reveal stadium-sized crater in asteroid knocked off course by NASA", "videoId": "hhaKQriLK4M", "audioUrl": "audio/10_ABC_豪州.mp3", "script": "ABC 豪州の主要ニュースです。\nTopic 1: New photos reveal stadium-sized crater in asteroid knocked off course by NASA. Dimorphos, in orbit around Didymos, with a crater caused by the 2022 impact by the DART spacecraft visible. ( Reuters: ESA ) Dimorphos was left with one side flattened with a stadium-sized crater when NASA's DART struck it. DART was sent on a proof-of-principle mission for using a spacecraft to change a celestial object's trajectory in 2022. The Hera spacecraft will approach within 13km of Dimorphos next month, obtaining increasingly higher-resolution images. NASA's test of its planetary defence DART spacecraft in 2022 left a stadium-sized crater in the asteroid Dimorphos, new photos show. The asteroid remains tumbling in space, according to the new images from European Space Agency's Hera spacecraft. DART was sent on a proof-of-principle mission for using a spacecraft to change a celestial object's trajectory. Dimorphos, an oblong rocky object about 151 metres wide, orbits its companion asteroid Didymos, with a diameter of 730 metres, and the pair is currently about 193.5 million kilometres from Earth. Asteroid moonlet Dimorphos as seen by the DART spacecraft seconds before impact, in 2022. ( Reuters: NASA/Johns Hopkins APL/Handout ) They are defined as near-Earth asteroids, though neither object imperils Earth. Previous data showed how DART succeeded in changing the path of Dimorphos, demonstrating that a spacecraft could alter the trajectory of an object headed toward a collision with Earth. Hera is now getting a close-up look at how DART physically changed Dimorphos.\nTopic 2: Live: ASX to open higher after US tariff announcement. The Australian share market is set to open higher as the US president announces more tariffs on 14 trading partners. Follow the day's events and insights from our business reporters on the ABC News live markets blog.\nTopic 3: Regional kids at risk as swim schools and pools face uncertain future. As regional pools age and even close, there are fears country kids will miss out on vital water safety lessons."}];
  document.getElementById("page-title").textContent = "🌍 世界の朝刊 NHK風同時通訳プレイヤー (2026年11月26日)";

  let player = null;
  let currentIndex = 0;
  const audioEl = document.getElementById("ja-audio");
  const playlistEl = document.getElementById("playlist");

  newsItems.forEach((item, idx) => {
    const li = document.createElement("li");
    li.id = "item-" + idx;
    li.innerHTML = `<div><div class="station">${item.station}</div><div class="title">${item.title}</div></div><button>▶ 同時再生</button>`;
    li.onclick = () => playIndex(idx);
    playlistEl.appendChild(li);
  });

  function onYouTubeIframeAPIReady() {
    if (newsItems.length === 0) return;
    player = new YT.Player("yt-player", {
      videoId: newsItems[0].videoId,
      playerVars: { playsinline: 1, rel: 0 },
      events: {
        onReady: () => {
          player.setVolume(document.getElementById("orig-vol").value);
        }
      }
    });
  }

  function playIndex(idx) {
    if (idx < 0 || idx >= newsItems.length) return;
    currentIndex = idx;
    const item = newsItems[idx];

    document.querySelectorAll(".playlist li").forEach(el => el.classList.remove("active"));
    document.getElementById("item-" + idx).classList.add("active");
    document.getElementById("now-playing").textContent = "放送中: " + item.station + " - " + item.title;
    document.getElementById("script-box").textContent = item.script;

    if (player && player.loadVideoById) {
      player.loadVideoById({ videoId: item.videoId, startSeconds: 0 });
      player.setVolume(document.getElementById("orig-vol").value);
      player.playVideo();
    }
    audioEl.src = item.audioUrl + "?t=" + Date.now();
    audioEl.currentTime = 0;
    audioEl.play();
  }

  function pauseBoth() {
    if (player && player.pauseVideo) player.pauseVideo();
    audioEl.pause();
  }

  function nextTrack() {
    if (currentIndex + 1 < newsItems.length) {
      playIndex(currentIndex + 1);
    } else {
      pauseBoth();
      document.getElementById("now-playing").textContent = "本日の全ニュースの放送が終了しました。";
    }
  }

  function changeOrigVol(val) {
    if (player && player.setVolume) player.setVolume(val);
  }

  audioEl.addEventListener("ended", () => {
    nextTrack();
  });
</script>
