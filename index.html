<script>
  const newsItems = [{"station": "BBC 英国", "title": "COP31 fails to reach major climate deal as talks expose deep divisions", "videoId": "HmDdYE2UYkg", "audioUrl": "audio/01_BBC_英国.mp3", "script": "BBC 英国の主要ニュースです。\nTopic 1: COP31 fails to reach major climate deal as talks expose deep divisions. Countries have failed to reach a major new deal to tackle climate change after deep divisions over fossil fuels and money emerged at the UN COP31 talks in Turkey. Negotiations were due to finish on Friday but ran late into Sunday in search of common ground, becoming the longest UN climate conference in history. But the final deal proved unacceptable to the EU, Pacific island nations and others because it failed to directly mention fossil fuels, the main cause of global warming. Meanwhile, many poorer countries objected to the absence of any clear financial commitments from richer nations to help them adapt to the impacts of rising temperatures. The last time a COP's main political agreement collapsed like this was in 2009 in Copenhagen. UN secretary general Antonio Guterres, in his last COP before he steps down, said he was \"deeply disappointed\". He took aim at what he called \"powerful fossil fuel interests\" who he said were taking \"a page from Big Tobacco's playbook: distorting the science, delaying policy, blocking action, and piling up huge profits while people everywhere pay the price\". After two weeks of negotiations, exhausted delegates were presented with a new, draft deal in the early hours of Sunday morning to try to break the deadlock. But the words \"fossil fuels\" did not appear anywhere in the text. The only indirect reference to coal, oil and gas was a nod to a deal agreed at COP28 in 2023 , when countries agreed to \"transition away\" from fossil fuels in energy systems. The EU's representative, Irish Minister Darragh O'Brien, made it clear that the EU \"strongly\" objected, saying that the \"decisions go nowhere near the level of ambition needed to tackle climate change\". \"It is unconscionable that we would have a climate pact that makes no mention of fossil fuels,\" he said. Other countries, such as Panama and the Marshall Islands, also criticised the deal for doing nowhere near enough to tackle the pace of climate change.\nTopic 2: What's next after no deal at COP31 climate talks?. The COP31 climate summit in Turkey has formally come to an end after countries failed to agree a deal.\nTopic 3: Explosion on Russian ship at Libya port caused by suspected drone attack, officials say. Libya's eastern government says the ship had stopped for fuel and supplies on its way back to Russia."}, {"station": "ABC 米国", "title": "Poland says Russia twice tried to kill a Ukrainian American rapper", "videoId": "TXrOPotsSqE", "audioUrl": "audio/02_ABC_米国.mp3", "script": "ABC 米国の主要ニュースです。\nTopic 1: Poland says Russia twice tried to kill a Ukrainian American rapper. Denmark expelled a Russian official after it said it thwarted an alleged plot. WARSAW, Poland -- Denmark has expelled a Russian official after it said it had thwarted an alleged plot to kill a Ukrainian American citizen on Danish soil. The case took a new twist Sunday when Polish authorities revealed that the same man was allegedly targeted by Moscow's intelligence services last summer in Poland. Denmark is expected to ask the European Union this week for more decisive action stemming from the case, perhaps restricting Russian citizens from entering and traveling freely within the EU. Poland said it would support such measures. European Commission President Ursula von der Leyen said Russia’s threats were becoming more real, reaching EU soil as the bloc continues supporting Ukraine as Moscow's full-scale invasion nears the five-year mark. The case involves Albert Vasiliev, a rapper who performs under the name Kyivstoner and holds Ukrainian and U.S. citizenship, according to Danish media. The assassination attempt in Denmark was planned for Sept. 25 during a concert north of Copenhagen, according to the Danish Security and Intelligence Service, known by its acronym PET. It said the plot was “planned and initiated by Russian intelligence services.” The plot was thwarted by authorities, the Danish prime minister’s office said Friday. PET said two men were charged with attempted murder and assisting a foreign intelligence service in operating in Denmark. They were linked to Loyal to Familia, it said, a banned gang known for “extensive, serious and violent criminal activity.” Russia dismissed the allegations through its embassy in Copenhagen, saying the accusations were unsubstantiated. Denmark responded by expelling Russia’s defense attaché. “In our assessment, the individual concerned was a particular target of the Russian intelligence services,\" said Rasmus Kieffer-Kristensen, director general of PET. “The case demonstrates that Russian intelligence services are both willing and capable of initiating an assassination attempt on Danish soil — at a public event and using individuals from Danish criminal gangs. This is a concrete indication of the heightened threat posed by Russia.” As Denmark announced the plot against the rapper on Friday, the Polish Foreign Ministry posted on X that it was noting the news with “outrage and concern.\" “This is another assassination attempt against this person — the first took place on Polish territory in August 2026 but was thwarted thanks to the efforts of the Polish services and the would-be perpetrator, a Russian citizen, was detained,” the ministry said.\nTopic 2: Suspected Ukrainian sea drones hit Russian warship at Benghazi naval base, Libyan officials say. The sea drone strike triggered an explosion and fire in Benghazi.\nTopic 3: Air alert sounds hours after attack on Russia-bound ship in the Gulf of Finland. The governor of Kaliningrad"}, {"station": "AlJazeera 中東", "title": "Liverpool 4-0 Manchester United: Five key takeaways for Pochettino", "videoId": "2S1NzNRqPyE", "audioUrl": "audio/03_AlJazeera_中東.mp3", "script": "AlJazeera 中東の主要ニュースです。\nTopic 1: Liverpool 4-0 Manchester United: Five key takeaways for Pochettino. United suffer their worst result under a new manager in 100 years as Liverpool cruise past Mauricio Pochettino’s side. If Mauricio Pochettino had any doubt about the size of the job in front of him at Manchester United, his players confirmed his worst fears within 13 minutes of his first game in charge – a 4-0 defeat at Liverpool. As the home side surged into a two-goal lead in the opening exchanges at Anfield, with the away side reduced to 10 men, the sinking sensation for United – who are second bottom of the Premier League – immediately returned. Any ‘new-manager bounce’, as feared by Reds manager Andoni Iraola , had no time to materialise with a rash challenge from Lenny Yoro on Alexander Isak leading to a straight red in the eighth minute. The resulting free-kick was powered home by Dominik Szoboszlai, with Florian Wirtz thereafter converting a sharp attack in a flash – ending the match as a contest. Pochettino slammed the decision to send off Yoro after the game, but there was a familiar feeling about the performance overall. Al Jazeera Sport takes a look at five key takeaways as the opening salvo of the ninth manager since United’s last league title in 2013 fell apart – resulting in the worst start for a new manager of the club in 100 years. Even though United have greater concerns, the answer was undoubtedly: no. The question for the referee, in sending off Yoro for denying a goalscoring opportunity, had four considerations: distance between the offence and the goal, general direction of the play, likelihood of keeping or gaining control of the ball, and location and number of defenders. Of those guidelines, the most pertinent were the direction of play, which was at an angle across the box, and the likelihood of keeping control of the ball – Isak arguably had no control of it at all after a heavy first touch that allowed United keeper Senne Lammens to gather. VAR (video assistant referee) had the chance to ask the referee to reconsider his decision, but decided there was no clear and obvious error. Had the referee reviewed the red card, then he would have surely decided a yellow card would have sufficed. The play that led to the card being shown, however, was even more questionable than the outcome. The release of the team sheets, an hour and 15 minutes before kickoff, was the first moment all United fans looked to.\nTopic 2: Why has the COP31 climate summit failed to reach agreement?. Fossil fuels are at the centre of deep division.\nTopic 3: Cockroaches, dissent and a paradigm shift in India. The rise of the Cockroach Janta Party and what it reveals about the future of politics and journalism in India."}, {"station": "DW ドイツ", "title": "China, ASEAN countries struggle over South China Sea code of conduct", "videoId": "o3SyN-9TmFk", "audioUrl": "audio/04_DW_ドイツ.mp3", "script": "DW ドイツの主要ニュースです。\nTopic 1: China, ASEAN countries struggle over South China Sea code of conduct. The Philippines wanted a South China Sea code of conduct in place by 2026. But persistent disagreements between China and ASEAN countries are slowing progress toward a deal. It was supposed to be a breakthrough year. The Philippines had intended to set up a code of conduct with China for the South China Sea during its 2026 ASEAN presidency. However, at the summit in Manila in mid-November they had to abandon their goal. Some 80% of the text had been negotiated, declared Philippine Foreign Secretary Theresa Lazaro, but the key areas of dispute had remained unsolved. Much more than diplomatic wording is at stake. The South China Sea is one of the world's most important shipping routes, it is rich in fishing grounds and may harbor significant oil and gas reserves. Primarily, however, it's a region of strategic competition: With its so-called Nine-Dash Line (often drawn in red), China claims a large portion of the sea. Its claims overlap with those of the Philippines, Vietnam , Malaysia and Brunei . A code of conduct is to set up rules for parties dealing with one another and prevent incidents at sea from escalating. However, opinions differ, particularly with regard to its binding nature and its geographic scope. \"The basic problem with establishing such a code of conduct is that China is supremely powerful and has no real interest in a legally binding agreement,\" said political scientist Andreas Ufen, Southeast Asia expert at the German Institute of Global and Area Studies (GIGA). Beijing had little incentive to impose restrictions on itself as long as it was able to pursue its interests in the region even without such an agreement, Ufen told DW. The Paracel Islands serve as an example of just how difficult the unresolved issues are. In China, the group of islands is known as Xisha, in Vietnam as Hoang-Sa. Hanoi apparently wants to include them in the code's geographic scope, but China rejects this. An agreement within the ASEAN framework could indirectly affect the territorial claims of the parties involved. \"A fundamental problem is that so far there's no consensus on whether the code of conduct should be legally binding,\" said Felix Heiduk, head of research division Asia at the German Institute for International and Security Affairs (SWP). China and the ASEAN nations have been negotiating an agreement for 12 years without major progress so far. There were reservations about such a treaty not only in China but also in other ASEAN countries. They would subsequently have to ratify a legally binding agreement under international law in their own countries. A non-binding code of conduct, by contrast, would be little more than a voluntary declaration of intent, Ufen told DW. The definition of an \"incident\" is controversial as well. Are coast guard missions with use of water cannons included? Or blockades of supply vessels? Or is the code only applicable when military force "}, {"station": "France24 フランス", "title": "Democrat Hubbard wins North Carolina recount, clinching historic House majority", "videoId": "HjnfcL9rrBE", "audioUrl": "audio/05_France24_フランス.mp3", "script": "France24 フランスの主要ニュースです。\nTopic 1: Democrat Hubbard wins North Carolina recount, clinching historic House majority. Democrat Chuck Hubbard was elected to the US House of Representatives from North Carolina on Sunday after defeating veteran Republican Virginia Foxx, who chairs the powerful House Rules Committee. His victory gave Democrats their best general election result in decades, winning at least 258 seats in the 2026 US midterms.\nTopic 2: Russian warship hit by suspected Ukrainian drone at Benghazi naval base, Libyan officials say. A Russian navy corvette docked at the Benghazi naval base ​in eastern Libya was hit on Sunday by a suspected Ukrainian sea drone, according to local officials, in what appeared to be the latest attack linked to the Russia-Ukraine war in the North African nation. Hours later, a cargo ship was also hit by a sea drone in a second attack off Benghazi on Sunday evening.\nTopic 3: Burnham, 'Brejoin' & the Ghosts of Brexit. “The people of Britain have spoken, and the answer is: we are out.”\n \nThe words of David Dimbleby at 4.40am on 24 June 2016, as the Brexit referendum result became clear.\n \nBut nearly a decade on, is Britain changing its mind?\n \nPrime Minister Andy Burnham has reopened talks with Brussels, exploring options for a closer relationship with the EU. But the move has drawn criticism from key figures behind Brexit, including Theresa May and Boris Johnson.\n \nSo what is driving this rethink, and where might it lead?\n \nFrance 24's Gavin Lee speaks to John McTernan, veteran Labour strategist and former adviser to Tony Blair."}, {"station": "KBS 韓国", "title": "Rain, Snow Forecast Nationwide Monday as Cold Eases", "videoId": "nfnWxzTVJA4", "audioUrl": "audio/07_KBS_韓国.mp3", "script": "KBS 韓国の主要ニュースです。\nTopic 1: Rain, Snow Forec  says. Finnish, Russian and Estonian vessels battle the Sparta II fire before Russia takes over the rescue as the ship heads out of Finnish waters. Finnish Border Guard's handout photo of the Russian cargo ship Sparta II as the extinguishing of the fire continues in the Gulf of Finland November 22, 2026. Finnish Border Guard/Handout via REUTERS HELSINKI: A Russian rescue vessel on Sunday ( Nov 22) began towing a Russian-owned cargo ship that was struck by drones in the Baltic Sea out of Finnish waters after two days of firefighting, Finland's coast guard said. The Finnish military has said the strike on the Sparta II on Saturday was likely carried out by Ukraine and that the vessel later drifted into Finnish waters. The 16 crew members were evacuated onto a nearby Russian ship. One crew member was slightly injured. \"Thermal cameras show that some containers are warm, but the vessel is stable enough for towing to begin,\" Finland's coast guard said in a statement. It said that responsibility for the rescue will transfer to Russia once the ship leaves Finnish waters. CNA Games Guess Word Crack the word, one row at a time Buzzword Create words using the given letters Mini Sudoku Tiny puzzle, mighty brain teaser Mini Crossword Small grid, big challenge Word Search Spot as many words as you can Show More Show Less Pictures and video released earlier by the Finnish coast guard showed several vessels spraying the Sparta II with water cannons during the night in a bid to put out the flames and cool down containers stacked on its deck. In a rare instance of cross-border collaboration, out of the seven vessels helping to fight the fire, two were Russian, two were Estonian and the rest were Finnish. Estonia and Finland are members of NATO and steadfast supporters of Ukraine and often at odds with Moscow on other issues. Finland shut all of its land border crossings with Russia in 2023. Estonia will shut its own from December 1, for six months, on security grounds. Pictures and video released earlier by the Finnish coast guard showed several vessels spraying the Sparta II with water cannons during the night in a bid to put out the flames and cool down containers stacked on its deck. In a rare instance of cross-border collaboration, out of the seven vessels helping to fight the fire, two were Russian, two were Estonian and the rest were Finnish. Estonia and Finland are members of NATO and steadfast supporters of Ukraine and often at odds with Moscow on other issues. Finland shut all of its land border crossings with Russia in 2023. Estonia will shut its own from December 1, for six months, on security grounds. The ship, bound for the Russian exclave Kaliningrad, was damaged in international waters west of Russia's Gogland island, Finland's Defence Forces have said, corroborating an account by Russian officials. \"Smoke is still coming from the vessel, and there is clearly still heat on board,\" J"}, {"station": "ABC 豪州", "title": "Storms to hit south-western Qld as heatwave lingers in far north", "videoId": "Z-Eij439JYc", "audioUrl": "audio/10_ABC_豪州.mp3", "script": "ABC 豪州の主要ニュースです。\nTopic 1: Storms to hit south-western Qld as heatwave lingers in far north. Storms are predicted for south-western Queensland today and tomorrow. ( Supplied: Rick Britton ) Severe storms could hit south-western Queensland early this week. The severe heatwave in Cape York Peninsula is finally set to ease. The state's south-east will be fine until Wednesday, when more thunderstorms could return. Severe thunderstorms are forecast to hit south-western Queensland, as a severe heatwave lingers in the state's far north. The Bureau of Meteorology predicts a fine start to the week in south-east Queensland before wet weather and storm activity returns later in the week. Senior meteorologist Harry Clark said the state's remote west was the biggest watch point on Monday and Tuesday. \"Far western Queensland into the southern interior will be the storm focus,\" he said. \"There's some severe storms possible west of around Charleville.\" The record-breaking heatwave in the Cape York Peninsula continues to cause above-average temperatures, but will begin to ease this week. The weather bureau's \"severe\" heatwave warning predicts maximum temperatures in the mid to high 30s and overnight temperatures in the mid-20s for Weipa and Aurukun. Storms are on the horizon for south-east Queensland. ( ABC News: Charmayne Allison )\nTopic 2: Breaking: Red imported fire ants found in Western Sydney. One of the world's worst invasive species is found in Sydney for the second time in as many months.\nTopic 3: Council allows private land burials for those who 'belong to the land'. Few rules govern spreading ashes after a person dies, but burial outside a cemetery is approved only in exceptional circumstances. In South Australia, a local council is about to make private burials easier."}];
  document.getElementById("page-title").textContent = "🌍 世界の朝刊 NHK風同時通訳プレイヤー (2026年11月23日)";

  let player = null;
  let currentIndex = 0;
  const audioEl = document.getElementById("ja-audio");
  const playlistEl = document.getElementById("playlist");

  newsItems.forEach((item, idx) => {
    const li = document.createElement("li");
    li.id = "item-" + idx;
    li.innerHTML = `<div><div class="station">${item.station}</div><div class="title">${item.title}</div></div><button>▶ 同時再生</button>`;
    li.onclick = () => playIndex(idx);
    playlistEl.appendChild(li);
  });

  function onYouTubeIframeAPIReady() {
    if (newsItems.length === 0) return;
    player = new YT.Player("yt-player", {
      videoId: newsItems[0].videoId,
      playerVars: { playsinline: 1, rel: 0 },
      events: {
        onReady: () => {
          player.setVolume(document.getElementById("orig-vol").value);
        }
      }
    });
  }

  function playIndex(idx) {
    if (idx < 0 || idx >= newsItems.length) return;
    currentIndex = idx;
    const item = newsItems[idx];

    document.querySelectorAll(".playlist li").forEach(el => el.classList.remove("active"));
    document.getElementById("item-" + idx).classList.add("active");
    document.getElementById("now-playing").textContent = "放送中: " + item.station + " - " + item.title;
    document.getElementById("script-box").textContent = item.script;

    if (player && player.loadVideoById) {
      player.loadVideoById({ videoId: item.videoId, startSeconds: 0 });
      player.setVolume(document.getElementById("orig-vol").value);
      player.playVideo();
    }
    audioEl.src = item.audioUrl + "?t=" + Date.now();
    audioEl.currentTime = 0;
    audioEl.play();
  }

  function pauseBoth() {
    if (player && player.pauseVideo) player.pauseVideo();
    audioEl.pause();
  }

  function nextTrack() {
    if (currentIndex + 1 < newsItems.length) {
      playIndex(currentIndex + 1);
    } else {
      pauseBoth();
      document.getElementById("now-playing").textContent = "本日の全ニュースの放送が終了しました。";
    }
  }

  function changeOrigVol(val) {
    if (player && player.setVolume) player.setVolume(val);
  }

  audioEl.addEventListener("ended", () => {
    nextTrack();
  });
</script>
