    .playlist li.active { border-left-color: #d32f2f; background: #2a2020; }

  </style>
</head>
<body>
<div class="container">
  <h1 id="page-title">🌍 世界の朝刊 NHK風同時通訳プレイヤー</h1>
  <div class="now-playing" id="now-playing">下のボタンまたは番組を選択して再生してください</div>
  <div class="video-box">
    <div id="yt-player"></div>
  </div>
  <div class="controls">
    <button onclick="playIndex(currentIndex)">▶ 映像と日本語音声を同時スタート</button>
    <button class="secondary" onclick="pauseBoth()">⏸ 一時停止</button>
    <button class="secondary" onclick="nextTrack()">⏭ 次の局へ</button>
    <label style="font-size: 0.85rem; margin-left: auto;">
      現地音ボリューム: <input type="range" id="orig-vol" min="0" max="50" value="15" oninput="changeOrigVol(this.value)">
    </label>
  </div>
  <div class="script-box" id="script-box">ここに日本語読み上げ原稿が表示されます。</div>
  <ul class="playlist" id="playlist"></ul>
</div>

<audio id="ja-audio"></audio>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
  const newsItems = [{"station": "BBC 英国", "title": "Ukraine's power supply close to critical as Russian strikes bring darkness and cold", "videoId": "j64ZuY0pGGE", "audioUrl": "audio/01_BBC_英国.mp3", "script": "BBC 英国の主要ニュースです。\nTopic 1: Ukraine's power supply close to critical as Russian strikes bring darkness and cold. Single mother Daryna Kulchytska has been trying to giver her son Kyryll (left) and daughter Olena (right) as normal a childhood as possible Daryna Kulchytska is a mum under pressure. A single parent in a seventh floor flat in Kyiv trying to feed two lively kids and ensure they do their homework. But Daryna also faces the added strain of a deadline she can't even be certain of. All she knows is soon the lights will go out, the sockets will lose power, the wi-fi will drop, and the taps will run dry. Tonight, the electricity has kept flowing an hour longer than advertised, but Daryna's still racing to serve dinner and finish her own work from home. \"The last few days it was only four or five hours we had power, but it's not at the same times. For two hours we have electricity, then for eight hours we don't.\" This rolling schedule of planned power cuts has been in place since October, as Russia intensified attacks on Ukraine's energy grid. Ukraine has responded by striking Russian oil refineries. Officials are concerned that life will quickly become unsustainable for millions of Ukrainians if power supplies cannot be maintained for at least four hours per day. Some privately warn that's close already, as some families are living with outages of up to 20 hours in Kyiv. The power cuts were introduced earlier this year than last winter, and they're already lasting longer - making homes like Daryna's darker and colder. She's wrapped in layers of clothing and a heavy coat - the temperature is dropping, indoors and out. Just before 7:30pm, there's a click and that's it - darkness until dawn. The lift doesn't work, the water will stop flowing because electricity is needed to pump it to their flat. So the torches and LED candles come out and Daryna, her son Kyryll and daughter Olena gather for a card game of Uno before an early night. Twelve-year-old Kyryll, speaking perfect English learned during two years living in the US, is frank about the disruption. \"There's no light, no water, no heat, no electricity. And no fun. All the fun got sucked out with the electricity,\" he says. \"We have a lot of board games. We have a whole shelf, but we've played them like a hundred thousand times already.\" Many families sit in the shadows as blackouts sweep entire neighbourhoods, smothering homes and streets in darkness.\nTopic 2: Democrat Scott Colom seals historic win in Mississippi Senate race. Colom is the first black person from the southern state elected to the US Senate in over 140 years.\nTopic 3: Israeli strike on hospital kills at least five Palestinians, Gaza civil defence agency says. The strike hit the surgery department of Nasser Hospital, injuring at least 20 people and causing extensive damage, a spokesperson says."}, {"station": "ABC 米国", "title": "Van crashes on mountain road in Nepal, 10 killed and 5 injured", "videoId": "Y0_10K7LkC0", "audioUrl": "audio/02_ABC_米国.mp3", "script": "ABC 米国の主要ニュースです。\nTopic 1: Van crashes on mountain road in Nepal, 10 killed and 5 injured. A passenger van veered off a mountain road in Nepal on Thursday, killing at least 10 people KATHMANDU, Nepal -- A passenger van veered off a mountain road in Nepal on Thursday and at least 10 people were killed and five were injured in the crash, police said. The van rolled about 700 meters (2,300 feet) off the road before stopping on a slope near the village of Bhimphedi, about 60 kilometers (31 miles) southwest of the capital, Kathmandu. Police from a nearby station were able to take the survivors to hospitals for treatment. The cause of the wreck was not clear, but police were investigating. Nepal is celebrating the Tihar festival this week and people are traveling to their homes to celebrate with families. Bus accidents in Nepal are mostly due to poorly maintained roads and vehicles, and much of the Himalayan country is covered by mountains with narrow roads. 24/7 coverage of breaking news and live events\nTopic 2: This Beirut family has sold falafel for 100 years, through war and crisis. It has no plan to stop. The Tabbara family has been making falafel in Lebanon for over a century\nTopic 3: Ireland faces pressure to stop sending Russia an ingredient vital to its war on Ukraine. A cargo ship is set to leave Ireland for Russia with alumina, a white powder that experts say is likely used to make weapons"}, {"station": "KBS 韓国", "title": "KOSPI Down 0.61% Thursday", "videoId": "HJhVHuw75VA", "audioUrl": "audio/07_KBS_韓国.mp3", "script": "KBS 韓国の主要ニュースです。\nTopic 1: KOSPI Down 0.61% Thursday. Written: 2026-11-12 15:53:59 / Updated: 2026-11-12 15:58:48 Creative [4K] ATEEZ, ALD1, NMIXX, RIIZE, ILLIT, NCT WISH, A2O LITE, EVNNE, A2O SOUL | On the way to Music Bank 261030 2026-10-30 Wonder Hours with Hyerim The Season of FLARE U: You Make Us Bloom! 2026-10-28 K-POP News November’s comeback lineup to warm up the winter chill! 2026-11-04 Copyright ⓒ KBS. All rights reserved. No copy, distribution or use of the content (AI learning included). This website is sponsored by the Korea Media and Communications Commission. The Web site is optimized for viewing in Chrome, Safari, Firefox and Internet Explorer 11 and higher versions. This website uses cookies and other technology to enhance quality of service. Continuous usage of the website will be considered as giving consent to the application of such technology and the policy of KBS. For further details >\nTopic 2: Vice FM Says Seoul Keeping Close Watch for Potential US-China-Russia Summit. [Politics] :First Vice Foreign Minister Park Yoon-joo says Seoul is closely monitoring developments on a potential trilateral summit involving the United States, China, and Russia on the sidelines of the Asia-Pacific Economic Cooperation(APEC) summit next week.\n\nPark told lawmakers on the Foreign Affairs and ...[more...]\nTopic 3: S. Korean Footballers Address Team Rift, Pledge to Focus on Performance. [Sports] :A reported rift within South Korea's national football team appears to be easing, after five players at the center of the controversy issued a joint statement apologizing for causing concern among fans.\n\nAfter weeks of speculation about tensions within the team, five players—captain Son Heung-min, ...[more...]"}];
  document.getElementById("page-title").textContent = "🌍 世界の朝刊 NHK風同時通訳プレイヤー (2026年11月12日)";

  let player = null;
  let currentIndex = 0;
  const audioEl = document.getElementById("ja-audio");
  const playlistEl = document.getElementById("playlist");

  newsItems.forEach((item, idx) => {
    const li = document.createElement("li");
    li.id = "item-" + idx;
    li.innerHTML = `<div><div class="station">${item.station}</div><div class="title">${item.title}</div></div><button>▶ 同時再生</button>`;
    li.onclick = () => playIndex(idx);
    playlistEl.appendChild(li);
  });

  function onYouTubeIframeAPIReady() {
    if (newsItems.length === 0) return;
    player = new YT.Player("yt-player", {
      videoId: newsItems[0].videoId,
      playerVars: { playsinline: 1, rel: 0 },
      events: {
        onReady: () => {
          player.setVolume(document.getElementById("orig-vol").value);
        }
      }
    });
  }

  function playIndex(idx) {
    if (idx < 0 || idx >= newsItems.length) return;
    currentIndex = idx;
    const item = newsItems[idx];

    document.querySelectorAll(".playlist li").forEach(el => el.classList.remove("active"));
    document.getElementById("item-" + idx).classList.add("active");
    document.getElementById("now-playing").textContent = "放送中: " + item.station + " - " + item.title;
    document.getElementById("script-box").textContent = item.script;

    if (player && player.loadVideoById) {
      player.loadVideoById({ videoId: item.videoId, startSeconds: 0 });
      player.setVolume(document.getElementById("orig-vol").value);
      player.playVideo();
    }
    audioEl.src = item.audioUrl + "?t=" + Date.now();
    audioEl.currentTime = 0;
    audioEl.play();
  }

  function pauseBoth() {
    if (player && player.pauseVideo) player.pauseVideo();
    audioEl.pause();
  }

  function nextTrack() {
    if (currentIndex + 1 < newsItems.length) {
      playIndex(currentIndex + 1);
    } else {
      pauseBoth();
      document.getElementById("now-playing").textContent = "本日の全ニュースの放送が終了しました。";
    }
  }

  function changeOrigVol(val) {
    if (player && player.setVolume) player.setVolume(val);
  }

  audioEl.addEventListener("ended", () => {
    nextTrack();
  });
</script>
</body>
</html>
