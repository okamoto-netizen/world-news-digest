ers say. Parastoo Ahmadi, three musicians and a producer were reportedly given 74 lashes in Qom.\nTopic 3: 'I want to destroy capitalism, not France': On the streets with the French ultra left. The BBC meets the far-left protesters French President Emmanuel Macron says are trying to bring down the Republic."}, {"station": "ABC 米国", "title": "EU proposes sweeping new Russia sanctions targeting banks, crypto and sports events", "videoId": "BQElO0IGDcI", "audioUrl": "audio/02_ABC_米国.mp3", "script": "ABC 米国の主要ニュースです。\nTopic 1: EU proposes sweeping new Russia sanctions targeting banks, crypto and sports events. The European Commission has proposed new sanctions against Russia, targeting banks, crypto platforms, and sporting teams competing under the Russian flag BRUSSELS -- The European Commission on Monday proposed to target dozens of Russia’s banks, crack down on crypto platforms, and slap bans on sporting teams and athletes from competing under the country’s flag in a new round of sanctions over Moscow's war in Ukraine. The proposals, put forward by Commission President Ursula von der Leyen, must be endorsed by all 27 European Union member countries before they can enter into force. The process can take weeks, and the planned measures are likely to be modified. The sanctions are intended to keep economic pressure on Russia, almost five years into its full-scale invasion of Ukraine. The bloc has already hit more than 4,700 people and entities, including President Vladimir Putin, and several energy companies. Von der Leyen said the move means the EU will be “striking harder at Russia’s way to finance its war by targeting its banks and crypto platforms,” and will be “shutting the door to its participation to European sports and cultural events.” She said 60 banks will be removed from the Swift messaging system used for international payments. Countries helping Russia to evade sanctions could be caught by the EU's crypto measures, and a crypto sanctions task force would also be launched, von der Leyen said. The commission wants to target 70 more vessels from Russia’s shadow fleet , which the Kremlin uses to move illicit oil, and to ban all tanker vessels there from European ports. Europeans would be prevented from occupying top posts of Russian companies. It’s also proposing a ban on visas for Russians who have fought in the war on Ukraine. “Russian ex-combatants pose a security risk to Europe,” von der Leyen said. “They cannot be allowed to wander freely across our countries. Therefore, entry into the European Union will be off limits.” She also said that the EU must ban the display of Russian symbols at sporting or cultural events. The proposals come just over a month after the EU posted the single biggest listing of sanctions against Russia, targeting almost 1,600 Russian officials and companies linked to its arms industry, notably those suspected of making drone or missile parts. 24/7 coverage of breaking news and live events\nTopic 2: Drone attack on Colombian police base injures civilians and damages homes. Explosive-laden drones have struck a police base in Cúcuta, Colombia, injuring two civilians and damaging 60 homes\nTopic 3: WHO director-general visits Cuba as healthcare system breaks down. The World Health Organization's top official is visiting Cuba as the island’s healthcare system crumbles under a spiraling economic crisis and worsening power outages"}, {"station": "AlJazeera 中東", "title": "Iran hits US bases and civilian sites in the Gulf after a lull", "videoId": "_tFLx2-Y1w8", "audioUrl": "audio/03_AlJazeera_中東.mp3", "script": "AlJazeera 中東の主要ニュースです。\nTopic 1: Iran hits US bases and civilian sites in the Gulf after a lull. Tehran has ramped up attacks in recent days as the US naval blockade and sanctions campaign hurt the country. After a relative lull in its conflict with the United States, Iran is striking US assets in Gulf countries again. Civilian facilities have been damaged. Is Iran just tightening its grip on the global economy? Can Tehran force the White House to ease its economic blockade? Ali Akbar Dareini — Researcher at the Center for Strategic Studies Barbara Slavin — Distinguished Fellow at the Stimson Center Mehran Kamrava — Professor of Government at Georgetown University in Qatar\nTopic 2: Turkish police hunting for lioness stalking Istanbul. Questions being asked about big cat's origins, with suspicion falling on the country's growing role in animal smuggling.\nTopic 3: Jensen Huang reinstated as Nvidia chief: How did we get here?. Just 11 days after resigning over a suspected espionage scandal, Jensen Huang has been reinstated as Nvidia’s CEO."}, {"station": "DW ドイツ", "title": "After Japan's APEC snub, what's next for its China ties?", "videoId": "rIWDK8JnHJw", "audioUrl": "audio/04_DW_ドイツ.mp3", "script": "DW ドイツの主要ニュースです。\nTopic 1: After Japan's APEC snub, what's next for its China ties?. Japan has long-running concerns over Chinese military expansionism, and Beijing has bristled at Sanae Takaichi's comments on Taiwan. The frosty ties were on full display at the APEC summit. Japanese Prime Minister Sanae Takaichi received a cold shoulder from China during the recent Asia-Pacific Economic Cooperation (APEC) summit in the tech hub of Shenzhen. After Takaichi arrived in Shenzhen on November 18 for the two-day summit, there was an immediate issue when the mobile stairs to the door of her aircraft were some way short of the threshold, requiring her to hold on to the door frame to step down around 40 centimeters (about 15 inches) to the top step. It may have been completely inadvertent, but upon safely reaching the airport tarmac, her official welcome was decidedly low-key. There were no musical performances, no cheering crowds or traditional dances, which were laid on for many other APEC leaders as they arrived. Japan's Yomiuri newspaper reported on November 20 that when Takaichi met Chinese leader Xi Jinping at the dinner reception, \"his reaction was cold.\"  and other technology to enhance quality of service. Continuous usage of the website will be considered as giving consent to the application of such technology and the policy of KBS. For further details >\nTopic 2: Tuesday to See Colder Temperatures with Strong Winds. [Domestic] :Skies will be mostly clear nationwide on Tuesday, but temperatures will drop overnight, bringing colder conditions in the morning.\n\nAccording to the Korea Meteorological Administration, most areas will see below-freezing morning lows, along with strong winds on Tuesday. \n\nMorning lows will range from ...[more...]\nTopic 3: KOSPI Plunges to Levels Seen Early This Year Amid Worsened Investor Sentiment. [Economy] :The benchmark Korea Composite Stock Price Index (KOSPI) dipped to levels seen earlier this year on Monday after investor sentiment sharply worsened amid growing distrust in AI investment.\n\nAccording to the Korea Exchange, the main bourse fell three-point-31 percent from last Friday to close at ...[more...]"}, {"station": "CNA アジア", "title": "Israeli strikes kill at least three in Gaza, including worker with UN Palestinian agency", "videoId": "uLQA4aiLKXs", "audioUrl": "audio/09_CNA_アジア.mp3", "script": "CNA アジアの主要ニュースです。\nTopic 1: Israeli strikes kill at least three in Gaza, including worker with UN Palestinian agency. Palestinians mourn Adel Al-Helo, an UNRWA employee who was killed in an Israeli strike, according to Gaza's health ministry, in Gaza City, Nov 23, 2026. (Photo: REUTERS/Dawoud Abu Alkas) CAIRO: Israeli air strikes kill ed at least three people in Gaza on Monday (Nov 23), including a man working for the UN Palestinian refugee agency UN RWA, the relief agency and local health officials said. The UN RWA worker , whom medics named as Adel Al-Helo, was working near a well in the Jabalia refugee camp in the enclave's north, the agency and medics said. Three others were wo un ded in the strike, they said. \"The initial reports indicate that the strike hit a target on the street near the water well, which was manned by UN RWA staff and a guard. The staff were engaged in their regular duties associated with water well operations,\" an UN RWA spokesperson told Reuters. The Israeli military said it was checking the report in response to Reuters' request for comment. Helo's body was wrapped in a white shroud, his blue vest bearing UN RWA's logo stained with blood, as friends and relatives bade farewell outside the hospital's morgue. \"(He) has been kill ed by an Israeli strike in Jabalia camp by the Israeli army, they don't make any difference (between) the civilian people and other people, even the people of the Un ited Nations,\" said Helo's brother Nizar, kneeling beside the body, speaking in English. \"He went to r un the water well to supply the residents of Jabalia camp with water. He's worked at the agency for 35 years,\" he told Reuters. Later on Monday, another Israeli airstrike targeted a vehicle in western Gaza City, kill ing two people and wo un ding others, medics said. The Israeli military did not immediately comment. An October 2025 US-backed ceasefire halted ​major fighting in the shattered territory, but has not stopped ⁠ Israeli attacks on Gaza or secured Hamas' disarmament. At least 1,600 Palestinian s and five Israeli soldiers have been kill ed since then, according to respective Palestinian and Israeli tallies. Israeli troops now control aro un d two-thirds of Gaza , up from more than half at the time of the ceasefire, with Hamas controlling a sliver of territory along Gaza 's coast.\nTopic 2: Saudi Arabia accused of playing spoiler after COP failure. War-related economic pressure and a forecast 3.3 per cent GDP drop have reinforced Riyadh’s reliance on oil, complicating Vision 2030 diversification efforts.\nTopic 3: Democrats turn sights to 2028 after US midterms triumph. The first debate is scheduled for June next year."}, {"station": "ABC 豪州", "title": "Live: Wall Street roars back as Nvidia's Jensen Huang reinstated", "videoId": "DrVC4_rz5y8", "audioUrl": "audio/10_ABC_豪州.mp3", "script": "ABC 豪州の主要ニュースです。\nTopic 1: Live: Wall Street roars back as Nvidia's Jensen Huang reinstated. Wall Street has come roaring back, after Nvidia sensationally announced the return of its scandal engulfed chief executive and founder, Jensen Huang. Follow the day's financial news and insights from our specialist business reporters on our live blog. Disclaimer: this blog is not intended as investment advice. Nvidia's decision to reinstate Jensen Huang as its chief executive, effective immediately, comes just days after the board ruled out his return . Mr Huang resigned from the global artificial intelligence giant this month after revelations of extramarital affairs, including one with a businesswoman US authorities suspected of spying for China. Beijing had denied the spying allegations and Nvidia says the board unanimously voted to reinstate Mr Huang after it was satisfied with his \"candour and ability to lead\" the company. Mr Huang, who co-founded the business, thanked the board for its \"confidence and deliberation\" over the past few weeks. After a correction on Wall Street last week and fears about the AI bubble bursting , investors have woken up to the news that Nvidia's scandal-engulfed CEO Jensen Huang has been sensationally reinstated. The tech index Nasdaq has soared more than 6 per cent on this news, while the broader S & P and Dow are up more than 4 and 3 per cent respectively. And safe to say Nvidia's stock is also up … by 32 per cent. We'll bring you more as this story develops, however for now I recommend this analysis piece by Ian Verrender. Your home of Australian stories, conversations and events that shape our nation.\nTopic 2: King Charles and Elton John pay tribute to Molly Meldrum. King Charles has made reference to his famous 1977 appearance on Countdown as he mourned the loss of Molly Meldrum, who died yesterday at the age of 83.\nTopic 3: Jensen Huang's extraordinary return, and why it isn't the end of the Nvidia saga. The shock return of Jensen Huang, heralded by US President Donald Trump, does not mean the Nvidia co-founder is out of the woods."}];
  document.getElementById("page-title").textContent = "🌍 世界の朝刊 NHK風同時通訳プレイヤー (2026年11月24日)";

  let player = null;
  let currentIndex = 0;
  const audioEl = document.getElementById("ja-audio");
  const playlistEl = document.getElementById("playlist");

  newsItems.forEach((item, idx) => {
    const li = document.createElement("li");
    li.id = "item-" + idx;
    li.innerHTML = `<div><div class="station">${item.station}</div><div class="title">${item.title}</div></div><button>▶ 同時再生</button>`;
    li.onclick = () => playIndex(idx);
    playlistEl.appendChild(li);
  });

  function onYouTubeIframeAPIReady() {
    if (newsItems.length === 0) return;
    player = new YT.Player("yt-player", {
      videoId: newsItems[0].videoId,
      playerVars: { playsinline: 1, rel: 0 },
      events: {
        onReady: () => {
          player.setVolume(document.getElementById("orig-vol").value);
        }
      }
    });
  }

  function playIndex(idx) {
    if (idx < 0 || idx >= newsItems.length) return;
    currentIndex = idx;
    const item = newsItems[idx];

    document.querySelectorAll(".playlist li").forEach(el => el.classList.remove("active"));
    document.getElementById("item-" + idx).classList.add("active");
    document.getElementById("now-playing").textContent = "放送中: " + item.station + " - " + item.title;
    document.getElementById("script-box").textContent = item.script;

    if (player && player.loadVideoById) {
      player.loadVideoById({ videoId: item.videoId, startSeconds: 0 });
      player.setVolume(document.getElementById("orig-vol").value);
      player.playVideo();
    }
    audioEl.src = item.audioUrl + "?t=" + Date.now();
    audioEl.currentTime = 0;
    audioEl.play();
  }

  function pauseBoth() {
    if (player && player.pauseVideo) player.pauseVideo();
    audioEl.pause();
  }

  function nextTrack() {
    if (currentIndex + 1 < newsItems.length) {
      playIndex(currentIndex + 1);
    } else {
      pauseBoth();
      document.getElementById("now-playing").textContent = "本日の全ニュースの放送が終了しました。";
    }
  }

  function changeOrigVol(val) {
    if (player && player.setVolume) player.setVolume(val);
  }

  audioEl.addEventListener("ended", () => {
    nextTrack();
  });
</script>
