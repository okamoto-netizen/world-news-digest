  const newsItems = [{"station": "BBC 英国", "title": "Putin's Crimean Bridge partly collapses as Zelensky hails 'unprecedented' attack by Ukraine", "videoId": "EoDOflVMcQA", "audioUrl": "audio/01_BBC_英国.mp3", "script": "BBC 英国の主要ニュースです。\nTopic 1: Putin's Crimean Bridge partly collapses as Zelensky hails 'unprecedented' attack by Ukraine. Footage shows Ukrainian missile approach Crimea bridge Ukraine has severely damaged a critical bridge linking Russia to occupied Crimea, in what President Volodymyr Zelensky says was an \"unprecedented operation\" weeks in the making. Images shared by Ukrainian officials show a section of the Crimean Bridge has collapsed into the water, dealing a logistical and symbolic blow to Moscow's war effort. The Kremlin said it would rebuild the bridge \"better than before\" and that Russian President Vladimir Putin had been briefed on the overnight attack. Elsewhere, Kyiv Mayor Vitaliy Klitschko said the Pivnichnyi (Northern) and Pivdennyi (Southern) bridges - key crossings over the Dnipro River - had been closed after Russia hit Ukraine's capital overnight. The Southern bridge partially reopened on Tuesday, Klitschko said. Ukraine has long targeted the Crimean Bridge, which provides a road and rail route for Russian soldiers heading towards the front line, but has struggled to close it for good. While Kyiv has been trying to increase the cost to Russia of waging war economically, by hitting oil refineries and depots, striking the bridge is an attempt to increase the political cost on Russian President Vladimir Putin. The timing of the strike comes at a significant moment, ahead of Putin meeting the leaders of China and the US. This could cloud his moment back in the spotlight. The Crimean Bridge was built by Russia after it invaded and illegally annexed Ukraine's southern peninsula in 2014. The $3.6bn (Â£2.7bn) piece of infrastructure is widely seen in Russia and Ukraine as Putin's personal pet project: His close tycoon friend Arkady Rotenberg built it, and then Putin personally opened it by driving a lorry over it in May 2018. Putin (centre) personally opened the Crimean Bridge by driving a lorry over it in May 2018\nTopic 2: How the attack on Crimean Bridge unfolded. One of the key symbols of Russia's occupation of Ukraine has suffered major damage after a seven-stage attack by Kyiv.\nTopic 3: Jensen Huang says he would be 'honoured' to return as Nvidia CEO if board asked him. Huang says he has had an \"outpouring\" of calls from investors and others calling for him to return."}, {"station": "ABC 米国", "title": "Injured Australian lawmaker Helen Haines leaves hospital after alleged SUV attack", "videoId": "vhttVGpSgGA", "audioUrl": "audio/02_ABC_米国.mp3", "script": "ABC 米国の主要ニュースです。\nTopic 1: Injured Australian lawmaker Helen Haines leaves hospital after alleged SUV attack. An Australian federal lawmaker who was almost killed by a car in an allegedly deliberate attack has thanked well-wishers around the world MELBOURNE, Australia -- An Australian federal lawmaker who was almost killed by a car in an allegedly deliberate attack thanked well-wishers around the world Monday and revealed she had been discharged from a hospital where she spent the past month. In her first public statement since being struck by a SUV on Oct. 19, Helen Haines said she was “very pleased to confirm” she had left Melbourne’s The Alfred hospital. Witnesses said she was repeatedly rammed by the vehicle outside her electorate office. The 65-year-old independent lawmaker said she would remain in Melbourne for the “rehabilitation stage” of her recovery. Her staff would not disclose where her rehabilitation would take place for privacy reasons. “This is a really positive moment, and I am full of gratitude for the expert and compassionate care I received at the Alfred and am receiving in this next stage,” Haines said. “I appreciate the thousands of warm wishes and supportive messages from people across (my electorate) Indi, throughout ees futures trading, which last week called on the company to end the bets. Earlier this year, Kalshi’s surveillance system flagged to the agency potential insider trading concerns involving these markets. It was later discovered that a White House teleprompter operator had traded on markets related to the president’s comments. The teleprompter operator, Gabriel Perez, received a three-year ban from the platform and was required to pay $65,000 in penalties, as well as relinquish his $107,000 in winnings to the CFTC. By August, the CFTC had begun an internal review of prediction markets, according to CNBC. The move comes amid a new wave of scrutiny of prediction market platforms by the CFTC. That marks a shift from the stance of Chair Michael Selig, who had previously championed the emerging industry, but has now adopted a tougher tone, launching investigations into Kalshi and its competitor Polymarket, which is not regulated by the commission. Kalshi, in particular, had been under investigation for developing new products without notifying the commission, according to a report by Politico earlier this month. The development also comes as Donald Trump Jr, the president’s eldest son, stepped down from his role as a paid strategic adviser to the company last week. While Kalshi has pulled markets involving mentions by the president, wagers on what other prominent figures will say remain active. These include predictions about comments by elected US officials, including Vice President JD Vance and New York Mayor Zohran Mamdani, at the upcoming New York Times DealBook Summit, as well as remarks by executives at Microsoft and SpaceX. Other active markets concern what companies such as Nvidia and retail giant Target will say during their earnings calls. Kalshi has also stopped listing some markets at the request of the regulatory agency, including certain sports-related markets, according to the Reuters news agency. Neither Kalshi nor the CFTC responded to Al Jazeera’s request for comment.\nTopic 2: Police charge crowds at Brussels student march. Thousands of students and teachers marched in Brussels against higher tuition fees, education reforms and cuts.\nTopic 3: China, Canada expand tariff relief after Carney-Xi meeting. China offers tariff cuts on Canadian pork and seafood, as Canada extends exemptions for Chinese steel and aluminium."}, {"station": "DW ドイツ", "title": "EU, ASEAN pursue deeper trade ties, but hurdles remain as businesses struggle with informal barriers", "videoId": "a604iU6By4I", "audioUrl": "audio/04_DW_ドイツ.mp3", "script": "DW ドイツの主要ニュースです。\nTopic 1: EU, ASEAN pursue deeper trade ties, but hurdles remain as businesses struggle with informal barriers. 2027 could be a landmark year for EU–Southeast Asia trade, with several deals nearing completion. But the harder task will be to ensure that businesses actually use them. The European Union and the Association of Southeast Asian Nations (ASEAN) could be heading for a breakthrough year in 2027, when the two sides mark 50 years of diplomatic ties. A long-awaited trade agreement with Indonesia is expected to take effect, while a deal with the Philippines is nearing completion and negotiations with Thailand and Malaysia are making progress. By the end of next year, the EU could have trade deals in place with six Southeast Asian states, up from just two today. The anniversary could also revive the long-standing ambition of a broader trade agreement between the EU and ASEAN. On November 17, the European Commission hosted a dialogue in Brussels to discuss trade relations with Southeast Asia, including progress on existing and pending free trade agreements (FTAs). But attention is turning to what comes next. \"Finalizing FTAs is only the beginning, not the end,\" Chris Humphrey, executive director of the EU-ASEAN Business Council, told DW. FTAs can reduce tariffs and remove trade restrictions, but that is of little use if businesses don't know how to use them, he added. \"Unfortunately, in many cases, this is where there is a failure. Communication and training are key,\" Humphrey said. To view this video please enable JavaScript, and consider upgrading to a web browser that supports HTML5 video For Brussels, the priority should now be to tackle the less conspicuous obstacles to trade, he stressed. Cutting customs delays, simplifying regulations, and helping smaller European businesses enter unfamiliar Southeast Asian markets will determine whether an FTA succeeds. \"European companies with little or no experience in Southeast Asia would benefit from greater on-the-ground support, particularly practical, firsthand guidance on informal business practices and the unwritten local rules,\" Alfred Gerstl, an associate professor at Palacky University Olomouc in the Czech Republic, told DW.\nTopic 2: Saudi Arabia: Rights groups raise alarm over rising number of executions. Amid the war in Iran, Saudi Arabia's human rights situation remains bleak, with at least 211 executions, corporal punishment and an intensifying crackdown on critics. Is the regional conflict driving domestic repression?\nTopic 3: Iran's growing exodus of young talent. Conflict and uncertainty are driving more and more educated young Iranians to consider leaving the country."}, {"station": "France24 フランス", "title": "Authorities take over Turkey's last pro-opposition broadcaster Sozcu TV", "videoId": "YszQF4Lk4F0", "audioUrl": "audio/05_France24_フランス.mp3", "script": "France24 フランスの主要ニュースです。\nTopic 1: Authorities take over Turkey's last pro-opposition broadcaster Sozcu TV. Police raided the Istanbul headquarters of Sozcu TV on Tuesday, dealing another significant blow to Turkey's pro-opposition media. This is the third such seizure of pro-opposition media in just over a year. It comes amid public uproar over a multi-billion investment fund scandal that has affected the savings of nearly half a million people and piled pressure on President Recep Tayyip Erdogan's ruling AKP party ahead of elections in 2028. FRANCE 24's Jasper Mortimer reports from Ankara.\nTopic 2: The centre cannot hold? Splintered moderates lag in French presidential race. Five months to go before the French vote in the presidential election first round to choose Emmanuel Macron’s successor. Not much of a race so far for the top two spots and the May Second runoff: there’s the far-right’s Marine Le Pen, the far-left’s Jean-Luc Mélenchon and way behind there’s the rest. Whether on social media or in the streets, their supporters rule. A radical break with the mainstream.\nTopic 3: France: Protesters march for better salaries across the country. Tens of thousands of people took part in protests across France on Tuesday after unions called a new nationwide public sector strike to demand pay rises. What started over two months ago as high school student protests has now morphed into a wider movement against the increasing cost of living."}, {"station": "KBS 韓国", "title": "Lee, Takaichi Hold Summit on Sidelines of ASEAN Meeting", "videoId": "zazIWnbj2ug", "audioUrl": "audio/07_KBS_韓国.mp3", "script": "KBS 韓国の主要ニュースです。\nTopic 1: Lee, Takaichi Hold Summit on Sidelines of ASEAN Meeting. Written: 2026-11-17 19:37:21 / Updated: 2026-11-17 19:48:03 Creative [4K] JISOO, ATEEZ, NCT DREAM, TWS, RESCENE, A2O SOUL, ILLIT, CHAERYEONG, UNCHILD | On the way to Music Bank 261113 2026-11-13 Wonder Hours with Hyerim NO CAP CONFESSIONS | Who Said Romance Is for Anniversaries Only? 2026-11-11 K-POP News November’s comeback lineup to warm up the winter chill! 2026-11-04 Copyright ⓒ KBS. All rights reserved. No copy, distribution or use of the content (AI learning included). This website is sponsored by the Korea Media and Communications Commission. The Web site is optimized for viewing in Chrome, Safari, Firefox and Internet Explorer 11 and higher versions. This website uses cookies and other technology to enhance quality of service. Continuous usage of the website will be considered as giving  already taking action to bring their outbreaks under control. Bolivia, Mexico, and the United States are implementing measures to strengthen vaccination, surveillance, and outbreak response,\" PAHO Director Jarbas Barbosa said in a media briefing. Measle s elimination status is more than just a public health designation, he said. It signifies that the virus has circulated for a prolonged period, putting people at risk of preventable illness, hospitalisation and death. CNA Games Guess Word Crack the word, one row at a time Buzzword Create words using the given letters Mini Sudoku Tiny puzzle, mighty brain teaser Mini Crossword Small grid, big challenge Word Search Spot as many words as you can Show More Show Less \"PAHO's ruling formalises what was already plainly visible. The US has lost the ability to control measle s,\" said Dr. Amesh Adalja, an infectious disease expert and senior scholar at the Johns Hopkins University Centre for Health Security. The United States is battling the highest number of measle s cases it has seen in more than three decades. Some 7,700 people in the US have been infected with measle s and 13 have died since 2025. The overwhelming majority of cases have been among people who were not vaccinated. To regain its measle s elimination status, PAHO officials said the US must submit a corrective action plan that outlines the strategies and measures it will implement and then prove it is free of the virus for a period of 12 months. The US is expected to submit its plan in the coming weeks, said Dr. Daniel Salas, executive manager of PAHO's Special Programme for Comprehensive Immunisation. \"PAHO's ruling formalises what was already plainly visible. The US has lost the ability to control measle s,\" said Dr. Amesh Adalja, an infectious disease expert and senior scholar at the Johns Hopkins University Centre for Health Security. The United States is battling the highest number of measle s cases it has seen in more than three decades. Some 7,700 people in the US have been infected with measle s and 13 have died since 2025. The overwhelming majority of cases have been among people who were not vaccinated. To regain "}, {"station": "ABC 豪州", "title": "Fears damage already done after government's backpacker backdown", "videoId": "0GVJV_go_1c", "audioUrl": "audio/10_ABC_豪州.mp3", "script": "ABC 豪州の主要ニュースです。\nTopic 1: Fears damage already done after government's backpacker backdown. Grain grower Craig Henderson had to scramble to find enough overseas workers on his Victorian farm for harvest. ( ABC Mildura Swan-Hill: Petra Oates ) The government's partial backdown on visa requirements for working holiday-makers has sparked a mixed reaction across regional Australia. Farmers believe the damage has already been done, with the government's changes driving away much-needed workers. Backpackers believe the requirement to spend 120 days in regional Australia for a visa extension is not fair. The federal government's backdown on its planned overhaul of working holiday visa rules has drawn a cautious welcome across the country. Announced by Home Affairs Minister Tony Burke on Tuesday, the changes require working holiday-makers to complete 120 days of regional work, up from 88, to qualify for a second-year visa. The planned cap for third-year visas will also rise to 25,000, with the rollout of a controversial ballot for places now delayed until next year. But many farmers fear the damage has already been done. Tony Burke announced the changes on Tuesday, saying industry had been heavily consulted. ( ABC Far North: Brendan Mounter ) \"I can't work out what's wrong with the government; bringing in something [without] consultation, then going and changing it is putting everyone in a spin,\" Victorian grain grower Craig Henderson said. Farming near Warracknabeal, 330 kilometres north-west of Melbourne, he scrambled to secure 16 international workers he needed for harvest. \"It's hard enough getting staff now in regional areas,\" Mr Henderson said.\nTopic 2: So You Are owner outraged by treatment of dead horse's remains. The owner-breeder of Melbourne Cup runner So You Are demands action after the horse's body was found in a skip at a Sydney rubbish tip.\nTopic 3: Australia hits the godmother of Israel's settler movement with sanctions. Israeli settlements 'godmother' Daniella Weiss and her 'Nachala' organisation are hit with Australian sanctions, announced this morning by the Foreign Minister Penny Wong."}];
  document.getElementById("page-title").textContent = "🌍 世界の朝刊 NHK風同時通訳プレイヤー (2026年11月18日)";

  let player = null;
  let currentIndex = 0;
  const audioEl = document.getElementById("ja-audio");
  const playlistEl = document.getElementById("playlist");

  newsItems.forEach((item, idx) => {
    const li = document.createElement("li");
    li.id = "item-" + idx;
    li.innerHTML = `<div><div class="station">${item.station}</div><div class="title">${item.title}</div></div><button>▶ 同時再生</button>`;
    li.onclick = () => playIndex(idx);
    playlistEl.appendChild(li);
  });

  function onYouTubeIframeAPIReady() {
    if (newsItems.length === 0) return;
    player = new YT.Player("yt-player", {
      videoId: newsItems[0].videoId,
      playerVars: { playsinline: 1, rel: 0 },
      events: {
        onReady: () => {
          player.setVolume(document.getElementById("orig-vol").value);
        }
      }
    });
  }

  function playIndex(idx) {
    if (idx < 0 || idx >= newsItems.length) return;
    currentIndex = idx;
    const item = newsItems[idx];

    document.querySelectorAll(".playlist li").forEach(el => el.classList.remove("active"));
    document.getElementById("item-" + idx).classList.add("active");
    document.getElementById("now-playing").textContent = "放送中: " + item.station + " - " + item.title;
    document.getElementById("script-box").textContent = item.script;

    if (player && player.loadVideoById) {
      player.loadVideoById({ videoId: item.videoId, startSeconds: 0 });
      player.setVolume(document.getElementById("orig-vol").value);
      player.playVideo();
    }
    audioEl.src = item.audioUrl + "?t=" + Date.now();
    audioEl.currentTime = 0;
    audioEl.play();
  }

  function pauseBoth() {
    if (player && player.pauseVideo) player.pauseVideo();
    audioEl.pause();
  }

  function nextTrack() {
    if (currentIndex + 1 < newsItems.length) {
      playIndex(currentIndex + 1);
    } else {
      pauseBoth();
      document.getElementById("now-playing").textContent = "本日の全ニュースの放送が終了しました。";
    }
  }

  function changeOrigVol(val) {
    if (player && player.setVolume) player.setVolume(val);
  }

  audioEl.addEventListener("ended", () => {
    nextTrack();
  });
</script>
