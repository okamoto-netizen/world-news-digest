 adding that the focus for the Netherlands \"will be on persons from countries of origin in the same region as Rwanda\". Once in Rwanda, people will be able to integrate into society, which means they will have the right of residence, as well as access to education, healthcare, the labour market and the legal system. Rwandan Interior Minister Vincent Biruta said the country is commmited to working with European partners to provide a \"safe, legal and dignified solution for migrants\".\nTopic 2: Yemeni forces retreat to defend port city from Houthis. Saudi-backed forces say they are moving troops from the Bab al-Mandab Strait to protect the interim capital, Aden.\nTopic 3: Trump backs return of ex-Nvidia boss after 'Bring Jensen Back' campaign launched. A number of tech figures want the board of the AI chip giant to give Jensen Huang his job back."}, {"station": "ABC 米国", "title": "Pope crosses Peru in finale of trip home to visit flock high in Andes, deep in Amazon", "videoId": "hxxQ-E6K0Mk", "audioUrl": "audio/02_ABC_米国.mp3", "script": "ABC 米国の主要ニュースです。\nTopic 1: Pope crosses Peru in finale of trip home to visit flock high in Andes, deep in Amazon. Pope Leo XIV is demanding justice for environmental defenders killed for protecting the Amazon PUCALLPA, Peru -- PUCALLPA, Peru (AP) — Pope Leo XIV on Sunday demanded justice for environmental defenders killed for protecting the Amazon and backed efforts by Indigenous peoples to stop their lands from being ravaged by logging, illegal mining and the “insatiable thirst for domination.” On the penultimate day of his South American odyssey, Leo traveled into the Peruvian Amazon and channeled one of Pope Francis ’ core teachings that links care for the most vulnerable with care for God’s creation. “The cry of the earth and the cry of the poor are inseparable,” Leo told Indigenous representatives and missionaries gathered along the Ucayali River in the northeastern city of Pucallpa. He said he came to Pucallpa to support them in their search for justice and peace and referred to what environmental groups estimate have been 57 murders of environmental defenders between 2010-2024. “The blood of these brothers cries out to God and demands justice,” Leo said to applause from the crowd, many of whom were wearing traditional feathered headwear and face markings of the region. In addition to the decades-long problem of deforestation, illegal gold mining has become an increasingly lucrative business in the Amazon, devastating forests and polluting rivers. Miners use makeshift suction dredges and mercury, a toxic metal, to extract gold. Raphael Hoetmer, Western Amazon program director at Amazon Watch, said wars and conflicts around the world have driven up the price of gold, increasing demand that in turn is resulting in more extraction from the Amazon. “It’s causing pollution, health issues, and environmental degradation,” he said. Illegal mining and coca production also drive deforestation and encroach on Indigenous territories, threatening ancestral lands and exposing communities to violence and organized crime. Leo addressed the combination of threats in one of his most forceful speeches to date, drawing on his years of experience as a Peruvian bishop and Francis’ constant preaching about the environment and the plight of Indigenous groups. During the encounter and a subsequent Mass in Pucallpa, he demanded a different model of economic development that respects the Earth and the Indigenous who care for it rather than the “irresponsible exploitation” by outside actors.\nTopic 2: Injured Australian lawmaker Helen Haines leaves hospital after alleged SUV attack. An Australian federal lawmaker who was almost killed by a car in an allegedly deliberate attack has thanked well-wishers around the world\nTopic 3: Pope bids 'hasta luego' to his second homeland of Peru as he wraps up marathon South American trip. Pope Leo XIV has bid farewell to his beloved homeland of Peru"}, {"station": "AlJazeera 中東", "title": "London Palestine Film Festival returns for 27th year", "videoId": "156eHG7Hqa0", "audioUrl": "audio/03_AlJazeera_中東.mp3", "script": "AlJazeera 中東の主要ニュースです。\nTopic 1: London Palestine Film Festival returns for 27th year. London Palestine Film Festival returns for 27th year Since 1999, the London Palestine Film Festival has brought Palestinian stories to the big screen. Over the past three years, it has seen growing popularity, as more audiences turn to cinema to learn about Israel’s genocidal war on Gaza.\nTopic 2: UEFA backs Diallo to challenge Infantino for FIFA presidency. UEFA has found its candidate to take on Gianni Infantino in next year’s FIFA presidential election\nTopic 3: What will Europe do next in Ukraine?. There is division within the European Union over diplomatic strategy for efforts to end the Russia-Ukraine war."}, {"station": "DW ドイツ", "title": "Nvidia scandal: China's chips dilemma, US rivalry shape AI race", "videoId": "DCQDa3M8ZLk", "audioUrl": "audio/04_DW_ドイツ.mp3", "script": "DW ドイツの主要ニュースです。\nTopic 1: Nvidia scandal: China's chips dilemma, US rivalry shape AI race. The controversy surrounding Nvidia and its former CEO Jensen Huang has put a spotlight on the intensifying AI race between the US and China. China has ambitious plans to become the leader in the global race for artificial intelligence (AI). Beijing is aware that the country needs cutting-edge chips to achieve this goal. Vice Premier Ding Xuexiang, who chairs the Communist Party's Commission on Science and Technology, has been tasked with strengthening China's capacity for technological innovation, which would enhance its strategic competitiveness against the United States. The party is currently using AI to monitor citizens, develop advanced unmanned weapons systems, and transform economic sectors through robotics and industrial automation, among other things. But the US has so far been leading the way in manufacturing technology and chip design. And Washington has taken a slew of measures to retain its dominance in this strategic sector. As early as 2023, the then Biden administration decided to restrict the export of advanced semiconductors and chip manufacturing equipment to China, citing national security reasons. Beijing slammed the US restrictions, calling them \"unilateral and arbitrary.\" US chipmakers, however, have been drawn to China's vast and rapidly growing market. Jensen Huang, who resigned as CEO of the American AI chip manufacturer Nvidia last week , enjoyed something of a rock star status in China. The 63-year-old, who was born in Taiwan, is viewed in China as a successful entrepreneur. Huang, who has emerged as a key adviser on AI to US President Donald Trump during his second term, has pushed for looser regulations and fewer restrictions on selling AI chips to China. In December, the Trump administration granted Nvidia permission to ship its H200 chips to China, provided the US got a 25% cut of sales. Although the H200 is not part of Nvidia's highest-performance series , it is significantly more efficient than competing Chinese products.\nTopic 2: Iran's growing exodus of young talent. Conflict and uncertainty are driving more and more educated young Iranians to consider leaving the country.\nTopic 3: Guinea's gold rush: Arrests, deportations spark outcry. Guinea has banned illegal gold mining, citing environmental concerns. It has further charged hundreds of suspected local and foreign illegal miners amid reports of rights abuses and deportations."}, {"station": "France24 フランス", "title": "'A futuristic debate now very real': Why the world is struggling to regulate killer robots", "videoId": "4UWDaRG1vw4", "audioUrl": "audio/05_France24_フランス.mp3", "script": "France24 フランスの主要ニュースです。\nTopic 1: 'A futuristic debate now very real': Why the world is struggling to regulate killer robots. Representatives from 128 nations are meeting in Geneva on Monday to decide whether to move ahead with negotiating legally binding rules around the use of AI-powered weapons that can kill without human involvement. FRANCE 24 spoke with artificial intelligence researcher Vincent Boulanin to find out just what is at stake.\nTopic 2: Czech mass protests: Media is the first casualty 'when you want to attack democracy'. As hundreds of thousands of people gather in Prague to protest the Czech government's proposal to replace public broadcasting licence fees with direct state funding, Delano D'Souza is pleased to welcome Bára Stárek, Executive Director of Díky, že můžem. Stárek warns that the proposed changes offer \"no real safeguards\" against political influence, pointing to developments in Slovakia and Hungary. She also drew a parallel with the Velvet Revolution of 1989, recalling that \"we didn't have a free media and we only had a state media\" under communist rule. \"Media is the first (line of) attack when you want to attack democracy,\" she said. With the legislation expected to reach Parliament in January, Stárek believes the demonstrations will continue if the government refuses to engage in any discussions.\nTopic 3: Robert Pattinson: British actor will be the next James Bond. British actor Robert Pattinson is set to become the next James Bond in the long-running 007 spy franchise.\n \nDiscussions over the casting of the new James Bond had been going on for months, with Pattinson emerging as one of the frontrunners from the outset."}, {"station": "KBS 韓国", "title": "Seoul City to Expand Public Transportation on Thursday for Suneung", "videoId": "_bq8sNqfe7w", "audioUrl": "audio/07_KBS_韓国.mp3", "script": "KBS 韓国の主要ニュースです。\nTopic 1: Seoul City to Expand Public Transportation on Thursday for Suneung. Written: 2026-11-16 18:39:03 / Updated: 2026-11-16 18:47:58 Creative [4K] JISOO, ATEEZ, NCT DREAM, TWS, RESCENE, A2O SOUL, ILLIT, CHAERYEONG, UNCHILD | On the way to Music Bank 261113 2026-11-13 Wonder Hours with Hyerim NO CAP CONFESSIONS | Who Said Romance Is for Anniversaries Only? 2026-11-11 K-POP News November’s comeback lineup to warm up the winter chill! 2026-11-04 Copyright ⓒ KBS. All rights reserved. No copy, distribution or use of the content (AI learning included). This website is sponsored by the Korea Media and Communications Commission. The Web site is optimized for viewing in Chrome, Safari, Firefox and Internet Explorer 11 and higher versions. This website uses cookies and other technology to enhance quality of service. Continuous usage of the website will be considered as giving consent to the application of such technology and the policy of KBS. For further details >\nTopic 2: North Jeolla Province Aiming to Host 2036 Summer Olympics without Seoul. [Sports] :Seoul and the city of Jeonju, North Jeolla Province, have decided not to pursue talks on co-hosting the 2036 Summer Olympics. \n\nThe province, also called Jeonbuk State, said in a statement released Monday that it is making every effort to host the event independently.\n\nThe province said North Jeolla ...[more...]\nTopic 3: S. Korea-Thailand Summit Held on Sidelines of ASEAN Summit. [Politics] :President Lee Jae Myung has expressed hope that Thai Prime Minister Anutin Charnvirakul will visit South Korea at an early date for extensive talks on ways to advance ties between the two countries.\n\nLee conveyed the sentiment Monday during a summit with Charnvirakul, held on the sidelines of the ASEAN ...[more...]"}, {"station": "CNA アジア", "title": "EU nations unveil Rwanda deal for migrant return hub", "videoId": "uz5asyifXgQ", "audioUrl": "audio/09_CNA_アジア.mp3", "script": "CNA アジアの主要ニュースです。\nTopic 1: EU nations unveil Rwanda deal for migrant return hub. Germany, Denmark, Austria, Greece and the Netherlands have agreed to establish a migrant deportation centre in Rwanda to facilitate the return of migrants without legal residency in Europe. Rwanda's Interior Minister Vincent Biruta, Austria's Chancellor Christian Stocker, Austrian Interior Minister Gerhard Karner, Netherland's Foreign Minister Tom Berendsen, Denmark's Integration Minister Morten Bodskov, German Interior Minister Alexander Dobrindt and Greek Minister of Integration Athanasios Plevris attend a media conference after migration talks in Vienna, Austria, Monday, Nov 16, 2026. (Photo: AP/Heinz-Peter Bader) VIENNA: Five EU countries including Germany and Denmark on Monday (Nov 16) unveiled a deal to establish a migrant deportation centre in Rwanda - the first such facility outside the bloc. The group, also comprising Austria, Greece and the Netherlands, has been gunning to open a \"return-hub\" despite rights groups' concerns, after the European Union cleared the way with a recent toughening of migration rules. \"If returning to their home country is not possible, then in the future people without a right of residence will be sent back to a third country such as Rwanda,\" Austrian Chancellor Christian Stocker said after a meeting of ministers from the five countries in Vienna. \"I am pleased that today we have achieved a truly historic paradigm shift in migration policy,\" Stocker said. Speaking alongside Stocker, Rwandan Interior Minister Vincent Biruta said the plan would offer \"a second chance to people who no longer have the right to remain in the partner country\". Ahead of the meeting, European Commission spokesman Markus Lammert welcomed the plans, noting that the EU had been \"closely following the preparatory work of the five member states for such a return hub\". Around 100 protesters gathered in Vienna on Monday ahead of the meeting, holding placards with slogans such as \"Stop EU-Rwanda deal!\" The announcement marks the culmination of an EU push to boost deportations launched in 2024, amid a souring of public opinion on migration. Migrant arrivals have steadily declined over the past three years, as the bloc struck deals to stem departures with a host of countries in Africa and the Middle East. But migration has remained a hot-button issue, fuelling far-right electoral gains across the bloc. Policymakers' focus has now turned to improving the repatriation system, which currently sees less than 30 per cent of people who are ordered to leave the bloc returned to their country of origin. An EU reform granting authorities broader detention powers and allowing for the creation of return hubs was approved earlier this year. Proponents say such centres - which would serve either as the final destination or as transfer centres for those expelled - could facilitate repatriations and act as a deterrent for would-be irregular migrants. But critics have questioned their effectiveness,"}, {"station": "ABC 豪州", "title": "Live: ASX to fall after Wall St sell-off", "videoId": "40ZE0ubSdcA", "audioUrl": "audio/10_ABC_豪州.mp3", "script": "ABC 豪州の主要ニュースです。\nTopic 1: Live: ASX to fall after Wall St sell-off. The Australian share market is set to open lower after Wall Street saw all major stock markets drop, largely driven by a technology sell-off. Meanwhile, the price of oil is trading down almost 4 per cent. Follow the day's financial news and insights from our specialist business reporters on our live blog. Disclaimer: this blog is not intended as investment advice. Choose what information you see below by using filters Business reporter Adelaide Miller here to guide you through the morning on the markets blog, covering the latest business, finance, and economic stories from across the globe. To start with, the ASX 200 is set to open lower later this morning, with Futures pointing down -0.5% to 9,041 points. That's as Wall Street wraps up the last 30 minutes of Monday trading in the red. All major stock markets have seen losses, largely driven by a technology sell-off (I will provide a breakdown shortly). But for now, grab yourself a coffee and see you back here soon! Your home of Australian stories, conversations and events that shape our nation. This service may include material from Agence France-Presse (AFP), APTN, Reuters, AAP, CNN and the BBC World Service which is copyright and cannot be reproduced. Get the latest ABC News delivered to your email inbox\nTopic 2: Students in Western Sydney suspended over 'antisemitic act' posted online. Students at a Sydney private school have been suspended over an antisemitic act its principal said went \"against the respect for human dignity\".\nTopic 3: Half of senior Qld doctors fear fatigue could contribute to errors, survey finds. A new survey shows half of senior doctors in Queensland are concerned fatigue could contribute to a clinical error, and almost a quarter anticipate quitting in the next two years."}];
  document.getElementById("page-title").textContent = "🌍 世界の朝刊 NHK風同時通訳プレイヤー (2026年11月17日)";

  let player = null;
  let currentIndex = 0;
  const audioEl = document.getElementById("ja-audio");
  const playlistEl = document.getElementById("playlist");

  newsItems.forEach((item, idx) => {
    const li = document.createElement("li");
    li.id = "item-" + idx;
    li.innerHTML = `<div><div class="station">${item.station}</div><div class="title">${item.title}</div></div><button>▶ 同時再生</button>`;
    li.onclick = () => playIndex(idx);
    playlistEl.appendChild(li);
  });

  function onYouTubeIframeAPIReady() {
    if (newsItems.length === 0) return;
    player = new YT.Player("yt-player", {
      videoId: newsItems[0].videoId,
      playerVars: { playsinline: 1, rel: 0 },
      events: {
        onReady: () => {
          player.setVolume(document.getElementById("orig-vol").value);
        }
      }
    });
  }

  function playIndex(idx) {
    if (idx < 0 || idx >= newsItems.length) return;
    currentIndex = idx;
    const item = newsItems[idx];

    document.querySelectorAll(".playlist li").forEach(el => el.classList.remove("active"));
    document.getElementById("item-" + idx).classList.add("active");
    document.getElementById("now-playing").textContent = "放送中: " + item.station + " - " + item.title;
    document.getElementById("script-box").textContent = item.script;

    if (player && player.loadVideoById) {
      player.loadVideoById({ videoId: item.videoId, startSeconds: 0 });
      player.setVolume(document.getElementById("orig-vol").value);
      player.playVideo();
    }
    audioEl.src = item.audioUrl + "?t=" + Date.now();
    audioEl.currentTime = 0;
    audioEl.play();
  }

  function pauseBoth() {
    if (player && player.pauseVideo) player.pauseVideo();
    audioEl.pause();
  }

  function nextTrack() {
    if (currentIndex + 1 < newsItems.length) {
      playIndex(currentIndex + 1);
    } else {
      pauseBoth();
      document.getElementById("now-playing").textContent = "本日の全ニュースの放送が終了しました。";
    }
  }

  function changeOrigVol(val) {
    if (player && player.setVolume) player.setVolume(val);
  }

  audioEl.addEventListener("ended", () => {
    nextTrack();
  });
</script>
