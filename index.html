 India visit. Video, 00:00:56 Street cricket with a legend then metro ride as William and Kate begin India visit\nTopic 2: 'The drones don't fly here' - BBC reports from Ukraine's new front line. Ukrainian forces are fighting Russian troops in an old Soviet tunnel in the Kharkiv region.\nTopic 3: Trump shakes hands with Putin and Xi ahead of historic talks in China. The three leaders will meet together for the first time on Thursday during a closely-watched summit."}, {"station": "ABC 米国", "title": "Ukraine criticizes IAEA plan to appoint sanctioned Russian official to senior post", "videoId": "eVkUEcyIDLw", "audioUrl": "audio/02_ABC_米国.mp3", "script": "ABC 米国の主要ニュースです。\nTopic 1: Ukraine criticizes IAEA plan to appoint sanctioned Russian official to senior post. Ukraine has criticized the proposal by the International Atomic Energy Agency to appoint a Russian official, sanctioned by Kyiv, to a senior position VIENNA -- VIENNA (AP) — Ukraine on Wednesday denounced a proposal by the head of the International Atomic Energy Agency to appoint a Russian official sanctioned by Kyiv to a senior position at the U.N. nuclear watchdog in Vienna. Ukraine’s Foreign Minister Andrii Sybiha called the proposed appointment of Alexey Ferapontov as deputy director general “categorically unacceptable” and urged IAEA chief Rafael Mariano Grossi to “abandon this appointment\" in a post on X. In a note sent Nov. 16 to all 35 members of the IAEA Board of Governors, which was seen by The Associated Press, Grossi proposed the nomination of Ferapontov to the position of deputy director general in the Department of Nuclear Energy. The note also proposed a candidate from the United States to the position of deputy director general in the Department of Management, and a candidate from North Macedonia to become director in the Department of Safeguards. Grossi suggested holding an informal briefing about the senior appointments with members of the board this week. According to the IAEA’s Statute and staff regulations, the IAEA director general has the authority to appoint staff members. “Ferapontov is subject to Ukrainian sanctions for his involvement in Russia’s attempts to legitimize the illegal seizure of the Zaporizhzhia Nuclear Power Plant,” Sybiha wrote on X. “Officials implicated in such violations should face accountability, not be rewarded with senior positions in international organizations,” he added. “Appointing a senior official from the Russian authority complicit in legitimizing Russia’s illegal seizure of the plant would be an unacceptable endorsement of impunity and a serious blow to the Agency’s credibility,” Sybiha noted. Ferapontov is currently deputy head of Rostechnadzor, Russia’s Federal Environmental, Industrial and Nuclear Supervision Service. The Russian Foreign Ministry did not immediately respond to a request for comment. The Zaporizhzhia nuclear power plant has been under Russian control since early in Moscow’s full-scale invasion of Ukraine . Although the plant is not operating , it needs reliable external power to cool its six shut-down reactors and spent fuel to avoid any catastrophic nuclear incidents. The plant is near the front line and has been occupied by Russia since March 2022. Ukraine and Russia have traded blame for shelling close to the plant.\nTopic 2: St. Peter's Basilica marks 400 years at the heart of Roman Catholicism. St. Peter’s Basilica, the spiritual heart of Roman Catholicism, marks the 400th anniversary of its dedication\nTopic 3: Remains of Ecuadorian killed in New York building collapse arrive in Quito. The remains of José Caguana, one of two Ecuadorian construction workers killed in a New Yor"}, {"station": "AlJazeera 中東", "title": "Putin’s nuclear briefcase makes surprise appearance at China summit", "videoId": "OYm5ujqbBzs", "audioUrl": "audio/03_AlJazeera_中東.mp3", "script": "AlJazeera 中東の主要ニュースです。\nTopic 1: Putin’s nuclear briefcase makes surprise appearance at China summit. Putin’s nuclear briefcase makes surprise appearance at China summit Russian President Vladimir Putin’s nuclear briefcase, which can be used to authorise a nuclear strike, was spotted at the APEC summit in China. It was being carried to a meeting by a naval officer, according to footage aired by Russian state TV.\nTopic 2: Muslims projected to overtake Christians as world’s largest religious group. New Pew Research Center projections point to major changes in the world’s religious landscape by 2070.\nTopic 3: US loses measles-free status after 26 years in historic setback. The US has lost its measles elimination status after 26 years, as its largest outbreak in over three decades continues."}, {"station": "DW ドイツ", "title": "North Korea expanded uranium enrichment plant, says IAEA head", "videoId": "cdXdN-3Jb7k", "audioUrl": "audio/04_DW_ドイツ.mp3", "script": "DW ドイツの主要ニュースです。\nTopic 1: North Korea expanded uranium enrichment plant, says IAEA head. IAEA chief Rafael Grossi has said the ongoing expansion of North Korea's uranium enrichment program remains \"a cause for serious concern.\" United Nations (UN) nuclear watchdog chief Rafael Grossi said on Wednesday North Korea has built an extension on its original uranium-enrichment plant at the Yongbyon nuclear complex. The International Atomic Energy Agency (IAEA) has been unable to access North Korea since Pyongyang expelled its inspectors in 2009. It now relies primarily on satellite imagery to monitor the country's nuclear activity. Grossi addressed the ongoing operation of enrichment facilities at Yongbyon and Kangson during a quarterly meeting of the IAEA's Board of Governors. Kangson lies just southwest of Pyongyang, while the much larger Yongbyon facility is located farther north of the capital. \"Since ​mid-September 2026, a further extension to the original ​Yongbyon enrichment facility has been under construction with the new extension externally complete by ​late October 2026,\" Grossi said, with no further details. He said the ongoing expansion of North Korea's uranium enrichment program remains \"a cause for serious concern.\" Enriched uranium is used as fuel for nuclear power plants and the nuclear reactors that run naval ships and submarines. It can also be used in nuclear weapons. US President Donald Trump floated the possibility of a meeting with North Korean leader Kim Jong Un as he went to China to meet with Chinese President Xi Jinping and Russian President Vladimir Putin. Meanwhile, North Korean state media — which typically operates behind the global news cycle — has only released images of Kim visiting a ski resort and Mount Paektu, making no mention of possible Shenzhen travel plans. Kim has said he aims to arm the nation with an expansive nuclear force to counter the US and South Korea. In March, soon after the US and Israel launched strikes on Iran, Kim accused Washington of \"global terrorism and aggression.\"\nTopic 2: India: Online censorship grows after 'Cockroach' protests. Since anti-government Cockroach protests erupted, journalists and creators say their content is increasingly being restricted on social media in India.\nTopic 3: ICJ to rule on Rohingya genocide case against Myanmar: What to know. The ICJ is set to decide whether Myanmar's military operations in Rakhine State a decade ago were carried out with the intent to destroy the country's Rohingya minority, in whole or in part."}, {"station": "France24 フランス", "title": "Why Ukraine keeps trying to bring down Russia's bridge to Crimea", "videoId": "Ol6Yi0acR9M", "audioUrl": "audio/05_France24_フランス.mp3", "script": "France24 フランスの主要ニュースです。\nTopic 1: Why Ukraine keeps trying to bring down Russia's bridge to Crimea. A Ukrainian drone and missile strike on Monday night brought down a stretch of the bridge linking the annexed Crimean Peninsula to Russia, potentially crippling a route long used by Moscow to move men and materiel into Crimea and the southern front. Here’s why Kyiv keeps testing its strength against an infrastructure project that has become synonymous with Russian President Vladimir Putin’s 2014 seizure of the peninsula.\nTopic 2: Beijing has supported Moscow but 'China understands that America is way more important than Russia'. Following Xi Jinping's very friendly rare tarmac greeting for Donald Trump, Erin Ogunkeye is pleased to welcome Kerry Brown, Professor of Chinese Studies and Director of the Lau China Institute at King's College, London. Brown examines the complex relationship between the world's two largest economies, China's growing diplomatic influence and the competition over artificial intelligence.“China is the diplomatic center of the world,” says Brown, pointing to Beijing's ability to bring together leaders from Russia, the United States, Europe and elsewhere. He argues that China now has “extraordinary convening power\" and significant influence over Russia.\nTopic 3: French ex-PM Philippe pledges to slash spending, hike retirement age as Elysée bid falters. Former prime minister Édouard Philippe pledged on Wednesday to slash public spending, scrap France’s statutory 35-hour workweek and raise the retirement age to 65 from the current 62.9 years as he unveiled a slew of measures aimed a staving off economic \"catastrophe\" for France. An early frontrunner in next year's presidential election, Philippe is now trailing rivals in opinion polls and at risk of missing out on the second-round runoff."}, {"station": "KBS 韓国", "title": "Temperatures to Plunge as Cold Wave Hits on CSAT Day", "videoId": "APc5eRPIeJw", "audioUrl": "audio/07_KBS_韓国.mp3", "script": "KBS 韓国の主要ニュースです。\nTopic 1: Temperatures to Plunge as Cold Wave Hits on CSAT Day. Written: 2026-11-18 18:38:02 / Updated: 2026-11-18 18:39:00 Creative [4K] JISOO, ATEEZ, NCT DREAM, TWS, RESCENE, A2O SOUL, ILLIT, CHAERYEONG, UNCHILD | On the way to Music Bank 261113 2026-11-13 Wonder Hours with Hyerim NO CAP CONFESSIONS | Who Said Romance Is for Anniversaries Only? 2026-11-11 K-POP News November’s comeback lineup to warm up the winter chill! 2026-11-04 Copyright ⓒ KBS. All rights reserved. No copy, distribution or use of the content (AI learning included). This website is sponsored by the Korea Media and Communications Commission. The Web site is optimized for viewing in Chrome, Safari, Firefox and Internet Explorer 11 and higher versions. This website uses cookies and other technology to enhance quality of service. Continuous usage of the website will be considered as giving consent to the application of such technology and the policy of KBS. For further details >\nTopic 2: Lee Calls for Global Cooperation on Supply Chains, Critical Minerals. [Politics] :President Lee Jae Myung has called for international cooperation to identify supply chain risks early and ensure stable supplies of critical minerals and energy, citing growing geopolitical uncertainties.\n\nSpeaking at the APEC CEO Summit in Shenzhen, China on Wednesday, Lee said recent geopolitical and ...[more...]\nTopic 3: PPP Welcomes Choo's Acquittal, Vows Legal Action Against Special Counsel. [Politics] :Main opposition People Power Party(PPP) has welcomed a court's acquittal of former floor leader Choo Kyung-ho, who was indicted on charges of obstructing PPP lawmakers from voting to lift martial law on December 3, 2024, vowing to consider legal action against the special counsel. \n\nIn a Facebook ...[more...]"}, {"station": "CNA アジア", "title": "EU proposes 45-billion-euro Ukraine loan for 2027", "videoId": "lFrabyls514", "audioUrl": "audio/09_CNA_アジア.mp3", "script": "CNA アジアの主要ニュースです。\nTopic 1: EU proposes 45-billion-euro Ukraine loan for 2027. The loan would cover most of Ukraine's €70 billion funding gap, with EU leaders set to discuss the proposal at a summit next week. European Commission President Ursula von der Leyen speaks to the media about a proposed EU-backed loan for Ukraine, amid Russia's invasion of the country, in Brussels, Belgium, Nov 18, 2026. (Photo: REUTERS/Yves Herman) BRUSSELS: The European Union on Wednesday (Nov 18) proposed member states give Ukraine an extra 45-billion-euro (US$49 billion) loan to plug its 2027 budget shortfalls as Russia's invasion drags on. The funding would fill two-thirds of a 70-billion-euro black hole Kyiv faces next year - with Brussels looking to incentivise other Ukraine backers to do the rest. \"Five years since the start of this war of aggression, Europe stands united. We are as committed as ever to support Ukraine in war and in peace,\" European Commission chief Ursula von der Leyen said. \"We think this is the best way to give Ukraine a strong hand at the negotiation table, and Ukraine only needs to repay once Russia pays for the damage it has caused in Ukraine.\" EU leaders will discuss the loan at a Brussels summit next week in the hope of reaching a deal. Ukrainian President Volodymyr Zelenskyy voiced hope for a \"swift adoption\" of the proposal, posting on X that Kyiv was counting \"on the support of all EU member states\". The EU is currently paying out a 90-billion-loan to Ukraine that it hoped would see the country through to the end of next year. But Russia's intensified attacks have meant those funds would not be enough. The new loan would follow the same format as the current one and be borrowed against headroom in the EU's central budget. It would also be linked to Kyiv pressing on with reforms. While the aim is to forge agreement next week, the issue of the funding has now become wrapped up with broader fraught negotiations over the EU's next central budget. German Chancellor Friedrich Merz has insisted that all of the EU must settle the financing and all 27 member states must be involved before a deal can be reached on the budget. That has rankled several EU countries who want to be left out of backing the loan, such as Bulgaria, the Czech Republic, Hungary, and Slovakia. Last time round, Budapest, Bratislava and Prague managed to get themselves exempted from having to help cover the financing. Von der Leyen insisted the aim this time remains to get all countries on board. Beyond the bloc, Brussels is pushing other allies of Ukraine - such as Britain, Canada and Japan - to fill in the rest of Kyiv's needs next year. Similar pleas have previously fallen short. In a bid to incentivise them this time, Brussels says other nations could provide guarantees to help bolster the loan or use the interest on frozen Russian assets in the EU to cover their own financing. The proposal for a new loan means that the EU for now will not try to look into directly tapping over 200 billi"}, {"station": "ABC 豪州", "title": "Live: ASX to open lower as Wall Street braces for Anthropic IPO", "videoId": "oKyCsiHakYY", "audioUrl": "audio/10_ABC_豪州.mp3", "script": "ABC 豪州の主要ニュースです。\nTopic 1: Live: ASX to open lower as Wall Street braces for Anthropic IPO. The Australian share market is set to open lower as Wall Street prepares for AI giant Anthropic's launch on the Nasdaq stock exchange. Meanwhile, the price of oil continues to trade lower, under $US92 a barrel. Follow the day's financial news and insights from our specialist business reporters on our live blog. Disclaimer: this blog is not intended as investment advice. Choose what information you see below by using filters Business reporter Adelaide Miller here to guide you through the morning on the markets blog, where we cover the latest business, finance and economics news from across the globe. And we are just moments away from the widely anticipated Anthropic IPO so will keep you updated as it happens. Back home, however, the ASX 200 is set to open lower, with Futures pointing down 0.6% to 8,809 points. Go grab yourself a coffee and see you back here for markets news soon! Your home of Australian stories, conversations and events that shape our nation. This service may include material from Agence France-Presse (AFP), APTN, Reuters, AAP, CNN and the BBC World Service which is copyright and cannot be reproduced. Get the latest ABC News delivered to your email inbox\nTopic 2: Factory-built housing could lift construction productivity, report says. A new report from the Committee for Sydney think tank says housing construction productivity has gone backwards by 20 per cent since 2013.\nTopic 3: Bird backpacks and fresh poo used to track deadly H5 spread. A CSIRO program, which aims to better understand the H5 bird flu's impact, is using backpacks and bird poo to monitor the spread of the deadly virus in Australia's Murray Darling Basin."}];
  document.getElementById("page-title").textContent = "🌍 世界の朝刊 NHK風同時通訳プレイヤー (2026年11月19日)";

  let player = null;
  let currentIndex = 0;
  const audioEl = document.getElementById("ja-audio");
  const playlistEl = document.getElementById("playlist");

  newsItems.forEach((item, idx) => {
    const li = document.createElement("li");
    li.id = "item-" + idx;
    li.innerHTML = `<div><div class="station">${item.station}</div><div class="title">${item.title}</div></div><button>▶ 同時再生</button>`;
    li.onclick = () => playIndex(idx);
    playlistEl.appendChild(li);
  });

  function onYouTubeIframeAPIReady() {
    if (newsItems.length === 0) return;
    player = new YT.Player("yt-player", {
      videoId: newsItems[0].videoId,
      playerVars: { playsinline: 1, rel: 0 },
      events: {
        onReady: () => {
          player.setVolume(document.getElementById("orig-vol").value);
        }
      }
    });
  }

  function playIndex(idx) {
    if (idx < 0 || idx >= newsItems.length) return;
    currentIndex = idx;
    const item = newsItems[idx];

    document.querySelectorAll(".playlist li").forEach(el => el.classList.remove("active"));
    document.getElementById("item-" + idx).classList.add("active");
    document.getElementById("now-playing").textContent = "放送中: " + item.station + " - " + item.title;
    document.getElementById("script-box").textContent = item.script;

    if (player && player.loadVideoById) {
      player.loadVideoById({ videoId: item.videoId, startSeconds: 0 });
      player.setVolume(document.getElementById("orig-vol").value);
      player.playVideo();
    }
    audioEl.src = item.audioUrl + "?t=" + Date.now();
    audioEl.currentTime = 0;
    audioEl.play();
  }

  function pauseBoth() {
    if (player && player.pauseVideo) player.pauseVideo();
    audioEl.pause();
  }

  function nextTrack() {
    if (currentIndex + 1 < newsItems.length) {
      playIndex(currentIndex + 1);
    } else {
      pauseBoth();
      document.getElementById("now-playing").textContent = "本日の全ニュースの放送が終了しました。";
    }
  }

  function changeOrigVol(val) {
    if (player && player.setVolume) player.setVolume(val);
  }

  audioEl.addEventListener("ended", () => {
    nextTrack();
  });
</script>
