  const newsItems = [{"station": "BBC 英国", "title": "Spanish PM and rivals rally supporters in final pitch for votes", "videoId": "bgONnPA8QU8", "audioUrl": "audio/01_BBC_英国.mp3", "script": "BBC 英国の主要ニュースです。\nTopic 1: Spanish PM and rivals rally supporters in final pitch for votes. Pedro SÃ¡nchez accused his opponents of hurling insults and lies but his conservative rival has promised a new era of politics Spain's main party leaders have held their final rallies ahead of Sunday's election, with Socialist Prime Minister Pedro SÃ¡nchez saying he is confident of defying the polls. \"I cannot imagine us losing,\" he said, posing for selfies with supporters in red T-shirts and accusing conservative rival Alberto NÃºÃ±ez FeijÃ³o of planning a coalition with the far right. FeijÃ³o's People's Party (PP) is narrowly ahead in the polls, and in the final hours of the campaign he travelled first to Barcelona and then Seville, promising voters a new political era of \"truth, decency and good governance\". He accused SÃ¡nchez of evading questions on key issues like corruption, rail disasters, immigration and the national debt. The Socialist leader heads one of Europe's few left-wing governments, and with the French presidential elections five months away, there is a real chance that two of the continent's biggest economies could move to the right in quick succession. Almost 39 million people have a vote in Spain and while commentators expect a high turnout, most polls have suggested a close finish. Under Spanish electoral law, no polls have been published since Monday. \"This time, yes, we're going to do it,\" FeijÃ³o told PP supporters, in a nod to his failure to form a government three years ago despite winning most seats. Alberto NÃºÃ±ez FeijÃ³o's PP holds a narrow lead in the opinion polls If he gets to form a government this time, it will be with the support of anti-immigration party Vox, led by Santiago Abascal, whose final rally took place in a bull-ring in Valencia on Spain's east coast. Pedro SÃ¡nchez's government \"has betrayed us, he has robbed us and he has lied to us\", Abascal told an audience earlier in TarancÃ³n, to the south-east of Madrid. Vox is hoping to almost double its seats from the 33 it won three years ago. It backs policies such as \"national priority\" - putting Spanish citizens first for welfare - and \"remigration\" for foreigners not considered to be contributing to the economy.\nTopic 2: Zelensky criticises 'strange' Trump-Putin friendship in BBC interview. Ukraine's president voices frustration with US and says it is not pushing Russia hard enough in peace talks to end the war.\nTopic 3: Weary of war but with no sign of backing down, Kyiv faces another punishing winter. Ukraine settles in for another devastating winter as the questions persists: how will it all end?"}, {"station": "ABC 米国", "title": "UN rapporteur Albanese in limbo at airport after being denied entry to Costa Rica", "videoId": "2ACxeAbLsFk", "audioUrl": "audio/02_ABC_米国.mp3", "script": "ABC 米国の主要ニュースです。\nTopic 1: UN rapporteur Albanese in limbo at airport after being denied entry to Costa Rica. Francesca Albanese, the U.N. special rapporteur on human rights in the occupied Palestinian territories, is stranded at Costa Rica’s main airport awaiting for a court to decide whether she could enter the country after immigration authorities blocked h... SAN JOSÉ, Costa Rica -- Francesca Albanese , the U.N. special rapporteur on human rights in the Palestinian territories, was stranded in an airport terminal on Friday after being denied entry to Costa Rica . Albanese posted a photo on X showing a suitcase beside a row of empty seats, with the caption: “This is where I will spend my first night in Costa Rica.” She is awaiting a court decision on whether she can enter the country or must leave. Costa Rican immigration authorities blocked her entry on Thursday, saying she was the subject of an international “alert” over alleged ties to terrorism and that her presence posed a national security risk. Albanese is a high-profile independent investigator scrutinizing human rights abuses in the Palestinian territories. She is among a group of experts appointed by the 47-member U.N. Human Rights Council in Geneva to monitor and report on human rights conditions in individual countries and the observance of specific rights worldwide. She was sanctioned by the United States in July 2025 over her work and sharp criticism of U.S. and Israeli policies during the war in Gaza. Secretary of State Marco Rubio described her actions as a “campaign of political and economic warfare against the United States and Israel.” Albanese had traveled to Costa Rica at the invitation of the University of Costa Rica, which was scheduled to award her an honorary doctorate. After she was denied entry, a habeas corpus petition was filed on her behalf with the Supreme Court’s Constitutional Chamber. The court issued an interim order allowing her to remain in the country and gave immigration authorities 24 hours to explain why they had denied her entry. While the petition is pending, Albanese remains in a room at the airport. From there, she joined the university’s honorary doctorate ceremony by video call. One of her assistants, who was allowed into the country, accepted the degree on her behalf. In her speech, Albanese said the decision to deny her entry could be related to the sanctions. “I am deeply outraged that the Costa Rican government has spread false information linking me to terrorism. Defending human rights is not terrorism, and the government will answer for these insinuations, as it should in a country governed by the rule of law,” Albanese said.\nTopic 2: Mexico files formal complaint to US over DEA tip line. Mexican President Claudia Sheinbaum says the country is filing a formal complaint with the U.S. over a Drug Enforcement Agency tip line for anonymous reports about criminals and corrupt Mexican officials\nTopic 3: Canada’s Supreme Court largely upholds Quebec ban on religious"}, {"station": "AlJazeera 中東", "title": "UN Gaza rapporteur Francesca Albanese denied entry into Costa Rica", "videoId": "AQDGPLkkUb0", "audioUrl": "audio/03_AlJazeera_中東.mp3", "script": "AlJazeera 中東の主要ニュースです。\nTopic 1: UN Gaza rapporteur Francesca Albanese denied entry into Costa Rica. UN Gaza rapporteur Francesca Albanese denied entry into Costa Rica Costa Rica has barred UN special rapporteur Francesca Albanese, citing unfounded ‘links to terrorist acts’. Albanese, who has documented Israel’s genocide in Gaza and faces US sanctions, accepted an honorary degree from University of Costa Rica remotely, from the airport.\nTopic 2: Is Iraq facing renewed instability?. PM asserts state control over resources in semi-autonomous Kurdish region\nTopic 3: Israel kills four in Gaza as Hamas chief al-Hayya’s son survives strike. Four of Khalil al-Hayya's other sons were previously killed by Israeli forces, according to the Palestinian group."}, {"station": "DW ドイツ", "title": "Divisions deepen between EU member states after tense budget summit", "videoId": "b83cgLvoZwQ", "audioUrl": "audio/04_DW_ドイツ.mp3", "script": "DW ドイツの主要ニュースです。\nTopic 1: Divisions deepen between EU member states after tense budget summit. An EU leaders summit on the bloc's seven-year budget fell apart amid divisions over how to fund Ukraine. The budget proposal also includes a 3% tax on US tech companies, in a bid for the EU to generate additional funds. EU leaders arrived in Brussels braced for a difficult showdown over the bloc's multitrillion-euro seven-year budget. But few expected the summit to unravel so quickly, with talks breaking down late on Thursday night. Squabbles and thinly veiled public barbs meant they left without a deal and didn't even attempt to resume discussions on the planned second day. There is a self-imposed deadline to find agreement before the end of 2026 on the budget which covers the 2028-2034 period. But experts say there is no cause for alarm, yet. \"Every time there are long-term EU budget negotiations, there are breakdowns, chaos, recrimination and a lot of political theater and drama,\" said Jacob Funk Kirkegaard, an EU economist and expert at the Bruegel think tank in Brussels. The center of that political theater this time was the prime ministers of Denmark, Sweden, Belgium and Austria — countries wanting a reduced budget — who staged a walkout during smaller, group meetings, claiming the atmosphere had not been constructive to getting a deal. Hungarian Prime Minister Peter Magyar called the whole summit \"completely unnecessary,\" pointing the blame at the man who had decided to call it and whose job it is to meditate the talks, European Council President Antonio Costa. Costa was diplomatic in defending his decision to bring the leaders to Brussels, telling the press: \"For me it was very useful to figure out the parameters of a possible landing zone in December.\" Long before the summit started, Germany had laid down an ultimatum — Berlin would only sign off on the budget if all the other EU countries greenlit an additional €45 billion ($49 billion) support loan for Ukraine to fund the country in its war efforts through 2027. Hungary, Czechia, Bulgaria and Slovakia have dug their heels in against the proposal, insisting that giving Ukraine money to buy weapons will prolong the war. Slovak Prime Minister Robert Fico even accused Germany of \"blackmail.\" To view this video please enable JavaScript, and consider upgrading to a web browser that supports HTML5 video As Europe's biggest economy, Germany's contribution amounts to around 25% of the whole budget.\nTopic 2: Dutch authorities seize 26 critically endangered turtles from luggage of passenger bound for Hong Kong. The tiny Vallarta mud turtle was only discovered in 2018. It's critically endangered with around 300 thought to live in the wild. Almost one tenth of that number were stashed in a traveler's luggage, bound in duct tape.\nTopic 3: Airline Norse Atlantic files for bankruptcy, succumbing to aviation fuel costs. The low-cost airline was only founded a few years ago and had been struggling to turn a profit. The spike i"}, {"station": "France24 フランス", "title": "The AI revolution: Will I lose my job?", "videoId": "-_9pMb4G7tY", "audioUrl": "audio/05_France24_フランス.mp3", "script": "France24 フランスの主要ニュースです。\nTopic 1: The AI revolution: Will I lose my job?. Have you heard of FOBO? It stands for fear of being obsolete. So as AI spreads, is it going to impact women in the workforce more than men? And are we right to be fearful of becoming obsolete? The International Labour Organization has already found occupations dominated by women are nearly twice as likely to be exposed to job losses thanks to generative AI, compared to those dominated by men.\nTopic 2: Is Spain 'nostalgic' for Franco? Would traditional right PP consider an alliance with far-right Vox?. After eight years of socialist-led government, Spain is at a crossroads. Can Pedro Sánchez pull off another electoral comeback, or will the conservative Partido Popular make way for the far right into national government for the first time since the end of Franco's 40-year brutal reign? Just back from Madrid, Richard Werly, Europe correspondent for the Swiss daily Blick, joins Angela Diffley to examine the final days of campaigning and the generational divisions shaping Sunday’s snap elections. The youth are divided between the left and the far-right Vox party. Sánchez, nicknamed the “Teflon politician”, has campaigned heavily on housing and social issues. “We may see an outgoing prime minister performing better than expected,” says Werly.\nTopic 3: 'From bad to catastrophic: Iran's justice system was already unfair for many decades'. Amid war with the US and Israel, Iranian protesters continue to face death sentences following what Amnesty International describes as grossly unfair, torture-tainted trials. “The situation has changed from bad to catastrophic,” says Raha Bahreini, Iranian-Canadian human rights lawyer and Amnesty International's researcher on Iran. Bahreini discusses the aftermath of the January 2026 protests, the authorities' efforts to equate peaceful dissent with treason and espionage, and the extrajudicial killings of peaceful protesters. Amnesty International is calling for an international criminal justice mechanism, potentially a special tribunal. “There needs to be criminal accountability for these crimes against humanity.”"}, {"station": "KBS 韓国", "title": "Smart Glasses Detection Technology Nears Commercialization Phase", "videoId": "Au2vyVFMmXE", "audioUrl": "audio/07_KBS_韓国.mp3", "script": "KBS 韓国の主要ニュースです。\nTopic 1: Smart Glasses Detection Technology Nears Commercialization Phase. Written: 2026-11-27 16:50:02 / Updated: 2026-11-27 16:58:57 Creative [4K] NCT DREAM, A2O SOUL, CHAERYEONG, Kei, BESTie, KEYVITUP, H1-KEY, UNCHILD, Baby DONT Cry | On the way to Music Bank 261120 2026-11-20 Wonder Hours with Hyerim NO CAP CONFESSIONS | Too Shy for a Compliment? Just Say Thank You!! 2026-11-18 K-POP News November’s comeback lineup to warm up the winter chill! 2026-11-04 Copyright ⓒ KBS. All rights reserved. No copy, distribution or use of the content (AI learning included). This website is sponsored by the Korea Media and Communications Commission. The Web site is optimized for viewing in Chrome, Safari, Firefox and Internet Explorer 11 and higher versions. This website uses cookies and other technology to enhance quality of service. Continuous usage of the website will be considered as giving consent to the application of such technology and the policy of KBS. For further details >\nTopic 2: Ban on Ads Featuring AI-Generated Fake Doctors and Experts Begins Friday. [Politics] :Advertisements featuring AI-generated fake doctors or experts endorsing food, medicines, cosmetics and other products are banned starting Friday.\n\nThe Ministry of Food and Drug Safety revised enforcement rules under several laws, including the Act on Labeling and Advertising of Foods, the Pharmaceutical ...[more...]\nTopic 3: Parliamentary Committee Adopts Hearing Report on Justice Minister Nominee. [Politics] :The National Assembly has adopted its report on the confirmation hearing for Justice Minister nominee Lee Yong-cheol.\n\nThe National Assembly’s Legislation and Judiciary Committee finalized the report during a meeting on Friday, with ruling bloc lawmakers leading the move. \n\nCommittee members from the main ...[more...]"}, {"station": "CNA アジア", "title": "Parts of the US clean up, power outages being restored after Thanksgiving storm soaks East Coast", "videoId": "8WvAYmMKjQg", "audioUrl": "audio/09_CNA_アジア.mp3", "script": "CNA アジアの主要ニュースです。\nTopic 1: Parts of the US clean up, power outages being restored after Thanksgiving storm soaks East Coast. About 480,000 homes and businesses remained without power on Friday (Nov 27), down from 900,000 on Thursday. Pedestrians shield themselves with umbrellas as they walk in the rain on Thanksgiving Day in New York, Thursday, Nov 26, 2026. (Photo: AP/Yuki Iwamura) NEW YORK: Heavy rain over flooded East Coast communities was winding down Friday (Nov 27) and power was slowly being restored to hundreds of thousands of customers as some high-tide flooding threats remained following a round of holiday storms . The storms snarled travel, downed trees and power lines and led to water rescues from New York to Virginia. In New York City, meanwhile, preparations were underway for Macy’s Thanksgiving Day parade on Saturday after an unprecedented postponement due to weather. Elsewhere, wet snow was falling as far south as the Tennessee Valley and freezing rain was moving across northern New England. Cold rain was over the Midwest, Ohio Valley and Lower Great Lakes. Another storm system in the Northwest was bringing rain along coastal Oregon on Friday. More snow was forecast in the Cascade Range and in mountain passes in Montana and Wyoming. CNA Games Guess Word Crack the word, one row at a time Buzzword Create words using the given letters Mini Sudoku Tiny puzzle, mighty brain teaser Mini Crossword Small grid, big challenge Word Search Spot as many words as you can Show More Show Less Conditions were expected to improve in the entire eastern US on Friday, “but this huge system will take some time to weaken,” the National Weather Service said on its website. Blustery winds of 25 to 35 mph (40 to 56 kph) with higher wind gusts will be common across the East, it said. Coastal flood warnings were in effect through Friday from New Jersey to Virginia. More than 480,000 homes and businesses had no electricity Friday, led by Pennsylvania and New Jersey, down from a high of more than 900,000 on Thursday, according to poweroutage.us. More than 1,100 flights were delayed and at least 116 were cancelled by Friday morning, according to flight tracking service FlightAware. In Maryland, nearly 2 million water customers in Montgomery and Prince George’s counties were told they could resume normal water use Friday after being urged to conserve during the storm. Building roofs in Ocean City and Rockville collapsed. In Norfolk, Virginia, crews rescued 39 people and two dogs, City Councilman Tommy Smigiel posted.\nTopic 2: Kenyan starvation cult leader guilty of manslaughter for 123 deaths in latest conviction. The conviction adds to Paul Mackenzie’s existing 200-year prison sentence for the murder of nearly 200 children.\nTopic 3: Zelenskyy urges the US to pressure Putin, calling Trump’s 'my friend' remark strange. The Ukrainian president’s comments come amid tensions over delayed Patriot missile deliveries, Starlink disruptions and EU leaders’ failure to agree on a US$49 billi"}, {"station": "ABC 豪州", "title": "Coastal village clings to remote charms amid surging popularity", "videoId": "nL1MUpTlB5k", "audioUrl": "audio/10_ABC_豪州.mp3", "script": "ABC 豪州の主要ニュースです。\nTopic 1: Coastal village clings to remote charms amid surging popularity. Seal Rocks is known for its unspoilt beaches and natural beauty. ( ABC News: Emma Siossian ) For generations of families and surfers, a visit to Seal Rocks has included a stop at its much-loved general store, an enduring landmark in the remote coastal village. The shop is on the only road into the town on the NSW Mid North Coast, perched at the top of a hill overlooking a crescent-shaped beach, fringed by bushland. Owned by the Horgan family for more than 70 years, it is reminiscent of a different era captured in the faded photos that cover the walls. An old telephone exchange box remains inside, while outside there's a working public phone booth — a necessity rather than a novelty in a town where mobile reception remains notoriously unreliable. The Seal Rocks store has remained largely unchanged for decades and is a familiar landmark. ( ABC News: Emma Siossian ) Kylie Galea is helping run the store at Seal Rocks, which has changed little over the decades. ( ABC News: Emma Siossian ) Kylie Galea helps run the store and post office. \"Just about every day there's someone who comes in that says, 'I used to come here when I was a kid, I remember this store'. \"It hasn't really changed much at all in appearance and the way it's run either… and I think a lot of people love that.\" The Seal Rocks shop in 2015. ( Supplied: Ray Heath ) Remnants of an old telephone exchange remain behind the counter of the Seal Rocks store. ( ABC News: Emma Siossian )\nTopic 2: Tight-knit community helps ease pain of bushfires on Flinders Island. Bushfires have been raging across the northern part of remote Flinders Island this week. It's been a tough time for locals, but they've come together to ease the burden.\nTopic 3: Live: Polls open soon in Victoria as voters prepare to decide next government. Victorians head to the polls today to decide who will lead Australia's second most populous state for the next four years. Follow live."}];
  document.getElementById("page-title").textContent = "🌍 世界の朝刊 NHK風同時通訳プレイヤー (2026年11月28日)";

  let player = null;
  let currentIndex = 0;
  const audioEl = document.getElementById("ja-audio");
  const playlistEl = document.getElementById("playlist");

  newsItems.forEach((item, idx) => {
    const li = document.createElement("li");
    li.id = "item-" + idx;
    li.innerHTML = `<div><div class="station">${item.station}</div><div class="title">${item.title}</div></div><button>▶ 同時再生</button>`;
    li.onclick = () => playIndex(idx);
    playlistEl.appendChild(li);
  });

  function onYouTubeIframeAPIReady() {
    if (newsItems.length === 0) return;
    player = new YT.Player("yt-player", {
      videoId: newsItems[0].videoId,
      playerVars: { playsinline: 1, rel: 0 },
      events: {
        onReady: () => {
          player.setVolume(document.getElementById("orig-vol").value);
        }
      }
    });
  }

  function playIndex(idx) {
    if (idx < 0 || idx >= newsItems.length) return;
    currentIndex = idx;
    const item = newsItems[idx];

    document.querySelectorAll(".playlist li").forEach(el => el.classList.remove("active"));
    document.getElementById("item-" + idx).classList.add("active");
    document.getElementById("now-playing").textContent = "放送中: " + item.station + " - " + item.title;
    document.getElementById("script-box").textContent = item.script;

    if (player && player.loadVideoById) {
      player.loadVideoById({ videoId: item.videoId, startSeconds: 0 });
      player.setVolume(document.getElementById("orig-vol").value);
      player.playVideo();
    }
    audioEl.src = item.audioUrl + "?t=" + Date.now();
    audioEl.currentTime = 0;
    audioEl.play();
  }

  function pauseBoth() {
    if (player && player.pauseVideo) player.pauseVideo();
    audioEl.pause();
  }

  function nextTrack() {
    if (currentIndex + 1 < newsItems.length) {
      playIndex(currentIndex + 1);
    } else {
      pauseBoth();
      document.getElementById("now-playing").textContent = "本日の全ニュースの放送が終了しました。";
    }
  }

  function changeOrigVol(val) {
    if (player && player.setVolume) player.setVolume(val);
  }

  audioEl.addEventListener("ended", () => {
    nextTrack();
  });
</script>
