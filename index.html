ected leaks of confidential information to Le Pen’s far-right party. French authorities are investigating whether a former Interior Ministry official leaked confidential information to Marine Le Pen's far-right National Rally\nTopic 3: Russian missile crash in Poland likely an intentional provocation, Polish leader says. Russian missile crash in Poland likely an intentional provocation as European militaries hold drills, Polish leader says"}, {"station": "AlJazeera 中東", "title": "Israeli drone attacks kill seven Palestinians in central Gaza", "videoId": "lhx6IqrzUFs", "audioUrl": "audio/03_AlJazeera_中東.mp3", "script": "AlJazeera 中東の主要ニュースです。\nTopic 1: Israeli drone attacks kill seven Palestinians in central Gaza. Buzzing of drones causes ‘fear and panic’ among Palestinians as Israel continues attacks on the Strip despite ‘ceasefire’. Israeli attacks have killed at least seven Palestinians and wounded others in the central part of the Gaza Strip, as attacks continue despite a “ceasefire” agreement. Four Palestinians were killed on Friday when an Israeli drone struck the Bureij refugee camp in Deir el-Balah, medical sources told Al Jazeera. Witnesses said the drone targeted a group of civilians within the camp. Separately, a medical source at al-Awda Hospital reported the arrival of the body of a Palestinian killed by an Israeli drone strike in the Nuseirat refugee camp. Two Palestinians were also killed when an Israeli drone struck civilians near the entrance to the city of Deir el-Balah. Al Jazeera’s Hani Mahmoud, reporting from Deir el-Balah, said the injured were brought to hospitals in central Gaza that operate at reduced capacity due to a lack of medical supplies and staff. Mahmoud added that drones were “causing fear and panic” among Palestinians in Gaza. “People cannot run simple errands because of the ongoing fear of being attacked and killed on the road,” he said. The buzzing of drones adds to the sound of explosions from home demolitions and to that of fighter jets, our correspondent added. The Israeli army on Friday carried out demolition operations near areas under its control in the al-Shuja’iya neighbourhood in the eastern part of Gaza City using explosive-laden drones. It also carried out three large-scale demolitions near the “Yellow Line”, east of Khan Younis in southern Gaza.\nTopic 2: Nepali cricket fans in Qatar want to see their team competing with the best. As thousands from Qatar's Nepali community watch their team play, they hope that the team will rise in global rankings.\nTopic 3: Palestinian anti-Hamas groups accused of role in Israel Gaza operation. Israeli-backed Palestinian militias accused of expanding operations, raising concerns over their role in Gaza’s security"}, {"station": "DW ドイツ", "title": "Is Pakistan backing anti-Taliban groups in Afghanistan?", "videoId": "yn_LtwTWO1Q", "audioUrl": "audio/04_DW_ドイツ.mp3", "script": "DW ドイツの主要ニュースです。\nTopic 1: Is Pakistan backing anti-Taliban groups in Afghanistan?. The Taliban rulers in Afghanistan have accused Pakistan of aiding and sheltering armed resistance groups. The allegations come amid heightened tensions and are likely to deepen the rift between the two neighbors. The Taliban authorities in Afghanistan claim that the Pakistani government is supporting armed Afghan groups that are opposed to their rule, an accusation Islamabaddenies. Taliban Foreign Minister Amir Khan Muttaqi recently alleged that Pakistan had launched a \"project to destabilize Afghanistan.\" He claimed that \"thousands of armed individuals have gathered along the Durand Line [Afghanistan-Pakistan border] to undermine the stability achieved in Afghanistan.\" The accusations come after months of border clashes between Afghan Taliban and Pakistani forces. In July, the Afghanistan Freedom Front (AFF), an anti-Taliban group, reportedly clashed with Taliban forces in the Zebak district of Badakhshan, a northeastern Afghan province. The group said it also carried out attacks in Nooristan and Kunar provinces in October. Another \"resistance group,\" the United Front of Afghanistan, claimed it attacked Taliban forces in Kandahar province along the border with Pakistan. \"The people who created insecurity in Badakhshan crossed from Chitral [in Pakistan] and later fled back to Chitral. They had been brought in. Even Pakistani military personnel were with them,\" alleged Zabihullah Mujahid, the Taliban's main spokesperson, in an interview with DW's Pashto-Dari service in September. Pakistan's Ministry of Information swiftly dismissed the allegations as propaganda. Groups that oppose Taliban rule in Afghanistan say they are not supported by any external force, and their resistance is purely indigenous. To view this video please enable JavaScript, and consider upgrading to a web browser that supports HTML5 video More than five years since returning to power in Kabul, the Taliban have consolidated their control over Afghanistan and largely suppressed both armed resistance groups and political dissidents.\nTopic 2: EU and UK strike 'landmark deal' to strengthen ties after Brexit. The European Union and the United Kingdom have agreed on \"landmark\" deals on youth mobility and trade. Leaders on both sides praised the agreement as they seek to rebuild ties.\nTopic 3: Turkey takes control of opposition broadcaster Sozcu TV. In the latest in a series of raids and arrests, another major pro-opposition Turkish broadcaster has been brought under state control. This is the third in a year."}, {"station": "France24 フランス", "title": "🦛 USA: Fiona, Cincinnati Zoo’s famous hippo, has died", "videoId": "WNJqZfRBcD4", "audioUrl": "audio/05_France24_フランス.mp3", "script": "France24 フランスの主要ニュースです。\nTopic 1: 🦛 USA: Fiona, Cincinnati Zoo’s famous hippo, has died. 🦛Fiona, Cincinnati Zoo’s beloved hippo, has died aged just 9, after swallowing a knitted hat that fell into her enclosure. Born prematurely and weighing only 13kg, she captured millions of hearts around the world eyen called it a \"turning point\" in relations. Wrapped up in Brussels were three main agreements: a deal cutting red tape for food exports, another linking the two sides' emissions-trading schemes and a third on a \"youth experience scheme\". Burnham argued the accords - initiated by his predecessor, Keir Starmer - will unpick some of the damage inflicted by the \"hard Brexit we ended up with\" and provide a US$22-billion boost to the British economy. British firms will export to Europe more easily again and 100,000 under-30s from each side will be allowed to reside for up to three years in the other's territory for work, study or travel. But while the optics at the meeting may have been much improved, old habits die hard. Brussels and London wrangled ferociously down to the wire over the details of the deals. One sticking point was on pinning London down to a future agreement on cutting fees for EU students at UK universities to the level paid by their British counterparts. Burnham insisted that the \"deal is done\", even if talks would continue on tuition fees over the next six months. But a statement from EU countries seen by AFP said they would hold off implementation until there was an agreement over the fees. Since taking power this summer, Burnham has smashed through the taboos in Britain's toxic debate over relations with Europe - going as far as to float rejoining the bloc one day. European Council boss Costa told Burnham the EU was open to having the \"closest possible relationship\". But the summit focused on smaller steps, and the prime minister kicked the can on what could come next. Having previously said he would lik"}, {"station": "ABC 豪州", "title": "How a dodgy visa scheme put the premier's secret partner behind bars", "videoId": "UPSD2hQdGiA", "audioUrl": "audio/10_ABC_豪州.mp3", "script": "ABC 豪州の主要ニュースです。\nTopic 1: How a dodgy visa scheme put the premier's secret partner behind bars. Daryl Maguire has been jailed more than a decade after he was involved in a cash-for-visa scheme. ( AAP: Bianca De Marchi ) Daryl Maguire became a household name when his secret relationship with then-New South Wales premier Gladys Berejiklian was exposed at a corruption inquiry in 2020. But it was his part in a fraudulent visa scheme years earlier that has landed him in prison. Yesterday, the former Wagga Wagga MP was sentenced to three years' jail , with a non-parole period of one year, for conspiring to create false visa applications for Chinese nationals between 2013 and 2015 while he was in parliament. Daryl Maguire will be eligible for parole in 2027. ( AAP: Dean Lewins ) It is not the first time he has been led from court in handcuffs. Last year, he was sentenced to 10 months for misleading the Independent Commission Against Corruption (ICAC), but released on bail within the hour, with that conviction later overturned on appeal. Here is how the politician who once had a private line to the state's most powerful person ended up behind bars. Maguire entered NSW parliament in 1999 after winning Wagga Wagga, extending the Liberal Party's hold on a seat it had held since 1957. He became Opposition whip in 2003 and Government whip after the Coalition won the 2011 election. Daryl Maguire in Wagga Wagga in 2015, as the local MP. ( ABC Riverina: Melinda Hayter ) Behind the scenes, he had a business interest he never declared.\nTopic 2: Trump vows 'tremendous tax' on companies building data centres abroad. US President Donald Trump says he is \"not allowing data centres to go into other countries\", so that America can win the AI fight against China.\nTopic 3: Blackout prompts questions over ElectraNet's recent $300m network upgrade. The blackout that left nearly 24,000 Eyre Peninsula properties in the dark comes only three years after ElectraNet finished a $300 million upgrade that promised more reliable power to the region."}];
  document.getElementById("page-title").textContent = "🌍 世界の朝刊 NHK風同時通訳プレイヤー (2026年11月21日)";

  let player = null;
  let currentIndex = 0;
  const audioEl = document.getElementById("ja-audio");
  const playlistEl = document.getElementById("playlist");

  newsItems.forEach((item, idx) => {
    const li = document.createElement("li");
    li.id = "item-" + idx;
    li.innerHTML = `<div><div class="station">${item.station}</div><div class="title">${item.title}</div></div><button>▶ 同時再生</button>`;
    li.onclick = () => playIndex(idx);
    playlistEl.appendChild(li);
  });

  function onYouTubeIframeAPIReady() {
    if (newsItems.length === 0) return;
    player = new YT.Player("yt-player", {
      videoId: newsItems[0].videoId,
      playerVars: { playsinline: 1, rel: 0 },
      events: {
        onReady: () => {
          player.setVolume(document.getElementById("orig-vol").value);
        }
      }
    });
  }

  function playIndex(idx) {
    if (idx < 0 || idx >= newsItems.length) return;
    currentIndex = idx;
    const item = newsItems[idx];

    document.querySelectorAll(".playlist li").forEach(el => el.classList.remove("active"));
    document.getElementById("item-" + idx).classList.add("active");
    document.getElementById("now-playing").textContent = "放送中: " + item.station + " - " + item.title;
    document.getElementById("script-box").textContent = item.script;

    if (player && player.loadVideoById) {
      player.loadVideoById({ videoId: item.videoId, startSeconds: 0 });
      player.setVolume(document.getElementById("orig-vol").value);
      player.playVideo();
    }
    audioEl.src = item.audioUrl + "?t=" + Date.now();
    audioEl.currentTime = 0;
    audioEl.play();
  }

  function pauseBoth() {
    if (player && player.pauseVideo) player.pauseVideo();
    audioEl.pause();
  }

  function nextTrack() {
    if (currentIndex + 1 < newsItems.length) {
      playIndex(currentIndex + 1);
    } else {
      pauseBoth();
      document.getElementById("now-playing").textContent = "本日の全ニュースの放送が終了しました。";
    }
  }

  function changeOrigVol(val) {
    if (player && player.setVolume) player.setVolume(val);
  }

  audioEl.addEventListener("ended", () => {
    nextTrack();
  });
</script>
