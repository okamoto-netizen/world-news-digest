mpting a mass exodus of Rohingya. Refugees recounted entire villages being burned down and the mass killing of civilians, while numerous survivors and eyewitnesses provided testimony that the Myanmar military had also raped and abused Rohingya women and girls.\nTopic 2: Trump, Putin and Xi release 'peace declaration' after historic meeting. While the presidents have previously met for one-on-one meetings, this is their first trilateral discussion.\nTopic 3: Europe ready for talks with Russia on ending war in Ukraine, leaders say. European allies of Ukraine say they have a \"united\" negotiating position at a summit in Berlin."}, {"station": "ABC 米国", "title": "El Salvador's president confirms and celebrates attack on home of key Haitian gang leader", "videoId": "Ucaj4MAOwak", "audioUrl": "audio/02_ABC_米国.mp3", "script": "ABC 米国の主要ニュースです。\nTopic 1: El Salvador's president confirms and celebrates attack on home of key Haitian gang leader. El Salvador’s president says that his troops have demolished the lavish home of a prominent gang leader in Haiti known as Jeff SAN JUAN, Puerto Rico -- El Salvador’s president, Nayib Bukele , said Wednesday that his troops demolished the lavish home of a prominent gang leader in Haiti known as Jeff. It wasn’t immediately clear if he was killed. Bukele posted a video on X that depicts an old video of Jeff posing in front of his mansion in the Caribbean country and then cuts to Salvadoran helicopters flying toward it as they fire shot after shot, with big plumes of smoke rising from Jeff’s home. “My gift to the Haitian people on the anniversary of the Battle of Vertières,” Bukele wrote. The 1803 battle was critical in helping secure Haiti's independence from France and transforming it into the world's first Black republic. It wasn’t immediately known if Haiti’s police and army were involved. A U.N.-backed gang suppression force said that it wasn’t involved. Jeff is considered one of Haiti's most powerful gang leaders. His real name is Hegseth hails US ties with Colombia’s de la Espriella. The US defence secretary praised security cooperation with Colombia as country joins Americas Counter Cartel Coalition.\nTopic 3: European leaders unite in Berlin to reaffirm support for Ukraine. German chancellor warns peace talks without Europe's involvement are doomed to fail, urging unity with Ukraine."}, {"station": "DW ドイツ", "title": "Iraq's risky standoff: The state vs. Iran-allied militias", "videoId": "J6QwNrmaRjc", "audioUrl": "audio/04_DW_ドイツ.mp3", "script": "DW ドイツの主要ニュースです。\nTopic 1: Iraq's risky standoff: The state vs. Iran-allied militias. This week, Iraqi security forces surrounded an area run by the Kataib Hezbollah militia. Onlookers describe it as the most dangerous confrontation between the Iraqi state and Iran-allied militias in decades. For years, there have all kinds of rumors about Jurf al-Sakhar, an area around 50 kilometers (31 miles) south of the Iraqi capital Baghdad. It is controlled by an Iraqi militia called Kataib Hezbollah, that's closely allied with Iran , and no Iraqi government troops or news media outlets have been allowed inside for around 12 years. Rumors about what's happening in the area include allegations about secret prisons, mass graves, drone and weapons manufacturing and storage, as well as criminal activity such as oil smuggling. Jurf al-Sakhar is also allegedly a base for foreign, Hezbollah-supporting nationals from Iran , Yemen, Bahrain and Lebanon. Recently two people — an Israeli researcher and a US journalist — who were kidnapped by an Iraqi militia are thought to have been held captive in this area. Jurf al-Sakhar previously had an estimated 89,000 residents but after the extremist group known as the \"Islamic State,\" or IS, rose to power in Iraq in 2014, much of the population was displaced in fighting. The area was eventually taken over by Kataib Hezbollah, a militia that had fought IS alongside other armed groups. As a collective, the armed groups are referred to as the Popular Mobilization Forces, or PMF. Not all of them have pledged allegiance to Iran but Kataib Hezbollah, a Shiite Muslim majority group, has. In the past 12 years, tens of thousands of the displaced people from here, mostly Sunni Muslims, have not been allowed to return and the area has been described as militarized. Its name was even changed by Kataib Hezbollah fighters, from Jurf al-Sakhar (\"rocky bank\") to Jurf al-Nasr (\"bank of victory\"). But recent events may shake Kataib Hezbollah's hold on this area. An early November report for the Iraqi government says that since 2021, the group has smuggled hundreds of millions of dollars' worth of state-owned oil, siphoned from pipelines around Jurf al-Sakhar. Iraq's new government, headed by Prime Minister Ali al-Zaidi, made several arrests based on the report and demanded that Kataib Hezbollah leave Jurf al-Sakhar by Friday, Nov. 20. Kataib Hezbollah rejected al-Zaidi's ultimatum, with a spokesperson saying the group would not withdraw \"not even over our dead bodies.\"\nTopic 2: Xi Jinping, Donald Trump and Vladimir Putin have held trilateral talks ― but what did they achieve?. The presidents of China, the US and Russia have held an unprecedented summit. While Trump said the three leaders were \"making history,\" Xi described the talks as \"fruitful\" and Putin called them \"open and candid.\"\nTopic 3: EU Commission confirms it was targeted in cyberattack using AI tools. The European Commission was targeted by an \"AI-generated cybercampaign,\" a spokesperson has said. T"}, {"station": "France24 フランス", "title": "Macron urges Ukraine's allies to 'reopen the question' of NATO membership", "videoId": "lez2R3UPo9g", "audioUrl": "audio/05_France24_フランス.mp3", "script": "France24 フランスの主要ニュースです。\nTopic 1: Macron urges Ukraine's allies to 'reopen the question' of NATO membership. French President Emmanuel Macron on Thursday called for Ukraine's allies to speed up the delivery of urgently needed air defence systems and urged them to \"reopen the question\" of Ukraine's NATO membership after talks in Berlin aimed at reaffirming European support for Kyiv.\nTopic 2: A president among body bags: Photo ops spark outrage in Colombia. Since taking office in August, Colombia's far-right President Abelardo de la Espriella has regularly posted videos that show him walking among body bags supposedly holding the remains of rebel fighters – a communications strategy that has sparked widespread criticism.\nTopic 3: Three of a kind? Xi hosts Trump and Putin as Ukraine war grinds on. Gang of three or glorified photo op? Xi Jinping hosting Donald Trump and Vladimir Putin on the sidelines of the APEC summit. Already, our Monday panel rejected attempts to paint the three-way meeting as a new Yalta, as in the 1945 sit-down on the Black Sea that defined the post-war security architecture of Europe."}, {"station": "KBS 韓国", "title": "Trump, Xi, Putin Discuss Global Challenges at Historic 3-Way Talks", "videoId": "ok7OJfRkukQ", "audioUrl": "audio/07_KBS_韓国.mp3", "script": "KBS 韓国の主要ニュースです。\nTopic 1: Trump, Xi, Putin Discuss Global Challenges at Historic 3-Way Talks. Written: 2026-11-19 19:53:46 / Updated: 2026-11-19 19:54:01 Creative [4K] JISOO, ATEEZ, NCT DREAM, TWS, RESCENE, A2O SOUL, ILLIT, CHAERYEONG, UNCHILD | On the way to Music Bank 261113 2026-11-13 Wonder Hours with Hyerim NO CAP CONFESSIONS | Who Said Romance Is for Anniversaries Only? 2026-11-11 K-POP News November’s comeback lineup to warm up the winter chill! 2026-11-04 Copyright ⓒ KBS. All rights reserved. No copy, distribution or use of the content (AI learning included). This website is sponsored by the Korea Media and Communications Commission. The Web site is optimized for viewing in Chrome, Safari, Firefox and Internet Explorer 11 and higher versions. This website uses cookies and other technology to enhance quality of service. Continuous usage of the website will be considered as giving consent to the application of such technology and the policy of KBS. For further details >\nTopic 2: US, Chinese, Russian Leaders Say They Must Safeguard World Peace Together. [International] :The presidents of the United States, China and Russia have agreed that their countries must work together to safeguard world peace.\n\nDonald Trump, Xi Jinping and Vladimir Putin shared the view in opening remarks at their summit, which began late Thursday afternoon at the Qilin Villa in Shenzhen, located in ...[more...]\nTopic 3: Supreme Court Remands Ex-Prime Minister Han Duck-soo’s Insurrection Case. [Politics] :The Supreme Court has remanded the case of former Prime Minister Han Duck-soo, overturning his 15-year prison sentence for his role in the December 3, 2024, martial law incident, which the judiciary has defined as a criminal insurrection.\n\nThe top judicial authority sent the case back to the Seoul High Court ...[more...]"}, {"station": "CNA アジア", "title": "Spanish PM, right-wing rival spar in key election debate", "videoId": "PTPXTX4i4p4", "audioUrl": "audio/09_CNA_アジア.mp3", "script": "CNA アジアの主要ニュースです。\nTopic 1: Spanish PM, right-wing rival spar in key election debate. The debate takes place ahead of Spain’s Nov 29 election. Spain's Prime Minister Pedro Sanchez speaks to the members of the media during arrivals for European Union leaders' summit in Brussels, Belgium Oct 15, 2026. (Photo: REUTERS/Stephanie Lecocq) Get our pick of top stories and thought-provoking articles in your inbox Stay updated with notifications for breaking news and our best stories Join our channel for the top reads for the day on your preferred chat app Copyright© Mediacorp 2026. Mediacorp Pte Ltd. All rights reserved. We know it's a hassle to switch browsers but we want your experience with CNA to be fast, secure and the best it can possibly be. To continue, upgrade to a supported browser or, for the finest experience, download the mobile app.\nTopic 2: Hegseth makes lightning-fast trips to Ecuador, Honduras.\nTopic 3: Russian strikes on Kyiv kill one, damage Dutch and Austrian embassies."}, {"station": "ABC 豪州", "title": "Magic the Doberman becomes owner's second dog rescued from mineshaft", "videoId": "zrPahAzZZ6o", "audioUrl": "audio/10_ABC_豪州.mp3", "script": "ABC 豪州の主要ニュースです。\nTopic 1: Magic the Doberman becomes owner's second dog rescued from mineshaft. Magic the Doberman has been rescued after falling down a disused mineshaft in the Ballarat region. ( Supplied: Invermay CFA ) A Doberman has been rescued from a disused mineshaft in bushland near Ballarat. Magic is her owner's second dog to fall into one of the region's thousands of disused mineshafts. Rescuers advise people unfamiliar with the area to stick to formed paths. It was a moment of deja vu for a Country Fire Authority (CFA) firefighter when he helped rescue a Doberman from a mineshaft in western Victoria earlier this week. Magic the Doberman became her owner's second dog rescued from a mineshaft after she fell into one while chasing a rabbit in bushland at Nerrina, near Ballarat, on Monday. Fire Rescue Victoria (FRV) was called, and a specialist high-angle rescue team hoisted Magic nearly six metres to safety. A high-angle rescue team member entered the mineshaft to harness Magic and help bring her to safety. ( Supplied: Invermay CFA ) \"There were no reported injuries, and the dog was happy to be reunited with its owner,\" an FRV spokesperson said. Invermay CFA firefighter Daryl Rowe, who was part of the rescue team, said it was a familiar scene. \"Interestingly, the same owner, we rescued another one of his dogs about 10 years ago [from a mineshaft],\" Mr Rowe said. But he said it was unsurprising, considering the number of disused mineshafts in the area.\nTopic 2: Live: Anthropic's record-breaking listing hits Nasdaq, ASX set to drop. Anthropic's long-awaited listing hit the Nasdaq, with the stock opening at $US111.51, about 34 per cent higher than its initial public offering price of $US83.\nTopic 3: Live: Minister plays down recession concerns despite economist warnings. Amanda Rishworth has played down concerns from economists about a recession as Australian companies announce job cuts. Follow live."}];
  document.getElementById("page-title").textContent = "🌍 世界の朝刊 NHK風同時通訳プレイヤー (2026年11月20日)";

  let player = null;
  let currentIndex = 0;
  const audioEl = document.getElementById("ja-audio");
  const playlistEl = document.getElementById("playlist");

  newsItems.forEach((item, idx) => {
    const li = document.createElement("li");
    li.id = "item-" + idx;
    li.innerHTML = `<div><div class="station">${item.station}</div><div class="title">${item.title}</div></div><button>▶ 同時再生</button>`;
    li.onclick = () => playIndex(idx);
    playlistEl.appendChild(li);
  });

  function onYouTubeIframeAPIReady() {
    if (newsItems.length === 0) return;
    player = new YT.Player("yt-player", {
      videoId: newsItems[0].videoId,
      playerVars: { playsinline: 1, rel: 0 },
      events: {
        onReady: () => {
          player.setVolume(document.getElementById("orig-vol").value);
        }
      }
    });
  }

  function playIndex(idx) {
    if (idx < 0 || idx >= newsItems.length) return;
    currentIndex = idx;
    const item = newsItems[idx];

    document.querySelectorAll(".playlist li").forEach(el => el.classList.remove("active"));
    document.getElementById("item-" + idx).classList.add("active");
    document.getElementById("now-playing").textContent = "放送中: " + item.station + " - " + item.title;
    document.getElementById("script-box").textContent = item.script;

    if (player && player.loadVideoById) {
      player.loadVideoById({ videoId: item.videoId, startSeconds: 0 });
      player.setVolume(document.getElementById("orig-vol").value);
      player.playVideo();
    }
    audioEl.src = item.audioUrl + "?t=" + Date.now();
    audioEl.currentTime = 0;
    audioEl.play();
  }

  function pauseBoth() {
    if (player && player.pauseVideo) player.pauseVideo();
    audioEl.pause();
  }

  function nextTrack() {
    if (currentIndex + 1 < newsItems.length) {
      playIndex(currentIndex + 1);
    } else {
      pauseBoth();
      document.getElementById("now-playing").textContent = "本日の全ニュースの放送が終了しました。";
    }
  }

  function changeOrigVol(val) {
    if (player && player.setVolume) player.setVolume(val);
  }

  audioEl.addEventListener("ended", () => {
    nextTrack();
  });
</script>
