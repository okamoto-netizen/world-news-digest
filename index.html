<script>
  const newsItems = [{"station": "BBC 英国", "title": "Watch: Roofs torn off and streets under water as severe weather hits US", "videoId": "awHRBxBxTJg", "audioUrl": "audio/01_BBC_英国.mp3", "script": "BBC 英国の主要ニュースです。\nTopic 1: Watch: Roofs torn off and streets under water as severe weather hits US. Powerful storms are battering both US coasts as the Thanksgiving holiday weekend gets under way. Hundreds of flights have been cancelled and hundreds of thousands are without power, in states including Virginia, North Carolina and New Jersey. Strong winds have blown roofs off houses and floodwater has submerged streets. Watch: Roofs torn off and streets under water as severe weather hits US. Video, 00:00:48 Watch: Roofs torn off and streets under water as severe weather hits US Up Next. Fireball steals the show during Thanksgiving drone display in Indiana. Video, 00:00:19 Fireball steals the show during Thanksgiving drone display in Indiana Deadly fire erupts near Cairo killing dozens of people. Video, 00:00:58 Deadly fire erupts near Cairo killing dozens of people 'Top Gear is back': Gordon Ramsay announced as new host. Video, 00:00:26 'Top Gear is back': Gordon Ramsay announced as new host Why has China sent the first Pakistani astronaut to space? Video, 00:01:05 Why has China sent the first Pakistani astronaut to space? The CCTV that helped convict a Sydney policeman of double murder. Video, 00:01:53 The CCTV that helped convict a Sydney policeman of double murder Watch: Thomas Markle's charges over child sexual abuse material. Video, 00:01:03 Watch: Thomas Markle's charges over child sexual abuse material Would you let Meta's AI agent run parts of your life? Video, 00:01:23 Would you let Meta's AI agent run parts of your life? 'I'm proud of it': Killer confesses after murdering Ian Huntley. Video, 00:01:17 'I'm proud of it': Killer confesses after murdering Ian Huntley\nTopic 2: German boat dealer suspected of supplying Channel smuggling gangs, BBC finds. Nearly a third of crossings in early 2026 allegedly involved boats or engines from the German man's firm.\nTopic 3: Watch: BBC confronts German man suspected of supplying migrant gangs with small boats. Marvin Reuter is contesting extradition to France, where he could face smuggling, criminal conspiracy and involuntary manslaughter charges."}, {"station": "ABC 米国", "title": "Mexican president blasts DEA over tip lines", "videoId": "19x08_VLMB4", "audioUrl": "audio/02_ABC_米国.mp3", "script": "ABC 米国の主要ニュースです。\nTopic 1: Mexican president blasts DEA over tip lines. Mexico's president has criticized the U.S. Drug Enforcement Administration for setting up anonymous tip lines in the country MEXICO CITY -- Mexico's president has blasted the U.S. Drug Enforcement Administration after it set up anonymous tip lines in the country, accusing American officials of “interference” and not doing enough to fight fentanyl and corruption inside their own borders. President Claudia Sheinbaum, in harsh comments Thursday, read excerpts from a new investigation by The Associated Press revealing how the DEA allowed at least 1.4 million counterfeit fentanyl pills to go unseized as it spent eight months tracking a drug trafficking ring flooding the Southwest with deadly drugs. “The DEA has plenty of work to do in its own country. A lot,” Sheinbaum said, pointing to the AP report. “The first thing it should do is investigate corruption in the United States linked to organized crime, or what they call terrorist groups.” Sheinbaum's angry response comes less than 24 hours after DEA Administrator Terry Cole announced the tip lines on his X account, encouraging Mexicans to denounce members of criminal networks in Sinaloa state, the corrupt officials who support them and people who launder money to finance narcoterrorism. “Your information matters. Your identity and your safety matter,” Cole said, specifying that tips submitted via Signal, WhatsApp and email would be handled confidentially. The United States has stepped up pressure on Mexico to fight the cartels and has even offered to deploy troops on Mexican soil, something Sheinbaum has ruled out while maintaining that there will be security cooperation with Washington, “but without subordination.” On Nov. 20, Mexican military forces captured drug lord Fausto Isidro Meza Flores, alias “El Chapo Isidro,” a key ally of a Sinaloa cartel faction who was on the FBI’s Ten Most Wanted Fugitives list. Mexico requested Washington’s support for the operation, and the United States sent a drone to help gather information about the drug lord’s whereabouts. The U.S. has requested Meza Flores’ extradition, but Mexican Attorney General Ernestina Godoy said he will be tried in Mexico. Although cooperation between the two countries went smoothly in that operation, tensions arose between Mexico and Washington in late April after federal prosecutors in New York made public a drug trafficking indictment against Sinaloa Gov. Rubén Rocha Moya, a member of Mexico’s governing party . He and nine other officials were accused of collaborating with a faction of the Sinaloa cartel, which the Trump administration has designated a foreign terrorist organization. Amid the controversy, Rocha Moya took an indefinite leave of absence, and his bank accounts in Mexico were frozen. But Mexican authorities refused to carry out the U.S. request to arrest him. Former Sinaloa Security Secretary Gerardo Mérida Sánchez surrendered to U.S. authorities in May.\nTopic 2: Guin"}, {"station": "AlJazeera 中東", "title": "Attack on Saudi’s Jazan refinery kills one person, disrupts operations", "videoId": "8eHSVdSRBl8", "audioUrl": "audio/03_AlJazeera_中東.mp3", "script": "AlJazeera 中東の主要ニュースです。\nTopic 1: Attack on Saudi’s Jazan refinery kills one person, disrupts operations. The attack killed a Nepali national, injured several people and sparked a fire, Saudi Energy Ministry says. An aerial projectile has hit an oil refinery in Saudi Arabia’s city of Jazan, killing one worker and injuring several other people, according to the country’s Ministry of Energy. Thursday’s attack on the facility on the kingdom’s Red Sea coast caused a fire and temporarily halted some operations, the ministry said. The statement did not identify who carried out the strike, but earlier the Saudi-led military coalition fighting Yemen’s Houthis said that the Iranian-backed group had ⁠⁠attacked the refinery. It came after Saudi Arabia’s civil defence agency had issued an alert about potential danger in Jazan province. The strike was the Houthis ‘ latest blow against key Saudi facilities, a day after the group claimed attacks on Ras Tanura, the kingdom’s largest refinery and a major crude export hub, and the Red Sea ports of Jeddah and Jazan, amid escalating hostilities between the two sides. The Saudi Ministry of Energy said the worker who died was Nepali, while the injured were of various nationalities. The injured received medical care, while emergency personnel and specialised technical teams arrived at the site to assess the damage and verify the safety of the facilities following the attack, the ministry added. The refinery in southwestern Saudi Arabia , near the Yemeni border, is designed to process up to 400,000 barrels of crude oil per day. The Saudi-led coalition, which is backing Yemen’s internationally recognised government in its fight with the Houthis, condemned the strike and threatened a counterattack. “Targeting civilians and ⁠⁠civilian infrastructure would ⁠⁠be ⁠⁠met with a firm military ‌‌response,” coalition spokesman Turki al-Maliki posted on X. Later on Thursday, the coalition claimed its forces had destroyed a Houthi ballistic missile launch platform in Yemen’s Hodeidah governorate used by the armed group to stage the attack on the Jazan refinery, according to al-Maliki. There was no immediate statement from the Houthis regarding the strike. On the ground in Yemen, meanwhile, Saudi-backed government forces claimed they had carried out 767 strikes on Houthi positions on Thursday.\nTopic 2: Indian politician facing murder charges hosts 400,000-guest wedding. An estimated 400,000 people attended politician Anant Singh’s daughter’s lavish wedding in Bihar, India’s poorest state.\nTopic 3: Mexico seeks US talks about suspected SpaceX debris. Mexico concerned as SpaceX ramps up rocket launches from Starbase near border in Texas."}, {"station": "DW ドイツ", "title": "Saudi pop music is thriving — but for the right reasons?", "videoId": "kGu4pLZzP5I", "audioUrl": "audio/04_DW_ドイツ.mp3", "script": "DW ドイツの主要ニュースです。\nTopic 1: Saudi pop music is thriving — but for the right reasons?. As part of Vision 2030, Saudi Arabia's music scene has evolved hugely thanks to state funding and support. Local musicians and DJs are optimistic. But are they actually just helping prop up an authoritarian state? Today, rapper Asayel Bishi is one of Saudi Arabia's rising hip-hop stars, signed to the country's biggest record label for new music, MDLBEAST. But not so long ago, she was making international headlines for a totally different reason. In 2020, after Bishi released a music video for a song, \"Bint Mecca,\" or \"girl from Mecca,\" featuring people dancing in a local cafe, Mecca's governor called for the arrest of Bishi's whole production team. He said the video violated the holy city's local customs and traditions . In the end, the situation was resolved with a discussion about filming permits. And by early 2023, Bishi was signed to MDLBEAST and has since racked up hundreds of thousands of streams on music platforms like Spotify . In the past, other Saudi rappers have ended up in prison for similar, alleged transgressions. The fact that Bishi's story went a different way is probably partially because the 31-year-old's career path is on a similar trajectory to the Saudi pop music industry as a whole. As part of Saudi ruler Mohammed bin Salman's Vision 2030 plan , announced in 2016 and which aims to move the country away from economic dependence on oil, the country has poured billions into the local music industry. The pace of development increased in 2019 after the country held its first major festival, Soundstorm, an annual event that now draws major international acts and over 400,000 guests. MDLBEAST was created then, primarily as the festival organizer. Since then, it has also become a record label, radio station, distributor, promoter and talent incubator. A recent report for the Saudi Music Commission suggests the music sector could be worth $500 million (€455 million) by 2034. But it's difficult to figure out how well Saudi pop is really doing now because independent monitoring of the sector only began relatively recently. Streaming platform Spotify reports that people listening to Saudi-made music inside Saudi Arabia increased by 195% between 2020 and 2024. However, the most-streamed artists inside the country are still international. Although there was a mostly-hidden Saudi music scene before this recent boom, observers say the growth of the Saudi music sector is not organic. It's all about building an industry from the top down, Amr Abdelrahim, a researcher at Sciences Po in Paris, reported in a 2024 study . \"After 2016, young middle-class musicians and creative professionals, who had been careful to avoid drawing official attention to their countercultural activities suddenly became central to the ambitions of the state,\" he wrote. The careers of young Saudi acts — like Bishi, for example — \"became tied to the destiny of the crown prince,\" the researcher explained.\n"}, {"station": "France24 フランス", "title": "Reporters Without Borders demands suspension of controversial French TV channel CNews", "videoId": "EOHtyB-kIFo", "audioUrl": "audio/05_France24_フランス.mp3", "script": "France24 フランスの主要ニュースです。\nTopic 1: Reporters Without Borders demands suspension of controversial French TV channel CNews. Paris-based international press freedom group Reporters Without Borders (RSF) on Thursday called on France's media regulator Arcom to suspend right-wing channel CNews for one month over its failure to uphold pluralism. The news channel owned by conservative billionaire Vincent Bolloré condemned the call for its suspension.\nTopic 2: Will Spain's far right replace Europe's left-wing stalwart?. Some 39 million Spaniards will head to the ballot this Sunday to vote in early general elections. Latest polls put the conservative Popular Party ahead of incumbent PM Pedro Sanchez’s Socialists. The third-strongest political force, however, is the far-right Vox party. A strong showing at Sunday’s election could see them form Spain’s next government. FRANCE 24 explains.\nTopic 3: ACROSS AFRICA:  Tunisian Photographer's Family Focus. Stories from the continent with Georja Calvin-Smith. This week, health workers struggling to keep pace with DR Congo's Ebola outbreak say they feel abandoned and unsupported. Also, the World Cup was about more than winning... for some fans, at least. Tunisia's performance may not have been all that its supporters had hoped, but sports photographer Hosni Manoubi is far from negative about a family tradition of documenting his country's international sports showings. [Archive Episode, June 2026]"}, {"station": "KBS 韓国", "title": "Parliamentary Defense Committee Passes Motion to Expand Cheonghae Unit’s Operational Area", "videoId": "rj-FPFydZOY", "audioUrl": "audio/07_KBS_韓国.mp3", "script": "KBS 韓国の主要ニュースです。\nTopic 1: Parliamentary Defense Committee Passes Motion to Expand Cheonghae Unit’s Operational Area. Written: 2026-11-26 18:12:47 / Updated: 2026-11-26 18:21:43 Creative [4K] NCT DREAM, A2O SOUL, CHAERYEONG, Kei, BESTie, KEYVITUP, H1-KEY, UNCHILD, Baby DONT Cry | On the way to Music Bank 261120 2026-11-20 Wonder Hours with Hyerim NO CAP CONFESSIONS | Too Shy for a Compliment? Just Say Thank You!! 2026-11-18 K-POP News November’s comeback lineup to warm up the winter chill! 2026-11-04 Copyright ⓒ KBS. All rights reserved. No copy, distribution or use of the content (AI learning included). This website is sponsored by the Korea Media and Communications Commission. The Web site is optimized for viewing in Chrome, Safari, Firefox and Internet Explorer 11 and higher versions. This website uses cookies and other technology to enhance quality of service. Continuous usage of the website will be considered as giving consent to the application of such technology and the policy of KBS. For further details >\nTopic 2: BOK Raises Benchmark Interest Rate to 3.25%, Boosts 2027 Growth Forecast to 4.1%. [Economy] :Anchor: The Bank of Korea(BOK) raised the benchmark interest rate to three-point-25 percent on Thursday, marking the first hike in three months, after stronger-than-expected growth and inflation. The central bank also raised the nation’s 2027 economic growth outlook to four-point-one percent. \nOur Bae ...[more...]\nTopic 3: Rail Services See Disruptions after Workers Launch Work-to-Rule Campaign. [Domestic] :Workers at the Korea Railroad Corporation(KORAIL) launched a work-to-rule action Thursday, causing the rail operator to cancel service on three passenger trains.\n\nThe move, which began at 9 a.m. and is set to last through December 4, means workers will adhere strictly to safety and other regulations, such ...[more...]"}, {"station": "CNA アジア", "title": "Crew member dies after diesel tanker capsizes off Ibiza, no pollution so far", "videoId": "xF09JUbqnsw", "audioUrl": "audio/09_CNA_アジア.mp3", "script": "CNA アジアの主要ニュースです。\nTopic 1: Crew member dies after diesel tanker capsizes off Ibiza, no pollution so far. The tanker carried up to 7,000 tonnes of diesel, but authorities reported no major spill and activated Spain’s Level 2 maritime pollution response plan. A rescue vessel moves next to the capsized oil tanker Med Emre off Ibiza, Spain, Nov 26, 2026. (Photo: REUTERS/CGT Mar y Puertos) MADRID: At least one crew member aboard a ship carrying diesel has died after the vessel capsized and partially sank off the Spanish island of Ibiza on Thursday (Nov 26), regional authorities said , adding there were no signs of pollution so far. The Malta-flagged chemical tanker Med Emre was sailing from Algeciras to Barcelona and may have been carrying up to 7,000 metric tons of diesel when it keeled over about 30 nautical miles (56 km) off Ibiza 's northwestern coast, the Balearic Islands' interior department said. Emergency services said all 17 crew members were rescued, but one died after being taken directly to Ibiza 's Can Misses hospital. Six others were brought to Ibiza airport and taken to two hospitals with light injuries, primarily hypothermia. Of the remaining crew, five were taken to Valencia and five remained in good condition aboard a rescue vessel, they added. CNA Games Guess Word Crack the word, one row at a time Buzzword Create words using the given letters Mini Sudoku Tiny puzzle, mighty brain teaser Mini Crossword Small grid, big challenge Word Search Spot as many words as you can Show More Show Less Pablo Garriz, the Balearic Islands' regional head of emergencies, said the crew included Turkish and Indian nationals, but he could not yet confirm the nationality of the deceased. The tanker remained partially submerged with its keel protruding above the surface, Garriz told reporters, despite initial indications that it had sunk completely. \"The positive news is that the vessel is not on the seabed but remains semi-submerged at the surface, which allows salvage and containment operations,\" he said, adding there was currently no impact on Balearic waters or coastline and no evidence of a significant spill, although small sheens had been observed. Technical experts were assessing the vessel's stability before deciding on salvage and cargo-recovery operations, he added. Pablo Garriz, the Balearic Islands' regional head of emergencies, said the crew included Turkish and Indian nationals, but he could not yet confirm the nationality of the deceased. The tanker remained partially submerged with its keel protruding above the surface, Garriz told reporters, despite initial indications that it had sunk completely. \"The positive news is that the vessel is not on the seabed but remains semi-submerged at the surface, which allows salvage and containment operations,\" he said, adding there was currently no impact on Balearic waters or coastline and no evidence of a significant spill, although small sheens had been observed. Technical experts were assessing the vessel's stability"}, {"station": "ABC 豪州", "title": "The remarkable journey behind one of oldest Wallabies debutants", "videoId": "kGXbP7MdU8g", "audioUrl": "audio/10_ABC_豪州.mp3", "script": "ABC 豪州の主要ニュースです。\nTopic 1: The remarkable journey behind one of oldest Wallabies debutants. Ramm is one of the Wallabies oldest ever debutants. ( Getty Images: Hagen Hopkins ) Western Force winger James Ramm will make his Wallabies debut against Ireland at 28. Ramm never played First XV at school and only took up rugby once a promising gymnastics career ended. Ramm's rapid improvement after moving from the Waratahs to Northampton Saints in England put him on the Test radar. James Ramm, the late-blooming, one-time gymnast who has finally made the international rugby grade at the age of 28, wants his long, battling journey to the top to inspire a new generation of wannabe Wallabies. When winger Ramm takes the field at Twickenham against Ireland for his Australia debut on Friday night (Saturday AEDT), it will be the culmination of a road beset by injuries and false starts, one on which he switched sports and had to move to the other side of the world to reboot his career. But now, when he thinks how the one-time gangly kid who couldn't even break into his first-team at Sydney's St Joseph's College is going to be one of the modern-day Wallabies' oldest wing debutants after years of perseverance, he declares: \"I'm really proud of my journey.\" James Ramm shot to stardom with Northampton Saints in England. ( Getty Images: David Rogers ) \"And all I hope from it is that other people who are in similar situations, playing seconds or thirds at school who want to pursue rugby, realise that school's not the be-all and end-all,\" he said. \"As soon as you leave school, you understand that, but when you're in it, it's quite hard to see. A couple of years ago, I went back to Joey's actually to talk to the second XV players at the school and explain my story and show that not everyone's journey is the same. \"If you really want it, you can get it from whatever position you're in at school.\" So it was that Ramm's rugby adventure really only began after he'd given up on his promising gymnastics career, which had once dealt him dreams of being an Olympian.\nTopic 2: Live: ASX to edge higher as global stocks climb. The ASX is set to open a little higher after solid gains across Europe and Asia. Follow the day's events and insights from our business reporters on the ABC News live markets blog.\nTopic 3: Motor-racing resort could breathe new life into old mine site. Developers with big dreams are showing what is possible for productive post-mining land use, but coal communities want a plan for what comes next."}];
  document.getElementById("page-title").textContent = "🌍 世界の朝刊 NHK風同時通訳プレイヤー (2026年11月27日)";

  let player = null;
  let currentIndex = 0;
  const audioEl = document.getElementById("ja-audio");
  const playlistEl = document.getElementById("playlist");

  newsItems.forEach((item, idx) => {
    const li = document.createElement("li");
    li.id = "item-" + idx;
    li.innerHTML = `<div><div class="station">${item.station}</div><div class="title">${item.title}</div></div><button>▶ 同時再生</button>`;
    li.onclick = () => playIndex(idx);
    playlistEl.appendChild(li);
  });

  function onYouTubeIframeAPIReady() {
    if (newsItems.length === 0) return;
    player = new YT.Player("yt-player", {
      videoId: newsItems[0].videoId,
      playerVars: { playsinline: 1, rel: 0 },
      events: {
        onReady: () => {
          player.setVolume(document.getElementById("orig-vol").value);
        }
      }
    });
  }

  function playIndex(idx) {
    if (idx < 0 || idx >= newsItems.length) return;
    currentIndex = idx;
    const item = newsItems[idx];

    document.querySelectorAll(".playlist li").forEach(el => el.classList.remove("active"));
    document.getElementById("item-" + idx).classList.add("active");
    document.getElementById("now-playing").textContent = "放送中: " + item.station + " - " + item.title;
    document.getElementById("script-box").textContent = item.script;

    if (player && player.loadVideoById) {
      player.loadVideoById({ videoId: item.videoId, startSeconds: 0 });
      player.setVolume(document.getElementById("orig-vol").value);
      player.playVideo();
    }
    audioEl.src = item.audioUrl + "?t=" + Date.now();
    audioEl.currentTime = 0;
    audioEl.play();
  }

  function pauseBoth() {
    if (player && player.pauseVideo) player.pauseVideo();
    audioEl.pause();
  }

  function nextTrack() {
    if (currentIndex + 1 < newsItems.length) {
      playIndex(currentIndex + 1);
    } else {
      pauseBoth();
      document.getElementById("now-playing").textContent = "本日の全ニュースの放送が終了しました。";
    }
  }

  function changeOrigVol(val) {
    if (player && player.setVolume) player.setVolume(val);
  }

  audioEl.addEventListener("ended", () => {
    nextTrack();
  });
</script>
