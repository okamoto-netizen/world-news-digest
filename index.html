vernight, killing at least seven in Kyiv.\nTopic 3: FBI national crime database suffers suspected breach: Reports. The reported hacking is the latest in ​a string of breaches and outages affecting the US government."}, {"station": "DW ドイツ", "title": "Russian helicopter suspected of violating Finnish airspace", "videoId": "fTdC0VRTCcg", "audioUrl": "audio/04_DW_ドイツ.mp3", "script": "DW ドイツの主要ニュースです。\nTopic 1: Russian helicopter suspected of violating Finnish airspace. Finland's Defense Ministry thinks the incursion is linked to a drone strike earlier Saturday on a Russian cargo ship, which is on a US sanctions list. A Russian helicopter is suspected of violating Finnish airspace, the Nordic country's Ministry of Defense said Saturday. The incident happened a few hours after a drone attack left a Russian cargo ship ablaze in the Gulf of Finland, the easternmost part of the Baltic Sea. According to Finland's Defense Ministry, the incursion happened at 12:34 p.m. local time (10:34 UTC/GMT) off the town of Loviisa, on the southern coast. \"This alleged airspace violation may be linked to rescue or surveillance operations carried out by Finland following damage sustained by a cargo ship in the Gulf of Finland,\" public broadcaster YLE cited Defense Minister Antti Hakkanen as saying. The ministry added the helicopter could have penetrated up to 4.1 kilometers (2.5 miles) into Finnish territory. Earlier Saturday, Finland — one of NATO's newest members — said a Russian cargo ship heading for Russia's Baltic exclave of Kaliningrad caught fire after being struck by drones in the Gulf of Finland. The Finnish military said the Sparta II was damaged ⁠west ⁠of Russia's Gogland island, about 40 kilometers (25 miles) from Finland's coast, and later drifted into Finnish territorial waters. Finnish ‌Border ​Guard Commander Ilja Iljin later told YLE that the vessel, which is known to have links to the Russian military, was struck by Ukrainian drones while in Russian waters. \"At the moment, ​there is no confirmed information ⁠about ​what cargo ​is on board, ​but it ‌cannot be ruled out ​that ⁠there is military materiel on ⁠board,\" ​Iljin said. The ship is on a US sanctions list, according to a search of the Open Sanctions website. The Border Guard later said the crew of the Sparta II was evacuating into a life raft and rescue boat.\nTopic 2: EU and Indonesia sign trade deal. A deal covering 730 million people promises lower tariffs and new investment opportunities as the European Union seeks to diversify trade ties amid growing global economic tensions.\nTopic 3: New EU budget proposal aims at tax gobal tech giants. European Council President Antonio Costa has proposed a smaller EU budget for 2028-2034, including a 3% tax on major digital firms to ease member states' contributions. France has already rejected the plan as inadequate."}, {"station": "France24 フランス", "title": "France’s sixth consecutive Saturday of protests draw lower turnout", "videoId": "lAatMz0qzhs", "audioUrl": "audio/05_France24_フランス.mp3", "script": "France24 フランスの主要ニュースです。\nTopic 1: France’s sixth consecutive Saturday of protests draw lower turnout. Turnout ⁠was down ​at largely peaceful demonstrations across France on the sixth consecutive Saturday of protests ​over the cost of living, with the interior ministry putting the figure at 82,500 across the country. Organisers said 150,000 people participated in the nationwide protests, down from their 200,000 figure last week.\nTopic 2: 'Worst Ever' COP Summit?. Is this the worst COP summit on record?\n \nWith limited political leadership, no official US delegation and mounting frustration over bureaucratic delays, questions are being raised about the effectiveness of the climate negotiations.\n \nJuan Carlos Beldsoe, a former White House climate adviser under Bill Clinton, described the process as labyrinthine and ultimately dispiriting.\n \nFrance 24's Gavin Lee speaks with climate advocate and six-time COP delegate, Henna Hundal about what this means for the future of global climate action.\nTopic 3: Russia attacks Zelensky's hometown, Ukraine reaffirms wish to join NATO. A Russian ballistic missile attack on President Volodymyr Zelensky’s hometown in central Ukraine on Saturday killed two people and wounded dozens. Hours later, Zelensky reiterated his country's determination to join NATO, following proposals to provide Kyiv with security guarantees similar to those of the military alliance."}, {"station": "KBS 韓国", "title": "VOA: Switzerland Sanctions N. Korean Children's Camp over Russia Links", "videoId": "zGFBJL_fhUU", "audioUrl": "audio/07_KBS_韓国.mp3", "script": "KBS 韓国の主要ニュースです。\nTopic 1: VOA: Switzerland Sanctions N. Korean Children's Camp over Russia Links. Written: 2026-11-21 14:07:40 / Updated: 2026-11-21 14:13:54 Creative [4K] NCT DREAM, A2O SOUL, CHAERYEONG, Kei, BESTie, KEYVITUP, H1-KEY, UNCHILD, Baby DONT Cry | On the way to Music Bank 261120 2026-11-20 Wonder Hours with Hyerim NO CAP CONFESSIONS | Too Shy for a Compliment? Just Say Thank You!! 2026-11-18 K-POP News November’s comeback lineup to warm up the winter chill! 2026-11-04 Copyright ⓒ KBS. All rights reserved. No copy, distribution or use of the content (AI learning included). This website is sponsored by the Korea Media and Communications Commission. The Web site is optimized for viewing in Chrome, Safari, Firefox and Internet Explorer 11 and higher versions. This website uses cookies and other technology to enhance quality of service. Continuous usage of the website will be considered as giving consent to the application of such technology and the policy of KBS. For further details >\nTopic 2: Survey: More Japanese Feel Close to S. Korea amid Improved Ties, While Views of China Sour. [Culture] :Amid warming South Korea–Japan relations and deteriorating China–Japan ties, Japanese public affinity toward the two neighbors has sharply diverged.\n\nJapan's Cabinet Office on Saturday released the findings of a survey of reate words using the given letters Mini Sudoku Tiny puzzle, mighty brain teaser Mini Crossword Small grid, big challenge Word Search Spot as many words as you can Show More Show Less Gulf of Finland coast guard commander Mikko Simola later told a press conference the vessel had anchored and its crew was evacuating. Helsinki said it had introduced temporary aviation and maritime restrictions in the eastern Gulf of Finland to protect civilians and allow authorities to operate if drones needed to be intercepted. \"The war is spilling over into our neighbouring areas. Finnish authorities are handling the situation in the Gulf of Finland , where a drone strike has hit a Russian merchant vessel. Ukraine has the right to fight against the aggressor,\" Finnish Prime Minister Petteri Orpo said on X. Ukraine's foreign ministry did not immediately respond to a request for comment. Russia's embassy in Helsinki did not immediately respond to requests for comment. The vessel is subject to US sanctions and is linked to Russian ship ping company Oboronlogistika, according to the US Treasury Department. Oboronlogistika provides logistics services for the Russian defence ministry, according to the company's website. \"At the moment, there is no confirmed information about what cargo is on board, but it cannot be ruled out that there is military materiel on board,\" Finnish Border Guard Commander Ilja Iljin told Reuters. Helsinki said separately that a Russian helicopter was suspected of violating Finnish airspace on Saturday, possibly in connection with rescue or monitoring operations involving the damaged vessel. Gulf of Finland coast guard commander Mikko Simola later told a press conferenc"}, {"station": "ABC 豪州", "title": "England thrash All Blacks after Moody faces haka with team", "videoId": "_to-Q5BSR5Q", "audioUrl": "audio/10_ABC_豪州.mp3", "script": "ABC 豪州の主要ニュースです。\nTopic 1: England thrash All Blacks after Moody faces haka with team. Lewis Moody (centre) drew a huge ovation from the crowd as he joined the team to face NZ's haka. ( Getty Images: RFU/Dan Mullan ) England captain Maro Itoje said former skipper Lewis Moody gave them an \"extra lift\" as the home side beat NZ 37-12 in the Nations Championship. Moody, who played 71 Tests for England and has MND, joined the team before the match to face the haka. In other results, Ireland beat South Africa, Scotland defeated Japan, and Fiji downed Italy. England has roared to a record victory over New Zealand at Twickenham in the Nations Championship, after emotional scenes before the game involving former skipper Lewis Moody, who has Motor Neurone Disease (MND). The English beat the All Blacks 37-12 to the delight of home fans, inflicting New Zealand's second-straight defeat after last week's loss to Wales. Moody, who played 71 Tests for England between 2001 and 2011 and was part of the team's 2003 Rugby World Cup win, came onto the ground to a huge ovation and took his place with the team to face the NZ pre-match haka. After the haka, various England players came to embrace Moody, who announced his MND diagnosis last year. \"Lewis is such an inspirational man, he ⁠was an inspirational player and, given his ‌diagnosis, the players jumped at ‌the opportunity to support him,\" current England captain Maro Itoje said. \"I think he and his family gave us that ‌extra lift today. He came to spend some time with us yesterday. He presented us our shirts for today's game. \"He addressed us ‌and there's no doubt that his ⁠presence, him joining us for the haka, him spending time with us, gave us an extra lift.\" Itoje, though, played down the impact of how England responded to the haka.\nTopic 2: Victorian Labor MPs conduct a 'pre-mortem' in political death spiral. After three successive election victories, Victoria's Labor Party is coming to grips with what electoral failure looks like and is working out who is to blame.\nTopic 3: FBI database reportedly hacked. The FBI and US Agriculture Department have been targeted in apparent cyber attacks, according to reports from multiple media outlets."}];
  document.getElementById("page-title").textContent = "🌍 世界の朝刊 NHK風同時通訳プレイヤー (2026年11月22日)";

  let player = null;
  let currentIndex = 0;
  const audioEl = document.getElementById("ja-audio");
  const playlistEl = document.getElementById("playlist");

  newsItems.forEach((item, idx) => {
    const li = document.createElement("li");
    li.id = "item-" + idx;
    li.innerHTML = `<div><div class="station">${item.station}</div><div class="title">${item.title}</div></div><button>▶ 同時再生</button>`;
    li.onclick = () => playIndex(idx);
    playlistEl.appendChild(li);
  });

  function onYouTubeIframeAPIReady() {
    if (newsItems.length === 0) return;
    player = new YT.Player("yt-player", {
      videoId: newsItems[0].videoId,
      playerVars: { playsinline: 1, rel: 0 },
      events: {
        onReady: () => {
          player.setVolume(document.getElementById("orig-vol").value);
        }
      }
    });
  }

  function playIndex(idx) {
    if (idx < 0 || idx >= newsItems.length) return;
    currentIndex = idx;
    const item = newsItems[idx];

    document.querySelectorAll(".playlist li").forEach(el => el.classList.remove("active"));
    document.getElementById("item-" + idx).classList.add("active");
    document.getElementById("now-playing").textContent = "放送中: " + item.station + " - " + item.title;
    document.getElementById("script-box").textContent = item.script;

    if (player && player.loadVideoById) {
      player.loadVideoById({ videoId: item.videoId, startSeconds: 0 });
      player.setVolume(document.getElementById("orig-vol").value);
      player.playVideo();
    }
    audioEl.src = item.audioUrl + "?t=" + Date.now();
    audioEl.currentTime = 0;
    audioEl.play();
  }

  function pauseBoth() {
    if (player && player.pauseVideo) player.pauseVideo();
    audioEl.pause();
  }

  function nextTrack() {
    if (currentIndex + 1 < newsItems.length) {
      playIndex(currentIndex + 1);
    } else {
      pauseBoth();
      document.getElementById("now-playing").textContent = "本日の全ニュースの放送が終了しました。";
    }
  }

  function changeOrigVol(val) {
    if (player && player.setVolume) player.setVolume(val);
  }

  audioEl.addEventListener("ended", () => {
    nextTrack();
  });
</script>
