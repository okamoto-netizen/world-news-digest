<script>
  const newsItems = [{"station": "BBC 英国", "title": "US envoys head to meet Zelensky after talks with Putin in Moscow", "videoId": "RiMjEiqpuB0", "audioUrl": "audio/01_BBC_英国.mp3", "script": "BBC 英国の主要ニュースです。\nTopic 1: US envoys head to meet Zelensky after talks with Putin in Moscow. Witkoff and Kushner's visit to Moscow was the latest of many trips the US envoys have made to see Vladimir Putin US envoys Jared Kushner and Steve Witkoff held a fresh round of talks with Russian President Vladimir Putin in Moscow, a day after the latest discussions aimed at ending the war in Ukraine wrapped up in Abu Dhabi. The pair are now flying to Dublin to meet Ukraine's President Volodymyr Zelensky, and Witkoff said a new round of trilateral talks had already been agreed with Putin. Earlier on Thursday Zelensky said Ukraine's military was again facing \"systematic\" restrictions to Starlink's military-grade satellite service, Starshield, meaning Kyiv was struggling to intercept Russian jet-powered drones. The talks in the Emirates were framed as being centred around European security arrangements in a post-war scenario, although a resolution to the war sparked by Russia's full-scale invasion of Ukraine in 2022 still appears distant. Comments by both President Vladimir Putin and Kremlin officials suggest that Russia's position on the war has not shifted, and that Moscow's demands for territory and neutrality continue to far exceed what Ukraine is prepared to consider. Witkoff said that Europeans would join the next round of talks. \"They are our partners and it's important to us that they take part,\" Witkoff told Russian state TV after meeting Putin in the Kremlin. Zelensky said Ukraine was trying to clear up the Starlink situation with the American side but added \"some things\" were already clear: \"If someone in America is making decisions that basically treat Ukrainian territory as if it is not Ukrainian, then this tells us where things are going.\" He did not elaborate further. Starshield was developed by Elon Musk's SpaceX company for government and military use. Along with Starlink, it has come to play a vital role in facilitating communication on Ukraine's front line. A similar issue with connectivity affected the front line in late October and lasted about a week before it was fixed and it remained unclear who had ordered the temporary restrictions. Why is Ukraine so reliant on Starlink and can Europe plug the gap? Zelensky said the current disruption had been ongoing for several days and was \"helping the Russians kill more Ukrainians and carry out more accurate strikes against Ukraine\". Meanwhile, some of the longstanding roadblocks in the peace process were addressed during the US-Russia talks in the Kremlin.\nTopic 2: Russian warship hit by Ukrainian drone in Gulf of Finland. The attack is thought to be the first time Ukrainian drones have attacked a Russian ship in an open stretch of the Baltic Sea.\nTopic 3: Suspected bomb hoax threats force fresh evacuations of Italian schools. Schools across Italy have received bomb threats for the second day in a row, sparking fresh panic and evacuations."}, {"station": "ABC 米国", "title": "Islamic State group-affiliated rebels kill at least 22 in Congo's eastern region", "videoId": "e3wI7oIvbJo", "audioUrl": "audio/02_ABC_米国.mp3", "script": "ABC 米国の主要ニュースです。\nTopic 1: Islamic State group-affiliated rebels kill at least 22 in Congo's eastern region. A rebel group affiliated with the Islamic State group has killed at least 22 people in Congo's eastern Ituri province ITURI, Congo -- At least 22 people were killed in a series of attacks by a rebel group affiliated with the Islamic State group between Tuesday and Wednesday in Congo 's eastern Ituri province. The attacks were carried out by the Allied Democratic Forces (ADF) across eight locations in the Mambasa territory in Ituri, according to two civil society and human rights monitoring groups. “The death toll remains provisional. In addition to the 22 civilians killed, the perpetrators abducted other individuals, and motorcycles and homes were set on fire,” said Marie-Noelle Anatobe, coordinator of the Civil Society of Congo in Mambasa territory. The attacks happened in nearly inaccessible locations near the border between Uganda and Congo. The ADF grew out of Uganda and was pushed to the border region with Congo, where it has operated for years, targeting civilians. It pledged allegiance to the Islamic State group in 2019. Both the Ugandan and Congolese armies have been jointly attacking the group, but they have long struggled against it. Locals often say the military is usually absent during the attacks. Last year, the group killed dozens of people in Irumu territory in Ituri province, which the United Nations described as a “bloodbath.” “This morning, we were left only to count the dead. It is truly deplorable,” Rams Malikidogo, a coordinator of the Association for the Protection and Defense of Vulnerable Children and Women in Mambasa territory, said. Follow AP’s Africa coverage at: https://apnews.com/hub/africa 24/7 coverage of breaking news and live events\nTopic 2: Brazil fines Facebook $1.3M for failing to comply with court orders during election. Brazil’s top electoral court fines Meta’s Facebook $1.3 million for not fully complying with judicial orders during the recent presidential election runoff campaign\nTopic 3: This Beirut family has sold falafel for 100 years, through war and crisis. It has no plan to stop. The Tabbara family has been making falafel in Lebanon for over a century"}, {"station": "AlJazeera 中東", "title": "Qatar Under-17 World Cup is on despite US pull out", "videoId": "kTNc76jjalM", "audioUrl": "audio/03_AlJazeera_中東.mp3", "script": "AlJazeera 中東の主要ニュースです。\nTopic 1: Qatar Under-17 World Cup is on despite US pull out. Qatar Under-17 World Cup is on despite US pull out The Under-17 World Cup in Qatar will kick off as scheduled next week despite the United States’ decision to withdraw its team from the tournament.\r\nUS Soccer pulled out citing safety concerns, but FIFA boss Gianni Infantino says teams and fans will be safe in the host country.\nTopic 2: Regional security dominates European talks in Dublin amid hybrid attacks. European nations discuss security collaboration and an envoy for Ukraine peace talks during the summit in Ireland.\nTopic 3: Democrats gather in Denver to debate party’s future after US midterm wins. Majority Democrats’ What’s Next conference brings lawmakers and potential 2028 contenders to Denver."}, {"station": "DW ドイツ", "title": "Czechia braces for massive protest as anger over government's public media reform plans boils", "videoId": "7MotZ2CDGL4", "audioUrl": "audio/04_DW_ドイツ.mp3", "script": "DW ドイツの主要ニュースです。\nTopic 1: Czechia braces for massive protest as anger over government's public media reform plans boils. A fast-tracked bill on public media funding reform has sparked strikes, rallies and fears for the independence of public broadcasting in Czechia. A massive protest is due to take place in Prague on November 15. Hundreds of thousands of people are expected to rally in Prague this weekend to protest the Czech government's bid to ram a bill to reform public media funding through parliament in a surprise overnight session late last month. The populist coalition of Prime Minister Andrej Babis fast-tracked the first of three readings of the legislation, which culminated in a vote of approval at 04:36 a.m. on October 24. The bill has already provoked numerous demonstrations and strikes across the country, but Sunday's gathering in the capital's Letna Park is likely to be by far the largest to date. Under the government's proposal, the license fee model that currently funds Czech Television (CT) and Czech Radio (CRo) would be scrapped, and the broadcasters would be funded directly from the state budget. The three parties in the coalition — Babis's centrist ANO, the far-right SPD, and radical conservative Motorists, whose voter bases tend to be less affluent — insist that the license fee is an unfair tax. The parties argue that the new arrangement, which would see funding for CT and CRo cut by around 15% in the first year, would make the two more efficient. They also point out that several other European Union states have made similar changes. Critics have angrily dismissed these justifications. Opposition parties, civil society organizations and international watchdogs accuse the government of seeking to undermine the independence of the broadcasters, whose critical reporting has long irked ANO and the SPD in particular. Analysts point out that while models in other EU states include guarantees of long-term financial stability and editorial independence, the Czech government proposal offers neither. CT and CRo have warned that the reduced budget included in the bill will mean programming- and staff cuts . When the first publication of the proposed bill was met with protests over the summer, Vaclav Stetka of the European New School of Digital Studies told DW that such \"dramatic budget cuts represent an act of cultural vandalism.\"\nTopic 2: Can the EU make it harder to trick consumers online?. The EU wants to curb subscription traps, misleading sales tactics and features that keep people scrolling. What would the proposed Digital Fairness Act change, and does it go far enough?\nTopic 3: What have the talks with Russia and the US in Abu Dhabi achieved for Ukraine?. The first trilateral talks between Ukraine, the US and Russia in nine months have ended with an agreement on exchanging prisoners. Does this mark a genuine breakthrough and a step toward peace?"}, {"station": "France24 フランス", "title": "Israeli strike on Gaza hospital kills six, including surgeon, medics say", "videoId": "MtQ7HJx4n3E", "audioUrl": "audio/05_France24_フランス.mp3", "script": "France24 フランスの主要ニュースです。\nTopic 1: Israeli strike on Gaza hospital kills six, including surgeon, medics say. Israeli fire killed 11 people in Gaza on Thursday, six of them in the bombing of Nasser hospital in south Gaza early in the day, health officials said, the deadliest single strike since Israel's elections last month. FRANCE 24's Mark Owen speaks with Dr Goher Rahbour, a surgeon working at the Nasser Hospital.\nTopic 2: Zelensky warns Europe over US-Russia talks on broader security arrangements. Ukrainian President Volodymyr Zelensky warned European leaders Thursday to be wary of discussions between the United States and Russia about a new security arrangement for the continent. Before launching the war in 2022, the Kremlin delivered an ultimatum to NATO on Europe's security arrangements which included demands for the alliance to withdraw forces from eastern Europe and stop accepting new members. FRANCE 24's Caroline Baum reports.\nTopic 3: Plugged-in planet? COP31 host Turkey leads charge for electrification. It’s sweater weather in Paris. But even though November brings brisk temperatures and fall foliage, it doesn’t mean last summer’s record heat should fade from our memories. One of the suggested reasons why students are so boiling mad is the hell they endured back in June in overheated classrooms and baking shoebox apartments."}, {"station": "KBS 韓国", "title": "Foreign Tourist Numbers Top 20 Million for First Time", "videoId": "oq9i8HQXKN4", "audioUrl": "audio/07_KBS_韓国.mp3", "script": "KBS 韓国の主要ニュースです。\nTopic 1: Foreign Tourist Numbers Top 20 Million for First Time. Written: 2026-11-12 18:23:56 / Updated: 2026-11-12 18:38:15 Creative [4K] ATEEZ, ALD1, NMIXX, RIIZE, ILLIT, NCT WISH, A2O LITE, EVNNE, A2O SOUL | On the way to Music Bank 261030 2026-10-30 Wonder Hours with Hyerim The Season of FLARE U: You Make Us Bloom! 2026-10-28 K-POP News November’s comeback lineup to warm up the winter chill! 2026-11-04 Copyright ⓒ KBS. All rights reserved. No copy, distribution or use of the content (AI learning included). This website is sponsored by the Korea Media and Communications Commission. The Web site is optimized for viewing in Chrome, Safari, Firefox and Internet Explorer 11 and higher versions. This website uses cookies and other technology to enhance quality of service. Continuous usage of the website will be considered as giving consent to the application of such technology and the policy of KBS. For further details >\nTopic 2: Foreign Minister Cho to Hold Talks with Chinese Counterpart in Beijing on Friday. [Politics] :Foreign Minister Cho Hyun is set to hold talks with his Chinese counterpart, Wang Yi, in Beijing on Friday.\n\nForeign ministry spokesperson Park Doo-soon announced the details in a briefing on Thursday, saying Cho will make a two-day trip to China starting Friday. \n\nChina’s foreign ministry also confirmed ...[more...]\nTopic 3: Rain Forecast for Jeonnam-Gwangju’s Coastal Areas, Jeju Island on Friday. [Science] :Rain is forecast for the coastal areas of Jeonnam-Gwangju Special Metropolitan City and Jeju Island on Friday. \n\nAccording to the Korea Meteorological Administration on Thursday, Jeju will see rainfall of up to 60 millimeters through Saturday; Jeonnam-Gwangju and South Gyeongsang Province ten to 40 ...[more...]"}, {"station": "CNA アジア", "title": "One dead, four wounded in downtown Washington shooting: police", "videoId": "2l8Q48v0yEQ", "audioUrl": "audio/09_CNA_アジア.mp3", "script": "CNA アジアの主要ニュースです。\nTopic 1: One dead, four wounded in downtown Washington shooting: police. Police said the shooting may have stemmed from \"some sort of conflict\" with the building’s homeowners association, while one victim remains in critical condition. Local law enforcement respond to reports of an active shooting investigation, Thursday, Nov. 12, 2026, in Washington. (AP Photo/Julia Demaree Nikhinson) WASHINGTON: A gunman shot one person dead and wounded four others in an upscale neighbourhood of downtown Washington on Thursday (Nov 12) before barricading himself in his apartment and killing himself, police said. The shooting, which occurred about a mile north of the White House, sparked a massive police response in the nation's capital with dozens of law enforcement vehicles racing to the scene and police helicopters hovering overhead. Jeffery Carroll, Washington's interim police chief, told reporters that the gunman had fatally shot one person in a fitness center attached to his apartment building and wounded four others before barricading himself in his apartment. He said the man had fired at least twice at police through his apartment door before shooting himself. Police said the suspect had been pronounced dead at the scene. The man, who was not identified, was apparently in \"some sort of a conflict\" with the homeowners association of the apartment building, which is located in the Logan Circle neighborhood of Washington, Carroll said. One of the four wounded was in critical condition while the injuries to the others did not appear to be life-threatening, the police chief said. Washington Mayor Muriel Bowser denounced what she described as a \"senseless act of gun violence\" and said the White House had been briefed about the incident. The shooting occurred during the busy morning rush hour, snarling traffic as police closed off streets around the area. Some residents were evacuated by police while others were told to shelter in place. The Washington Sun quoted a member of the VIDA Fitness gym as saying that he was on a treadmill at the workout facility when the shooting began. Michael Carney said he heard a \"pop\" and then saw someone on the gym floor who had been shot in the head. \"Everyone was kind of just hiding behind planters and stuff,\" Carney told The Sun. The Logan Circle neighbourhood is one of the most expensive in Washington and is known for chic restaurants and nightlife spots. It also sits a short distance from a heavy concentration of foreign embassies. Get our pick of top stories and thought-provoking articles in your inbox Stay updated with notifications for breaking news and our best stories Join our channel for the top reads for the day on your preferred chat app Copyright© Mediacorp 2026. Mediacorp Pte Ltd. All rights reserved. We know it's a hassle to switch browsers but we want your experience with CNA to be fast, secure and the best it can possibly be. To continue, upgrade to a supported browser or, for the finest experience, download th"}, {"station": "ABC 豪州", "title": "Victorian woman aims to grow 300,000 snails for restaurants", "videoId": "KR6niY4NdaI", "audioUrl": "audio/10_ABC_豪州.mp3", "script": "ABC 豪州の主要ニュースです。\nTopic 1: Victorian woman aims to grow 300,000 snails for restaurants. Coralie Schaff grew up in France and now has a snail farm in the Otways in south-west Victoria. ( ABC South West Victoria: Tamsyn Buckle ) French expat Coralie Schaff is heading down the slow and steady trail on her way to becoming a snail farmer in south-west Victoria. Ms Schaff aims to grow her commercial farm to 300,000 snails to supply restaurants. A so-called \"snail consultant\" says there is a niche but potentially successful market for snails in Australia. Growing up in France, Coralie Schaff often went snail hunting with her father and siblings. She now does the same thing with her six-year-old son in Victoria's Otway Ranges. But instead of covering the snails they find in garlic butter, she adds them into a custom-made pen that 3,000 other snails already call home. \"I want to grow the pens to be able to, at capacity, have close to 300,000 snails,\" Ms Schaff said. She has set out to start a commercial snail farm, which, according to her research, will be the only one of its kind in Australia. \"As of today, all of the snails eaten in Australia are imported, so there is a market that we can fill,\" Ms Schaff said. Coralie Schaff’s neighbours collect snails from their garden and offer them to her. ( ABC South West Victoria: Tamsyn Buckle ) The idea came about after she and her husband purchased 21 hectares of land in the green hills of Beech Forest.\nTopic 2: Live: Microsoft 'aggressively pursuing' solution to major outage. A widespread outage has hit Microsoft platforms, including Outlook, preventing users from accessing emails. Follow live.\nTopic 3: Live: ASX to fall as Nvidia shares tumble following CEO exit. Australian shares are poised to open lower after Nvidia shares tumbled following CEO Jensen Huang's resignation. Follow the day's events and insights from our business reporters on the ABC News live markets blog."}];
  document.getElementById("page-title").textContent = "🌍 世界の朝刊 NHK風同時通訳プレイヤー (2026年11月13日)";

  let player = null;
  let currentIndex = 0;
  const audioEl = document.getElementById("ja-audio");
  const playlistEl = document.getElementById("playlist");

  newsItems.forEach((item, idx) => {
    const li = document.createElement("li");
    li.id = "item-" + idx;
    li.innerHTML = `<div><div class="station">${item.station}</div><div class="title">${item.title}</div></div><button>▶ 同時再生</button>`;
    li.onclick = () => playIndex(idx);
    playlistEl.appendChild(li);
  });

  function onYouTubeIframeAPIReady() {
    if (newsItems.length === 0) return;
    player = new YT.Player("yt-player", {
      videoId: newsItems[0].videoId,
      playerVars: { playsinline: 1, rel: 0 },
      events: {
        onReady: () => {
          player.setVolume(document.getElementById("orig-vol").value);
        }
      }
    });
  }

  function playIndex(idx) {
    if (idx < 0 || idx >= newsItems.length) return;
    currentIndex = idx;
    const item = newsItems[idx];

    document.querySelectorAll(".playlist li").forEach(el => el.classList.remove("active"));
    document.getElementById("item-" + idx).classList.add("active");
    document.getElementById("now-playing").textContent = "放送中: " + item.station + " - " + item.title;
    document.getElementById("script-box").textContent = item.script;

    if (player && player.loadVideoById) {
      player.loadVideoById({ videoId: item.videoId, startSeconds: 0 });
      player.setVolume(document.getElementById("orig-vol").value);
      player.playVideo();
    }
    audioEl.src = item.audioUrl + "?t=" + Date.now();
    audioEl.currentTime = 0;
    audioEl.play();
  }

  function pauseBoth() {
    if (player && player.pauseVideo) player.pauseVideo();
    audioEl.pause();
  }

  function nextTrack() {
    if (currentIndex + 1 < newsItems.length) {
      playIndex(currentIndex + 1);
    } else {
      pauseBoth();
      document.getElementById("now-playing").textContent = "本日の全ニュースの放送が終了しました。";
    }
  }

  function changeOrigVol(val) {
    if (player && player.setVolume) player.setVolume(val);
  }

  audioEl.addEventListener("ended", () => {
    nextTrack();
  });
</script>
</body>
