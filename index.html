<script>
  const newsItems = [{"station": "BBC 英国", "title": "Copper wire upgrade caused nationwide flight suspension, US transport secretary says", "videoId": "2tng58e3b2E", "audioUrl": "audio/01_BBC_英国.mp3", "script": "BBC 英国の主要ニュースです。\nTopic 1: Copper wire upgrade caused nationwide flight suspension, US transport secretary says. Watch: US ground stop caused by issue during copper wire update, transport secretary says A nationwide US ground stop that caused thousands of flight cancellations was caused by an issue following a copper wire upgrade, Transport Secretary Sean Duffy said. Duffy told a news conference that the government was trying to find out whether the problem was caused by \"incompetence\" on the part of the company doing the upgrades, or faulty equipment. The US government does not believe it was as a result of a cyber-attack, although an investigation is still under way, Duffy said. Friday's suspension was the longest such incident since the 11 September 2001 attacks on the US and the disruption is expected to last for days. Maintenance was being carried out to switch from copper wire to fibre by a contractor called L3Harris, a technology provider company, Duffy said. The US has \"an incredibly old telecommunications system\", he added. \"It was such an old wire that it was being discontinued,\" he said. The transport secretary explained that a router that was being worked on had started flooding other air traffic control systems and created communication issues with planes which led the government to shut down the airspace for safety reasons. Bryan Bedford, who heads the Federal Aviation Administration (FAA), told the same news conference: \"We see zero evidence of anything nefarious, and zero evidence of anything AI related.\" On Saturday L3Harris said it had completed over 70% of the work to modernise communications infrastructure before the shutdown. \"We are supporting the FAA in its investigation to understand the conditions that led to the 13 November ground stop of our nation's air travel,\" it said in a statement.\nTopic 2: US has floated Ukraine ceding Donbas for Nato membership, Zelensky says. The Ukrainian president says US envoys touted the exchange as part of efforts to end the war with Russia.\nTopic 3: Italy fines Meta €805m over accessing users' photos. The social media giant is accused of not informing 20 million users it had access to their photos."}, {"station": "ABC 米国", "title": "Southeast Asian leaders will call for peaceful resolutions of conflicts. Trump will join final talks", "videoId": "w5vI4UojmdE", "audioUrl": "audio/02_ABC_米国.mp3", "script": "ABC 米国の主要ニュースです。\nTopic 1: Southeast Asian leaders will call for peaceful resolutions of conflicts. Trump will join final talks. Southeast Asian leaders will gather in the Philippine capital this weekend for the annual ASEAN summit that will focus on global conflicts MANILA, Philippines -- Some of the world’s most intractable conflicts will be high on the agenda when Southeast Asian leaders gather in the Philippine capital for annual summit meetings this weekend. U.S. President Donald Trump is expected to join them for the final talks. The three-day summit of the Association of Southeast Asian Nations and their Asian and Western counterparts starts Sunday in a heavily guarded convention center in Manila Bay. According to drafts of prepared post-summit communiques seen by The Associated Press, no breakthroughs are expected in the discussions that will focus on calling for the peaceful resolution of the South China Sea disputes, the civil strife in Myanmar and the wars in the Middle East and Ukraine . This year, the Philippines holds the rotating leadership of ASEAN, a conservative regional bloc of 11 democratic and authoritarian states, including police states. The bloc has managed to keep together such a diverse grouping since its founding in 1967 largely because of its bedrock policy of non-interference in the members' domestic affairs. In Manila, key rivals will again be face-to-face but no shake-ups are anticipated. ASEAN is known more for its photo-ops that project unity, cultural pomp and pageantry than for effectively dealing with the region's conflicts, including the civil war in Myanmar. Trump will land in Manila with U.S. Secretary of State Marco Rubio on Tuesday afternoon, after the main ASEAN summit meetings have concluded and the Philippines has turned over the regional bloc’s annual leadership to Singapore. He will, however, be joining three key meetings on Tuesday night, including a special summit with ASEAN leaders over cocktails and a meeting of the Quadrilateral Security Dialogue consisting of the United States, Japan, Australia and India, according to Philippine officials. China will be represented by its premier, Li Qiang, who will meet ASEAN leaders on Monday, but will leave before Trump arrives, the officials said. The prepared communiques say ASEAN leaders and their major Asian and Western counterparts will exchange “views on regional and international issues of concern,\" before listing the conflicts that will be discussed. “We reaffirmed our shared commitment to upholding international law, including the United Nations Charter,” the prepared statement says. It also underlines the \"importance of the peaceful resolution of disputes, upholding freedom of navigation and overflight and other lawful uses of the sea, including the right of transit passage in straits used for international navigation.” On Saturday, ASEAN foreign ministers met for pre-summit talks, linking hands and posing for a joint photo on stage, their national flags lined up beh"}, {"station": "AlJazeera 中東", "title": "Can being ‘non-Western’ cost you your home in Denmark?", "videoId": "KQmqx23G9IY", "audioUrl": "audio/03_AlJazeera_中東.mp3", "script": "AlJazeera 中東の主要ニュースです。\nTopic 1: Can being ‘non-Western’ cost you your home in Denmark?. Can being ‘non-Western’ cost you your home in Denmark? Denmark’s Supreme Court is set to rule on whether families can be forced from their homes under a law that divides residents into ‘Western’ and ‘non-Western’. Al Jazeera’s Nils Adler reports from Copenhagen, where evictees of majority ‘non-Western’ estates are fighting back.\nTopic 2: Deadly car bomb blast kills two near Syria’s capital. At least two people, a man and a girl, have been killed in a car bomb blast in Jaramana, near Syria's capital Damascus.\nTopic 3: More than 100,000 rally across France in new Yellow Vest protests. Protesters chanted against declining affordability, the Macron government, police violence and poor school conditions."}, {"station": "DW ドイツ", "title": "COP31: Protesters, UN urge swift climate deal", "videoId": "ahZGPzW46dw", "audioUrl": "audio/04_DW_ドイツ.mp3", "script": "DW ドイツの主要ニュースです。\nTopic 1: COP31: Protesters, UN urge swift climate deal. The UN climate chief has warned that \"tactical delays\" at the COP31 climate talks in Turkey could prevent a deal to slow global warming. The United Nations' top climate official urged negotiators at the COP31 climate summit in Turkey to \"avoid tactical delays\" that would prevent a deal to stop global warming. Delegates from more than 200 nations are gathered in the Mediterranean city of Antalya with the core goal of preventing the planet from warming by 2 degrees Celsius (3.6 degrees Fahrenheit). Downtown, thousands of civil society and environmental activists from around the world protested against the consequences of climate change . To view this video please enable JavaScript, and consider upgrading to a web browser that supports HTML5 video Simon Stiell, executive secretary of the United Nations Framework Convention on Climate Change (UNFCCC), said getting an agreement is \"tough but vital work.\" \"There ​is no collective success without compromise from every party,\" he added. \"As we head into the second week, ​I urge ‌parties to move swiftly to the hardest issues and to avoid tactical delays.\" Meanwhile, tens of thousands of protesters marched through Antalya on Saturday for climate protection and human rights, according to organizers. Many were dismayed at the lack of progress and how the climate crisis is taking a back seat. \"The pursuit of profit at all costs continues to set the [global] agenda [and] govern the trajectory of our world, so there is a need to push back,\" environmental activist Zaki Mamdoo from South Africa told DW. Luisa Nebauer, the main organizer of Germany's Fridays for Future movement, lamented that German Chancellor Friedrich Merz was absent from the conference, along with several other European leaders.\nTopic 2: Ukraine: Zelenskyy says security deal could go to referendum. The US has broached the idea of Kyiv giving up the Donbas region in exchange for NATO membership, the Ukrainian president said.\nTopic 3: New facilities in Laos and Cambodia: Is China expanding its military presence in Southeast Asia?. China has been growing its economic relationships in Southeast Asia. Now new military facilities in Laos and Cambodia are causing smaller countries to worry China's military networks are also expanding."}, {"station": "France24 フランス", "title": "Macron says limiting Ukraine aid would pave way to 'another war'", "videoId": "H_ZDxX5irFg", "audioUrl": "audio/05_France24_フランス.mp3", "script": "France24 フランスの主要ニュースです。\nTopic 1: Macron says limiting Ukraine aid would pave way to 'another war'. French President Emmanuel Macron on Saturday warned that limiting aid to Ukraine would force Kyiv into an \"unjust peace\" and risk another war. His statement comes as the United States pushes ahead with efforts to negotiate between Ukraine and Moscow.\nTopic 2: Elon Musk's SpaceX aborts booster recovery due to technical issues. Elon Musk's SpaceX is in the midst of a 15th test-flight of its Starship rocket. The company was hoping to pull off the first-ever \"double catch\" - with both the booster and the ship itself coming safely back down to earth. Instead, an unspecified problem forced the company to abort recovery of the booster, which was diverted from its return path and crashed down into the Gulf of Mexico. Analysis by journalist Frédéric Castel, based in Bosa Chica, Texas, USA.\nTopic 3: Youth Olympic Games organisers hail Senegal's capability to host major events. Dakar 2026 is over. Two weeks of competition, thousands of young athletes and a historic first for Africa. The Youth Olympic Games brought the world to Senegal for the first Olympic sporting event ever held on the continent. From record-breaking performances to historic medals for the host nation, Dakar 2026 has been a celebration of sport, youth and cultural exchange. Our correspondent Aminatou Diallo reports from Dakar."}, {"station": "KBS 韓国", "title": "PPP Stages Rally in Busan to Protest Special Counsel Bill", "videoId": "HpI_RAd23K4", "audioUrl": "audio/07_KBS_韓国.mp3", "script": "KBS 韓国の主要ニュースです。\nTopic 1: PPP Stages Rally in Busan to Protest Special Counsel Bill. Written: 2026-11-14 15:42:39 / Updated: 2026-11-14 15:43:05 Photo : Captured image of People Power Party TV footage Creative [4K] JISOO, ATEEZ, NCT DREAM, TWS, RESCENE, A2O SOUL, ILLIT, CHAERYEONG, UNCHILD | On the way to Music Bank 261113 2026-11-13 Wonder Hours with Hyerim NO CAP CONFESSIONS | Who Said Romance Is for Anniversaries Only? 2026-11-11 K-POP News November’s comeback lineup to warm up the winter chill! 2026-11-04 Copyright ⓒ KBS. All rights reserved. No copy, distribution or use of the content (AI learning included). This website is sponsored by the Korea Media and Communications Commission. The Web site is optimized for viewing in Chrome, Safari, Firefox and Internet Explorer 11 and higher versions. This website uses cookies and other technology to enhance quality of service. Continuous usage of the website will be considered as giving consent to the application of such technology and the policy of KBS. For further details >\nTopic 2: DP Slams PPP Rally against Special Investigation Bill. [Politics] :The Democratic Party has slammed the opposition for holding a second outdoor rally to denounce a planned special counsel investigation into allegations of malicious prosecution under the Yoon Suk Yeol government.\n\nRuling party spokesperson Son Myoung-soo said in a written press briefing Saturday that the ...[more...]\nTopic 3: KBS to Premiere Epic Drama ‘Munmu’ on Saturday Night. [Politics] :KBS is set to premiere its first epic drama in almost three years on Saturday.\n\nTitled “Munmu,” or “Sword & Silence” in English, the 28-episode series stars Lee Hyun-wook in the titular role as the monarch who played a major part in unifying the three kingdoms of Goguryeo, Baekje and Silla in the ...[more...]"}, {"station": "CNA アジア", "title": "Ukraine's Zelenskyy escalates criticism of SpaceX over speed caps", "videoId": "1T4C2YeXDb4", "audioUrl": "audio/09_CNA_アジア.mp3", "script": "CNA アジアの主要ニュースです。\nTopic 1: Ukraine's Zelenskyy escalates criticism of SpaceX over speed caps. The Ukrainian Defence Ministry has raised the issue with SpaceX at the institutional level, Zelenskyy said. Founder, CEO, Chairman, and Chief Engineer of SpaceX, Elon Musk, speaks via videolink on the day of SpaceX's initial public offering (IPO) at the Nasdaq MarketSite in New York City, Jun 12, 2026. (Photo: REUTERS/Brendan McDermid) KYIV: Ukraine's President Volodymyr Zelenskyy escalated his criticism of SpaceX on Saturday (Nov 14), saying speed restrictions on its military-grade Starshield satellite terminals had dangerous political implications and undermined critical air defences. Zelenskyy said Starshield terminals operating in temporarily Russian-occupied territories of Ukraine had been limited to a maximum speed of 161 kph for the past five days, hampering Ukraine's military capabilities. The Ukrainian Defence Ministry has raised the issue with SpaceX at the institutional level, Zelenskyy said. \"The restrictions have now been in place for five days. They say it is some kind of technical issue. We do not believe that is the case,\" Zelenskyy told reporters in remarks released by his office on Saturday. CNA Games Guess Word Crack the word, one row at a time Buzzword Create words using the given letters Mini Sudoku Tiny puzzle, mighty brain teaser Mini Crossword Small grid, big challenge Word Search Spot as many words as you can Show More Show Less \"If you impose restrictions there, you are already partially recognising the temporarily occupied territories as not ours. And that is why I believe we have the right to raise this issue and restore the speed – so that there are no restrictions at all.\" Zelenskyy said the speed restrictions made it more difficult for Ukrainian air defence units to intercept Russian jet-powered drones and made Ukrainian cities more vulnerable. He said he had ordered his top military and foreign ministry officials to address the issue and seek clarification. SpaceX has pushed back against the allegations, denying that it introduced new restrictions or made any changes to its satellite operations. It is the second such outage in recent weeks. In mid-October, Ukrainian officials said that SpaceX limited the speed of Starlink and its Starshield communication systems to about 160 kph amid tensions with US President Donald Trump's administration over Ukrainian attacks on Russian oil refineries. Service was then restored on Oct 24. \"If you impose restrictions there, you are already partially recognising the temporarily occupied territories as not ours. And that is why I believe we have the right to raise this issue and restore the speed – so that there are no restrictions at all.\" Zelenskyy said the speed restrictions made it more difficult for Ukrainian air defence units to intercept Russian jet-powered drones and made Ukrainian cities more vulnerable. He said he had ordered his top military and foreign ministry officials to address the issue and"}, {"station": "ABC 豪州", "title": "Bondi terror attack hero Ahmed Al Ahmed one year on", "videoId": "-4rszjRXAR4", "audioUrl": "audio/10_ABC_豪州.mp3", "script": "ABC 豪州の主要ニュースです。\nTopic 1: Bondi terror attack hero Ahmed Al Ahmed one year on. The deadliest terrorist attack on Australian soil left Ahmed Al Ahmed with a permanent disability, sleepless nights and a fractured family. He was unaware his split-second decision on December 14, 2025, to tackle one of the gunmen at Bondi Beach would turn his life upside down. Looking back at what happened to him over the last year, Mr Al Ahmed found himself struggling to process it all. \"Too many things around especially with my health, it was very hard to recover and still today the healing is very slow … I have nerve damage where it's caused for me all this pain; there's big damage. Mr Al Ahmed's arm has been left with permanent nerve damage. ( ABC News: Abubakr Sajid ) Despite multiple surgeries, Mr Al Ahmed's arm was left with permanent nerve damage and limited mobility, causing him chronic pain. Doctors were able to remove three bullets from his arm, but two remain lodged in his shoulder. But more than metal, there is a mental trauma he carries with him every day. Walking back to the scene where it all unfolded, Mr Al Ahmed could not bring himself to climb the footbridge. The events of that day weigh heavily on Mr Al Ahmed as he returns to Bondi. ( ABC News: Nabil Al-Nashar ) Mr Al Ahmed, a former business owner from southern Sydney, had been visiting Bondi Beach for a walk with his cousin on the day of the attack. When the shooting started, they took cover between parked cars near the now infamous northern pedestrian bridge.\nTopic 2: Hoffman delivers best Alpine World Cup finish in 27 years. Madison Hoffman defies a lowly start position to record Australia's best FIS Alpine World Cup finishing position in 27 years, finishing eighth in the season opener at Levi, Finland.\nTopic 3: Questions remain whether Victoria's election is tackling the big issues. Both the Coalition and Labor argue this election is the most consequential in the Victoria's history, but it's lacking stand-out moments or generation-defining policies."}];
  document.getElementById("page-title").textContent = "🌍 世界の朝刊 NHK風同時通訳プレイヤー (2026年11月15日)";

  let player = null;
  let currentIndex = 0;
  const audioEl = document.getElementById("ja-audio");
  const playlistEl = document.getElementById("playlist");

  newsItems.forEach((item, idx) => {
    const li = document.createElement("li");
    li.id = "item-" + idx;
    li.innerHTML = `<div><div class="station">${item.station}</div><div class="title">${item.title}</div></div><button>▶ 同時再生</button>`;
    li.onclick = () => playIndex(idx);
    playlistEl.appendChild(li);
  });

  function onYouTubeIframeAPIReady() {
    if (newsItems.length === 0) return;
    player = new YT.Player("yt-player", {
      videoId: newsItems[0].videoId,
      playerVars: { playsinline: 1, rel: 0 },
      events: {
        onReady: () => {
          player.setVolume(document.getElementById("orig-vol").value);
        }
      }
    });
  }

  function playIndex(idx) {
    if (idx < 0 || idx >= newsItems.length) return;
    currentIndex = idx;
    const item = newsItems[idx];

    document.querySelectorAll(".playlist li").forEach(el => el.classList.remove("active"));
    document.getElementById("item-" + idx).classList.add("active");
    document.getElementById("now-playing").textContent = "放送中: " + item.station + " - " + item.title;
    document.getElementById("script-box").textContent = item.script;

    if (player && player.loadVideoById) {
      player.loadVideoById({ videoId: item.videoId, startSeconds: 0 });
      player.setVolume(document.getElementById("orig-vol").value);
      player.playVideo();
    }
    audioEl.src = item.audioUrl + "?t=" + Date.now();
    audioEl.currentTime = 0;
    audioEl.play();
  }

  function pauseBoth() {
    if (player && player.pauseVideo) player.pauseVideo();
    audioEl.pause();
  }

  function nextTrack() {
    if (currentIndex + 1 < newsItems.length) {
      playIndex(currentIndex + 1);
    } else {
      pauseBoth();
      document.getElementById("now-playing").textContent = "本日の全ニュースの放送が終了しました。";
    }
  }

  function changeOrigVol(val) {
    if (player && player.setVolume) player.setVolume(val);
  }

  audioEl.addEventListener("ended", () => {
    nextTrack();
  });
</script>
