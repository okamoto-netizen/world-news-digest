<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世界の朝刊 同時通訳プレイヤー</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #f5f5f5; margin: 0; padding: 16px; }
    .container { max-width: 820px; margin: 0 auto; }
    h1 { font-size: 1.3rem; margin-bottom: 12px; color: #fff; }
    .video-box { position: relative; width: 100%; padding-top: 56.25%; background: #000; border-radius: 8px; overflow: hidden; }
    #yt-player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0; align-items: center; background: #1e1e1e; padding: 12px; border-radius: 8px; }
    button { background: #d32f2f; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-size: 0.95rem; font-weight: bold; cursor: pointer; }
    button.secondary { background: #333; }
    button:hover { opacity: 0.9; }
    .now-playing { font-size: 0.95rem; color: #ff8a80; font-weight: bold; margin-bottom: 8px; }
    .script-box { background: #1e1e1e; padding: 14px; border-radius: 8px; font-size: 0.95rem; line-height: 1.7; color: #eee; margin-bottom: 16px; max-height: 220px; overflow-y: auto; white-space: pre-wrap; }
    .playlist { list-style: none; padding: 0; margin: 0; }
    .playlist li { background: #1e1e1e; margin-bottom: 8px; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer; border-left: 4px solid transparent; }
    .playlist li.active { border-left-color: #d32f2f; background: #2a2020; }
    .station { font-size: 0.8rem; color: #aaa; }
    .title { font-size: 0.95rem; font-weight: bold; margin-top: 2px; }
  </style>
</head>
<body>
<div class="container">
  <h1 id="page-title">🌍 世界の朝刊 NHK風同時通訳プレイヤー</h1>
  <div class="now-playing" id="now-playing">下のボタンまたは番組を選択して再生してください</div>
  <div class="video-box">
    <div id="yt-player"></div>
  </div>
  <div class="controls">
    <button onclick="playIndex(currentIndex)">▶ 映像と日本語音声を同時スタート</button>
    <button class="secondary" onclick="pauseBoth()">⏸ 一時停止</button>
    <button class="secondary" onclick="nextTrack()">⏭ 次の局へ</button>
    <label style="font-size: 0.85rem; margin-left: auto;">
      現地音ボリューム: <input type="range" id="orig-vol" min="0" max="50" value="15" oninput="changeOrigVol(this.value)">
    </label>
  </div>
  <div class="script-box" id="script-box">ここに日本語読み上げ原稿が表示されます。</div>
  <ul class="playlist" id="playlist"></ul>
</div>

<audio id="ja-audio"></audio>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
  const newsItems = [{"station": "BBC 英国", "title": "Ukraine's power supply close to critical as Russian strikes bring darkness and cold", "videoId": "j64ZuY0pGGE", "audioUrl": "audio/01_BBC_英国.mp3", "script": "BBC 英国の主要ニュースです。\nTopic 1: Ukraine's power supply close to critical as Russian strikes bring darkness and cold. Single mother Daryna Kulchytska has been trying to giver her son Kyryll (left) and daughter Olena (right) as normal a childhood as possible Daryna Kulchytska is a mum under pressure. A single parent in a seventh floor flat in Kyiv trying to feed two lively kids and ensure they do their homework. But Daryna also faces the added strain of a deadline she can't even be certain of. All she knows is soon the lights will go out, the sockets will lose power, the wi-fi will drop, and the taps will run dry. Tonight, the electricity has kept flowing an hour longer than advertised, but Daryna's still racing to serve dinner and finish her own work from home. \"The last few days it was only four or five hours we had power, but it's not at the same times. For two hours we have electricity, then for eight hours we don't.\" This rolling schedule of planned power cuts has been in place since October, as Russia intensified attacks on Ukraine's energy grid. Ukraine has responded by striking Russian oil refineries. Officials are concerned that life will quickly become unsustainable for millions of Ukrainians if power supplies cannot be maintained for at least four hours per day. Some privately warn that's close already, as some families are living with outages of up to 20 hours in Kyiv. The power cuts were introduced earlier this year than last winter, and they're already lasting longer - making homes like Daryna's darker and colder. She's wrapped in layers of clothing and a heavy coat - the temperature is dropping, indoors and out. Just before 7:30pm, there's a click and that's it - darkness until dawn. The lift doesn't work, the water will stop flowing because electricity is needed to pump it to their flat. So the torches and LED candles come out and Daryna, her son Kyryll and daughter Olena gather for a card game of Uno before an early night. Twelve-year-old Kyryll, speaking perfect English learned during two years living in the US, is frank about the disruption. \"There's no light, no water, no heat, no electricity. And no fun. All the fun got sucked out with the electricity,\" he says. \"We have a lot of board games. We have a whole shelf, but we've played them like a hundred thousand times already.\" Many families sit in the shadows as blackouts sweep entire neighbourhoods, smothering homes and streets in darkness.\nTopic 2: Democrat Scott Colom seals historic win in Mississippi Senate race. Colom is the first black person from the southern state elected to the US Senate in over 140 years.\nTopic 3: Israeli strike on hospital kills at least five Palestinians, Gaza civil defence agency says. The strike hit the surgery department of Nasser Hospital, injuring at least 20 people and causing extensive damage, a spokesperson says."}, {"station": "AlJazeera 中東", "title": "Netanyahu’s legacy: Personality politics reshapes Israeli democracy", "videoId": "Jvo7fFe4XbQ", "audioUrl": "audio/03_AlJazeera_中東.mp3", "script": "AlJazeera 中東の主要ニュースです。\nTopic 1: Netanyahu’s legacy: Personality politics reshapes Israeli democracy. Netanyahu’s fight for political survival turns the Knesset’s opening into a scene of insults and acrimony Prime Minister Benjamin Netanyahu called for a national unity government – at least among Jewish Israelis – during the swearing-in of Israel’s new parliament, or Knesset, on Tuesday, hoping to cling to power. The opposition to him, which now has a majority of seats but has yet to form a government, reacted with heckles, catcalls, and walkouts. Citing supposed internal and external threats, Netanyahu called for unity with the opposition bloc that has been tasked with forming a government to replace him. Netanyahu pointed to the threat posed by Iran and the increased number of democratically elected lawmakers who are Palestinian citizens of Israel, whom he accused, without evidence, of seeking Israel’s destruction. “We must do one thing – set aside every other consideration and form a national unity government. Only such a government will be able to meet challenges of this magnitude. It is impossible to handle them with a narrow government,” he said of the potential for a minority government that many analysts consider likely after coalition negotiations are complete. “I say this because here in this parliament they are seriously talking about forming a narrow government like this, a government that includes within it terror supporters, haters of Israel, or that would be dependent on them,” he said, referring to the parties representing Palestinian citizens of Israel. Even by the standards of Israeli politics, where analysts say personality has long overshadowed party and policy, Tuesday’s session was unusually contentious. Former Prime Minister Naftali Bennett heckled Netanyahu while trading barbs with the latter’s wife, Sara, and his hard-right ally Itamar Ben-Gvir, while many of the Palestinian lawmakers attacked by the prime minister during his speech walked out in protest. Gadi Eisenkot, who has been given the first chance to form a new government , subsequently cancelled previously scheduled coalition talks with Netanyahu and declared him “unfit for office”. Netanyahu has long played an outsized role in Israeli politics, helping transform the political system into one that is highly based on personalities, with voters typically identifying a leader they like first, and then focusing on policy discussions. Nevertheless, despite having contributed more to that change than any other politician, Netanyahu now finds himself fighting for his political life. If Eisenkot is able to form a viable new government – which still hangs in the balance – Netanyahu faces being frozen out of power, and a future in which his corruption trial continues without the protection of the prime minister’s office. There will also likely be an inquiry into his and his government’s failings in the run-up to the Hamas-led attack of October 7, 2023. His potential downfall, however, does not me"}, {"station": "ABC 豪州", "title": "Coalmine reopens despite previous owners saying royalties made it unprofitable", "videoId": "LviQw5YBXtQ", "audioUrl": "audio/10_ABC_豪州.mp3", "script": "ABC 豪州の主要ニュースです。\nTopic 1: Coalmine reopens despite previous owners saying royalties made it unprofitable. Dump trucks on the haul road at the mine. ( ABC Tropical North: Liam O'Connell ) A Queensland company has reopened the New Burton Coal Mine in the Bowen Basin. Premier David Crisafulli officially reopened the mine today. Mine owner Argo Resources Queensland says the state's coal royalties did not deter it from investing. A Queensland mining company has employed 275 workers and reopened a Bowen Basin coalmine that went into receivership in 2025. Argo Resources Queensland purchased the New Burton Mine near Moranbah, about 120 kilometres south-west of Mackay, from Bowen Coking Coal in June. It is the fourth mine Argo has a controlling interest in after acquiring a 70 per cent stake in Bowen Basin mines Broadlea, Carborough Downs and Ironbark in March for an undisclosed sum. Premier David Crisafulli reopened the mine today, saying coal mining had a \"bullish future\". \"People need to know that the future of mining in Queensland is secure,\" Mr Crisafulli said. \"But also, the future of coal mining in Queensland, and I'm talking about both thermal and met [metallurgical] coal, there's a future for both.\" David Crisafulli visits the mine for its reopening. ( ABC Tropical North: Liam O'Connell ) He said the Queensland government had not contributed to the mine with financial incentives or delayed royalty payments.\nTopic 2: Victorian Big Build inquiry rebukes agency on redactions. Heavily redacted documents from the Big Build authority have prompted harsh words from the Royal Commission into alleged corruption on major public projects.\nTopic 3: Pool's defibrillator not working when nine-year-old boy drowned. A coronial inquest into the drowning of a nine-year-old boy has been adjourned after new evidence, including the recording of Triple Zero calls, came to light in court."}];
  document.getElementById("page-title").textContent = "🌍 世界の朝刊 NHK風同時通訳プレイヤー (2026年11月12日)";

  let player = null;
  let currentIndex = 0;
  const audioEl = document.getElementById("ja-audio");
  const playlistEl = document.getElementById("playlist");

  newsItems.forEach((item, idx) => {
    const li = document.createElement("li");
    li.id = "item-" + idx;
    li.innerHTML = `<div><div class="station">${item.station}</div><div class="title">${item.title}</div></div><button>▶ 同時再生</button>`;
    li.onclick = () => playIndex(idx);
    playlistEl.appendChild(li);
  });

  function onYouTubeIframeAPIReady() {
    if (newsItems.length === 0) return;
    player = new YT.Player("yt-player", {
      videoId: newsItems[0].videoId,
      playerVars: { playsinline: 1, rel: 0 },
      events: {
        onReady: () => {
          player.setVolume(document.getElementById("orig-vol").value);
        }
      }
    });
  }

  function playIndex(idx) {
    if (idx < 0 || idx >= newsItems.length) return;
    currentIndex = idx;
    const item = newsItems[idx];

    document.querySelectorAll(".playlist li").forEach(el => el.classList.remove("active"));
    document.getElementById("item-" + idx).classList.add("active");
    document.getElementById("now-playing").textContent = "放送中: " + item.station + " - " + item.title;
    document.getElementById("script-box").textContent = item.script;

    if (player && player.loadVideoById) {
      player.loadVideoById({ videoId: item.videoId, startSeconds: 0 });
      player.setVolume(document.getElementById("orig-vol").value);
      player.playVideo();
    }
    audioEl.src = item.audioUrl + "?t=" + Date.now();
    audioEl.currentTime = 0;
    audioEl.play();
  }

  function pauseBoth() {
    if (player && player.pauseVideo) player.pauseVideo();
    audioEl.pause();
  }

  function nextTrack() {
    if (currentIndex + 1 < newsItems.length) {
      playIndex(currentIndex + 1);
    } else {
      pauseBoth();
      document.getElementById("now-playing").textContent = "本日の全ニュースの放送が終了しました。";
    }
  }

  function changeOrigVol(val) {
    if (player && player.setVolume) player.setVolume(val);
  }

  audioEl.addEventListener("ended", () => {
    nextTrack();
  });
</script>
</body>
</html>
