<script>
  const newsItems = [{"station": "BBC 英国", "title": "Zelensky urges US and Musk to lift Starlink restrictions and be on 'right side of history'", "videoId": "NE3wkrnU9ZM", "audioUrl": "audio/01_BBC_英国.mp3", "script": "BBC 英国の主要ニュースです。\nTopic 1: Zelensky urges US and Musk to lift Starlink restrictions and be on 'right side of history'. Restrictions have affected Ukraine's ability to intercept Russian missiles and drones A crucial US satellite internet service is still operating too slowly and affecting Ukraine's ability to stop Russian attacks, President Volodymyr Zelensky has said. \"We are counting on these restrictions being lifted. The protection of lives and Ukraine's energy infrastructure ahead of winter directly depends on this,\" he said. The issue over the speed of the Starshield system - a military-grade Starlink service owned by Elon Musk and provided to Ukraine by the US government - has been rumbling on for weeks. Zelensky said he had asked officials \"to work as closely as possible\" with the US government and Musk's company. \"It is important to be on the right side of history,\" he said. The BBC has asked the White House and Starlink for comment. US has floated Ukraine ceding Donbas for Nato membership, Zelensky says Ukraine uses the normal Starlink service for communications on the battlefield, while Starshield is used for the interception of missiles and drones in Ukraine airspace. The issue of speed restrictions was first identified in October. It led to conflicting accounts by both Elon Musk and US President Donald Trump. Musk said the US government was responsible as Starshield was controlled by them, but Trump denied being responsible and said he had told the billionaire owner to \"put it back\". It appeared to be returning to normal after a week, following which Ukraine said the restrictions were still being implemented. The connection issues coincided with a tense diplomatic stand-off between Zelensky and Trump over Ukrainian strikes on oil infrastructure within Russia. Trump said the strikes on Russian oil refineries, which Kyiv says are crucial to stemming the main revenue source for Moscow's war effort, had pushed global prices higher.\nTopic 2: Iran targets US military base in Bahrain with drone attack. It marks the second attack on the country in three days and comes as the US and Iran remain locked in a stand-off over the Strait of Hormuz.\nTopic 3: Three men sentenced to death in Jordan over fatal church mass shooting. The attack on funeral at a Greek Orthodox church killed nine and injured 34 others last month."}, {"station": "ABC 米国", "title": "Thousands run Cuba’s Marabana marathon as many protest US sanctions", "videoId": "Mv6f13v7wcw", "audioUrl": "audio/02_ABC_米国.mp3", "script": "ABC 米国の主要ニュースです。\nTopic 1: Thousands run Cuba’s Marabana marathon as many protest US sanctions. Thousands of people have run in Cuba’s Marabana marathon, using the event to protest U.S. economic sanctions HAVANA -- Thousands of people ran Sunday in Cuba’s most important international marathon, with some using the race to protest U.S. economic sanctions against the island. The Marabana marathon, held every November to commemorate the founding of Havana, took runners along city's iconic streets and landmarks, such as the Paseo del Prado and the Capitol building. Many wore signs expressing solidarity with Cuba. “Cuba is not a threat; the blockade is,” read the signs that many of the 3,000 participants wore on their backs. The U.S. embargo against Cuba was first imposed in 1960, after Fidel Castro led a revolution that toppled dictator Fulgencio Batista and nationalized properties belonging to U.S. citizens and corporations. As a result, the Caribbean country has endured decades of economic and financial troubles and is now being pushed to a breaking point after U.S. President Donald Trump announced in late January that he would impose tariffs on any country that sells or provides oil to Cuba. The warning has effectively cut off fuel to the island , leading to widespread power outages that disrupt water supplies and internet and telephone services. “The blockade is suffocating the Cuban people,\" Yuraldi Cava, a 58-year-old state employee, said while running. “We are going to win this fight.” Mayté Vigoa, Havana’s provincial government coordinator for sports, said the city had to make a major effort to hold the international race because of the island’s precarious economic conditions. She confirmed that the sportswear brand Adidas, a longtime sponsor of the competition, did not provide support this year. Other companies with longstanding ties to Cuba, including Meliá Hotels International, said they were withdrawing from the island because of the tightening of sanctions. Participants included families with children and people with disabilities dressed in sportswear and carrying water bottles as enthusiastic onlookers cheered them on from the sidewalks. Those protesting the sanctions included foreigners who wore red-and-white sweatshirts with the message “Cuba is not alone.” The marathon is recognized by the Association of International Marathons and Distance Races, and runners can use their times as official qualifying marks. The event also features a half-marathon, as well as the more popular 10-kilometer and 5-kilometer races.\nTopic 2: Czechs gather in big numbers to reject government's plan to overhaul funding of public media. Hundreds of thousands of people rallied in Prague against a government plan to overhaul funding for public broadcasters\nTopic 3: Zelenskyy warns Starshield restrictions threaten Ukraine’s energy defenses. Restrictions on the system hamper Kyiv’s ability to shoot down Russian drones."}, {"station": "AlJazeera 中東", "title": "Jordan sentences three men to death over deadly church attack in Karak", "videoId": "imbNJmNNKr4", "audioUrl": "audio/03_AlJazeera_中東.mp3", "script": "AlJazeera 中東の主要ニュースです。\nTopic 1: Jordan sentences three men to death over deadly church attack in Karak. Jordan sentences three men to death over deadly church attack in Karak Jordan’s State Security Court has sentenced three men to death for a church attack in Karak last month that killed nine people. The men were convicted on terrorism-related charges.\nTopic 2: Africa CDC says Ebola outbreak in DR Congo ‘still not under control’. 'If we don't stop this outbreak now, it would be the worst Ebola outbreak,' Africa ​CDC director says.\nTopic 3: Israeli drone filmed flying low outside homes in southern Lebanon. Video shows an Israeli drone flying at low altitude over a residential area in southern Lebanon."}, {"station": "DW ドイツ", "title": "Polish activists face opposition as they make abortion more accessible", "videoId": "dsxEiBPq2_w", "audioUrl": "audio/04_DW_ドイツ.mp3", "script": "DW ドイツの主要ニュースです。\nTopic 1: Polish activists face opposition as they make abortion more accessible. Abortion laws in Poland are very restrictive. Activists there have found a new way to help women wanting to terminate a pregnancy: the \"Abortomat,\" a locker that dispenses abortion pills. But they face fierce opposition. Women's rights activists in Poland have opened what they say is the world's first delivery locker supplying abortion pills in a country with one of Europe's most restrictive abortion laws . Known as the \"Abortomat,\" the locker is in a building opposite the Polish parliament, in what activists say is a clear message to politicians like Donald Tusk . The Polish prime minister pledged to introduce abortion on demand up to the 12th week of pregnancy before the 2023 parliamentary election, but his coalition has been unable to agree on a common position. Only two European Union member states, Poland and Malta, do not allow abortion on request. In Poland, abortion is only allowed when the pregnancy is the result of a crime — rape or incest — or when it endangers the health or life of the woman. Justyna Wydrzynska , an activist from a nonprofit organization called Abortion Dream Team, showed DW the \"Abortomat\" in a small room behind a tasseled portiere at Abotak, Poland's first abortion center. Inside, the pink lighting is subdued. Glitter tassels, baubles and spotlights make it feel a bit like a disco, she said. The \"Abortomat,\" which opened in late September, has 22 pink lockers. To open one, a woman receives a PIN code from the organization Women Help Women after completing a medical questionnaire, which is then checked by a doctor. Parcel lockers have sprung up like mushrooms after rain in Poland in recent years. Even the smallest villages have them. \"When you walk around Poland, vending machines are everywhere. This is our culture. People in the US have Amazon, we have vending machines for everything,\" said Wydrzynska. Women in Poland who have an abortion are not criminalized. But anyone who helps them terminate a pregnancy risks up to three years in prison. In 2023, Wydrzynska was the first activist to be convicted in Poland of helping a woman to have an abortion by sending her pills. The conviction was later overturned, and the court ordered a retrial.\nTopic 2: Nigeria's upcoming election marred by rising AI disinformation. As Nigeria inches closer to the 2027 polls, the use of artificial intelligence in the electoral process has prompted questions about integrity and institutional readiness. Can Nigerians trust their democratic processes?\nTopic 3: Fact check: 'Iranian' content farms reach millions. Several social media accounts claiming to represent the Iranian military show signs of being part of so-called content farms. DW Fact Check looks at how they operate and how users can spot them."}, {"station": "KBS 韓国", "title": "Gov't Moves to Suspend Certification of Exam Top Scorer Who Admitted Cheating", "videoId": "0OGQeTWYm0k", "audioUrl": "audio/07_KBS_韓国.mp3", "script": "KBS 韓国の主要ニュースです。\nTopic 1: Gov't Moves to Suspend Certification of Exam Top Scorer Who Admitted Cheating. Written: 2026-11-15 14:30:50 / Updated: 2026-11-15 14:33:32 Creative [4K] JISOO, ATEEZ, NCT DREAM, TWS, RESCENE, A2O SOUL, ILLIT, CHAERYEONG, UNCHILD | On the way to Music Bank 261113 2026-11-13 Wonder Hours with Hyerim NO CAP CONFESSIONS | Who Said Romance Is for Anniversaries Only? 2026-11-11 K-POP News November’s comeback lineup to warm up the winter chill! 2026-11-04 Copyright ⓒ KBS. All rights reserved. No copy, distribution or use of the content (AI learning included). This website is sponsored by the Korea Media and Communications Commission. The Web site is optimized for viewing in Chrome, Safari, Firefox and Internet Explorer 11 and higher versions. This website uses cookies and other technology to enhance quality of service. Continuous usage of the website will be considered as giving consent to the application of such technology and the policy of KBS. For further details >\nTopic 2: Rain to Hit Eastern Regions, Chilly Start to Monday. [Science] :Rain is expected to begin in eastern parts of the country, particularly along the east coast, on Monday and continue through early Tuesday.\n\nThe Korea Meteorological Administration forecasts five to 30 millimeters of rain in Gangwon Province and the Gyeongsang region, and about five millimeters on Jeju ...[more...]\nTopic 3: Mild, Non-Emergency Cases Account for 30% of ER Visits Last Year. [Domestic] :About 30 percent of patients who visited major emergency medical centers nationwide last year were found to have mild or non-emergency conditions, outnumbering those who required urgent medical care.\n\nAccording to a report released Sunday by the National Emergency Medical Center under the National Medical ...[more...]"}, {"station": "CNA アジア", "title": "Golf-crazy Trump to appeal ruling keeping Washington park open", "videoId": "7uWwrm2YypE", "audioUrl": "audio/09_CNA_アジア.mp3", "script": "CNA アジアの主要ニュースです。\nTopic 1: Golf-crazy Trump to appeal ruling keeping Washington park open. A judge keeps East Potomac Park open for now, blocking plans to shut the public space for a golf course renovation. The Washington Monument is seen as workers remove trees at East Potomac Park Golf Course, Monday, Oct. 26, 2026, in Washington. (AP Photo/Julia Demaree Nikhinson) WASHINGTON: US President Donald Trump criticised a judge's ruling that a park in the heart of Washington must remain open to the public, after his administration sought to close it for a golf course renovation . An avid golfer who owns courses around the world, Trump aims to turn Washington's East Potomac Golf Links, a public course with affordable rates, into a facility capable of hosting major championship-caliber events. \"Why would a judge want to delay taking a terrible and very unsafe golf course, one that is mocked all over DC (and far beyond!), instead of quickly turning it into a great and admired one?\" Trump wrote on Truth Social. The US president added that his administration will appeal the \"highly destructive and political decision of the judge.\" CNA Games Guess Word Crack the word, one row at a time Buzzword Create words using the given letters Mini Sudoku Tiny puzzle, mighty brain teaser Mini Crossword Small grid, big challenge Word Search Spot as many words as you can Show More Show Less The Trump administration has called for the Nov 15 closure of East Potomac Park, a 160-hectare expanse where the golf course is located, to begin construction. The Trump administration has called for the Nov 15 closure of East Potomac Park, a 160-hectare expanse where the golf course is located, to begin construction. But a lawsuit filed by an environmental group blocked the closure, with US District Judge Ana Reyes on Saturday granting a temporary restraining order that required the park remain open for now as the lawsuit works its way through the courts. \"The Government proposes to close a historic park, daily enjoyed by Washingtonians of all stripes, indefinitely,\" Reyes wrote in the 30-page ruling. \"This closure would irreparably harm Plaintiffs, who use the Park regularly for recreational activities.\" She had previously ruled against the early demolition work conducted for the project, including the cutting down of more than 500 trees along the course. The golf course is one of several projects launched by Trump in a bid to put his personal stamp on the US capital, such as the White House ballroom and a massive triumphal arch, despite fierce local opposition and multiple legal challenges.\nTopic 2: Pope visits high Andes, testing cancer recovery.\nTopic 3: Czechs stage huge rally against public-media funding overhaul."}, {"station": "ABC 豪州", "title": "Worrying signs as Wallabies leave it too late to fire in Scotland defeat", "videoId": "XhnyVFd76OA", "audioUrl": "audio/10_ABC_豪州.mp3", "script": "ABC 豪州の主要ニュースです。\nTopic 1: Worrying signs as Wallabies leave it too late to fire in Scotland defeat. The Wallabies are running out of time, and excuses. ( AP Photo: Scott Heppell ) It might be unfair to be overly critical about the Wallabies' latest defeat, this time to Scotland at Murrayfield. The Wallabies fall to a fourth straight defeat as Scotland claims a 15-12 victory in a dour display at Murrayfield. This was an afternoon of such monochrome dreariness that even Scotland couldn't muster much of their usual attacking verve, dank and grey, the lingering firework smoke above the playing surface reminiscent of some primordial Celtic realm It was far removed from the bright lights of Friday night in Paris or Saturday afternoon in Cardiff. Opposing skippers Rory Darge and Harry Wilson both referred to the game as descending into an arm-wrestle, though at times the contest we witnessed was so bad that calling it as such would almost be cruel to practitioners of that maligned pastime. But then again, autumnal Scottish afternoons are just not what the proponents of free-flowing, attacking rugby union had in mind as ideal conditions for their craft. Les Kiss said as much to UK broadcaster ITV, describing the game as \"turgid\". \"I think [Gregor Townsend] and I both would have preferred some drier weather,\" he added. Both teams struggled to hold onto the ball in cold and wet conditions. ( Getty Images: David Rogers ) Undoubtedly, the conditions were reflected in the Scottish play as the hosts produced a litany of errors, most of which were a by-product of a series of over-complicated running lines that looked perfect when drawn up in the dryness and warmth of the training rooms, but less so when countered by the freezing rain and fast-pressing Wallabies defence. That defence is worth pointing out as a positive.\nTopic 2: Live: Unions, industry join forces to call for passage of gas reservation scheme. Unions and businesses groups sign an open letter calling for the federal parliament to back the government's proposed gas reservation scheme. Follow live.\nTopic 3: Labor urged to address fire station delays months before fatal blaze. The Geelong council wrote to the state government just months before a fatal Armstrong Creek house fire, urging it to take greater responsibility for delays in delivering a promised fire station for the major growth area."}];
  document.getElementById("page-title").textContent = "🌍 世界の朝刊 NHK風同時通訳プレイヤー (2026年11月16日)";

  let player = null;
  let currentIndex = 0;
  const audioEl = document.getElementById("ja-audio");
  const playlistEl = document.getElementById("playlist");

  newsItems.forEach((item, idx) => {
    const li = document.createElement("li");
    li.id = "item-" + idx;
    li.innerHTML = `<div><div class="station">${item.station}</div><div class="title">${item.title}</div></div><button>▶ 同時再生</button>`;
    li.onclick = () => playIndex(idx);
    playlistEl.appendChild(li);
  });

  function onYouTubeIframeAPIReady() {
    if (newsItems.length === 0) return;
    player = new YT.Player("yt-player", {
      videoId: newsItems[0].videoId,
      playerVars: { playsinline: 1, rel: 0 },
      events: {
        onReady: () => {
          player.setVolume(document.getElementById("orig-vol").value);
        }
      }
    });
  }

  function playIndex(idx) {
    if (idx < 0 || idx >= newsItems.length) return;
    currentIndex = idx;
    const item = newsItems[idx];

    document.querySelectorAll(".playlist li").forEach(el => el.classList.remove("active"));
    document.getElementById("item-" + idx).classList.add("active");
    document.getElementById("now-playing").textContent = "放送中: " + item.station + " - " + item.title;
    document.getElementById("script-box").textContent = item.script;

    if (player && player.loadVideoById) {
      player.loadVideoById({ videoId: item.videoId, startSeconds: 0 });
      player.setVolume(document.getElementById("orig-vol").value);
      player.playVideo();
    }
    audioEl.src = item.audioUrl + "?t=" + Date.now();
    audioEl.currentTime = 0;
    audioEl.play();
  }

  function pauseBoth() {
    if (player && player.pauseVideo) player.pauseVideo();
    audioEl.pause();
  }

  function nextTrack() {
    if (currentIndex + 1 < newsItems.length) {
      playIndex(currentIndex + 1);
    } else {
      pauseBoth();
      document.getElementById("now-playing").textContent = "本日の全ニュースの放送が終了しました。";
    }
  }

  function changeOrigVol(val) {
    if (player && player.setVolume) player.setVolume(val);
  }

  audioEl.addEventListener("ended", () => {
    nextTrack();
  });
</script>
</body>
