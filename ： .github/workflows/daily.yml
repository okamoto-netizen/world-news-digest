name: Morning News Delivery

on:
  schedule:
    # UTC 20:00 ＝ 日本時間(JST) 毎朝 05:00
    - cron: '0 20 * * *'
  # 手動でいつでも即時実行できる設定
  workflow_dispatch:

jobs:
  run-news:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Pythonの準備
        uses: setup-python@v5
        with:
          python-version: '3.10'

      - name: 必要ライブラリのインストール
        run: |
          pip install google-api-python-client

      - name: スクリプト実行
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          python main.py
